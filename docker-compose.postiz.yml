# Postiz self-host stack — LeadGen AI own-brand social auto-posting backend.
# Chalao: docker compose -f docker-compose.postiz.yml --env-file deploy/postiz/.env up -d
# Setup runbook: scripts/setup_postiz.sh (DNS + Caddy + secrets + first-run steps).
#
# Apna alag postgres/redis + alag network — main leadgen stack se fully isolated
# (leadgen_db/redis ko touch nahi karta). Sirf 127.0.0.1:5000 pe exposed; public
# access host-Caddy reverse-proxy (postiz.leadsgenai.in) se hota hai.

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: leadgen_postiz
    restart: unless-stopped
    environment:
      MAIN_URL: "${POSTIZ_MAIN_URL:-https://postiz.leadsgenai.in}"
      FRONTEND_URL: "${POSTIZ_MAIN_URL:-https://postiz.leadsgenai.in}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_MAIN_URL:-https://postiz.leadsgenai.in}/api"
      JWT_SECRET: "${POSTIZ_JWT_SECRET:?run scripts/setup_postiz.sh to generate deploy/postiz/.env}"
      DATABASE_URL: "postgresql://postiz:${POSTIZ_DB_PASSWORD:?}@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      # Pehla admin account banne ke baad "true" karo (open signup band).
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      # --- Platform OAuth app keys (optional; jo set hoga wahi channel connect hoga) ---
      # X (free tier ~500 posts/mo): developer.x.com -> app -> keys
      X_API_KEY: "${X_API_KEY:-}"
      X_API_SECRET: "${X_API_SECRET:-}"
      # LinkedIn ("Share on LinkedIn" product self-serve hai personal posting ke liye)
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      # Facebook/Instagram (dev-mode app = apne hi Pages pe kaam karta, review ke bina)
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      # Reddit / Mastodon / Discord bhi supported — Postiz docs dekho, yahin add karo.
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - postiz-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: leadgen_postiz_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD:?}"
      POSTGRES_USER: postiz
      POSTGRES_DB: postiz
    volumes:
      - postiz-db-data:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2-alpine
    container_name: leadgen_postiz_redis
    restart: unless-stopped
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postiz-config:
  postiz-db-data:
  postiz-redis-data:
  postiz-uploads:

networks:
  postiz-network:
