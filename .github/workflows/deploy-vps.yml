# =============================================================================
# deploy-vps.yml â€” REAL auto-deploy to the Hostinger VPS (replaces Cloud Run).
#
# Flow on every push to main:
#   1) gate         : fast deterministic checks (import smoke + prod_check + ruff +
#                     billing contract) — branch-protection required check (auto-merge)
#   2) pytest-*     : OPTIONAL 4 parallel shards when repo var DEPLOY_RETEST=true.
#                     Default OFF — PR CI already ran the suite (2026-08-15 DSH lanes).
#   3) release-gate : needs `gate` only (skipped optional shards must not block deploy)
#   4) build        : build Docker image, push to GHCR (immutable :<sha> only)
#   5) deploy       : SSH to VPS -> pull image -> docker compose up -d -> migrate -> health
#
# One-time GitHub repo secrets required (Settings > Secrets and variables > Actions):
#   VPS_HOST     = 72.61.245.204
#   VPS_USER     = root
#   VPS_SSH_KEY  = <private key matching the VPS authorized_keys>
#   GHCR_PAT     = <classic PAT with read:packages>  (used by the VPS to pull)
#
# pytest runs but does NOT block deploys yet (continue-on-error) â€” flip to a hard
# gate once the CI test env is stable. The fast checks below DO block.
# =============================================================================
name: deploy-vps (gate-only)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sumitrevolt/leadgenrationaivoiceagent

jobs:
  gate:
    name: Gate (billing contract + golden eval)
    # 2026-09-14 audit: removed steps already covered by CI (ci.yml):
    #   - Import smoke / compileall  -> CI quality lane
    #   - prod_check.py              -> CI prod-check lane
    #   - Skill quality ratchet      -> CI quality lane
    #   - Ruff lint                  -> CI quality lane
    # CI runs these on EVERY push+PR. Duplicating them wastes ~5 min per push.
    # What remains is UNIQUE to deploy: billing contract tests + golden eval.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (lock file â€” same as Dockerfile.lock + tests.yml)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock.txt
          # -U + PINS zaroori (tests.yml gotcha): lock ke purane pytest/pytest-asyncio
          # ke upar akela `-U pytest` = version-mismatch => "no current event loop"
          # (2026-07-06 pehla blocking run isi se laal hua).
          # Locked test stack (pytest 7.4.4 + pytest-asyncio 0.23.4 + httpx 0.28.1 from
          # the lock — the project's declared/tested pair). The old -U override forced
          # pytest-asyncio 1.3.0 which, with aiosqlite 0.22.x, amplified an aiosqlite
          # connection-worker leak (SQLAlchemy #13039) that a Linux cyclic-GC pass
          # segfaulted on (exit-139). httpx 0.28.1 handled by the conftest TestClient shim.
          pip install --no-deps "pytest-timeout==2.4.0"
      - name: Contract tests (billing/pricing truth â€” BLOCKING)
        # Deterministic, no-network. Pricing/plan/route regression => deploy blocked.
        run: pytest -q tests/test_billing_truth_2026.py
      - name: Golden eval suite (advisory — non-blocking until stable)
        # Tier-1 Salesforce-style golden dataset. Deterministic asserts always run;
        # semantic LLM-judge skips without key. Flip continue-on-error off only after
        # the suite is proven green across several main builds.
        continue-on-error: true
        env:
          APP_ENV: test
          ENVIRONMENT: development
        run: |
          python scripts/eval_golden.py --deterministic-only
          pytest -q tests/test_eval_golden.py
  pytest-shards:
    name: pytest shard ${{ matrix.group }}/4
    # Default OFF. PR CI already ran the same suite (ci.yml parallel shards).
    # Re-running 4 full shards on every main push delayed GHCR build + deploy.
    # Owner opt-in: repo variable DEPLOY_RETEST=true.
    if: ${{ vars.DEPLOY_RETEST == 'true' }}
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (lock file - same as gate)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock.txt
          pip install --no-deps "pytest-timeout==2.4.0"
          pip install --no-deps "pytest-split==0.9.0"
      # Same process-shard strategy as ci.yml (exit-139 containment). Parallel:
      # 2026-08-10 the full suite ran sequentially inside the 15-min gate and
      # timed out/cancelled, skipping GHCR build + VPS deploy.
      - name: pytest shard ${{ matrix.group }}/4 (BLOCKING, network-free)
        env:
          GROQ_API_KEY: ci-dummy-key-not-real
          APP_ENV: test
          ENVIRONMENT: development
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          set +e
          pytest -q -m "not network" --ignore=tests/integration \
            --splits 4 --group "${{ matrix.group }}"
          rc=$?
          if [ "$rc" -eq 139 ]; then
            echo "::warning title=exit-139::shard ${{ matrix.group }}/4 cyclic-GC SIGSEGV; one retry (no skip)"
            pytest -q -m "not network" --ignore=tests/integration \
              --splits 4 --group "${{ matrix.group }}"
            rc=$?
          fi
          exit "$rc"

  release-gate:
    # NAME HONESTY FIX (2026-09-14): this lane was named "gate + all 4 shards green"
    # while `needs: [gate]` — the 4 pytest shards were NOT a dependency (they are
    # opt-in behind DEPLOY_RETEST, and a skipped needed job would skip this gate).
    # The old name asserted a guarantee the lane never provided. Renamed to state
    # exactly what it checks. Do NOT re-broaden the name without adding the deps.
    name: Release gate (billing contract + golden eval)
    # Shards are opt-in (DEPLOY_RETEST). A skipped needed job would skip this
    # gate and block build/deploy, so release-gate depends only on `gate`.
    # Required PR checks already covered the suite before merge.
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release ready
        run: echo "deploy-vps gate green - release path unlocked"
# =============================================================================
# ONE DEPLOY AUTHORITY (2026-09-14, Engineering Assurance audit)
# =============================================================================
# The `build:` (GHCR push) and `deploy:` (SSH -> sudo /usr/local/sbin/leadgen-deploy-release)
# jobs were REMOVED from this workflow. They were a SECOND, divergent release mechanism,
# not a wrapper over the canonical one. Read-only inspection of the VPS wrapper on
# 2026-09-14 showed it does:
#     export APP_VERSION=$SHA ; docker compose pull ; docker compose up -d --remove-orphans ;
#     docker compose run --rm app alembic upgrade head ; curl /health/ready
# — i.e. it PULLS a pre-built GHCR image. The canonical scripts/deploy_vps.sh instead
# builds from an isolated candidate worktree and additionally enforces: the runtime-data
# guard, the `prod_check.py --deployment` gate, ff-only checkout advance, the 5-service
# anti-skew rollout (+ dsh-worker), `/health.version == <sha>`, the revenue/auth smoke
# suite, and lineage-aware retention. The wrapper provided NONE of those.
#
# Two mechanisms with different guarantees is exactly the "duplicated/overlapping release
# logic" that makes a release unauditable. AGENTS.md §3 already declares the script the
# authority and hand-written docker commands forbidden — so the CI path was a bypass.
#
# DECISION: the SINGLE deploy authority is `scripts/deploy_vps.sh`, run ON the VPS from
# /opt/leadgen:
#     cd /opt/leadgen && setsid nohup bash scripts/deploy_vps.sh > /tmp/dep.log 2>&1 &
#     # then poll /tmp/dep.log ; DRY_RUN=1 prints the plan and changes nothing
#
# This workflow is now GATE-ONLY. It cannot publish an image and cannot reach the VPS —
# there is no job left that can. Do NOT re-add a deploy job here; if a CI-initiated
# release is ever wanted, it MUST invoke scripts/deploy_vps.sh (the one authority) rather
# than a parallel wrapper, and that is an owner decision.
#
# Least privilege now holds: this workflow no longer requests `packages: write`, and the
# VPS_HOST / VPS_USER / VPS_SSH_KEY / GHCR_PAT / VPS_DEPLOY_USER / VPS_SSH_KEY_DEPLOY
# repo secrets are no longer referenced by any job here.
# =============================================================================
