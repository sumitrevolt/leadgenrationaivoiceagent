# =============================================================================
# deploy-vps.yml — REAL auto-deploy to the Hostinger VPS (replaces Cloud Run).
#
# Flow on every push to main:
#   1) gate     : fast deterministic checks (import smoke + prod_check + ruff)
#   2) build    : build Docker image, push to GHCR (tagged :latest and :<sha>)
#   3) deploy   : SSH to VPS -> pull image -> docker compose up -d -> migrate -> health
#
# One-time GitHub repo secrets required (Settings > Secrets and variables > Actions):
#   VPS_HOST     = 72.61.245.204
#   VPS_USER     = root
#   VPS_SSH_KEY  = <private key matching the VPS authorized_keys>
#   GHCR_PAT     = <classic PAT with read:packages>  (used by the VPS to pull)
#
# pytest runs but does NOT block deploys yet (continue-on-error) — flip to a hard
# gate once the CI test env is stable. The fast checks below DO block.
# =============================================================================
name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sumitrevolt/leadgenrationaivoiceagent

jobs:
  gate:
    name: Gate (import + prod_check + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (lock file — same as Dockerfile.lock + tests.yml)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock.txt
          pip install -U "httpx==0.27.2" ruff pytest
      - name: Import smoke (catches syntax/import/route breakage)
        run: python -c "import app.main; print('import OK')"
      - name: Production check
        run: python scripts/prod_check.py
      - name: Lint (ruff, non-blocking warnings)
        run: ruff check app || true
      - name: Tests (reported, not yet blocking)
        continue-on-error: true
        run: pytest -q --ignore=tests/integration || true

  build:
    name: Build & push image (GHCR)
    needs: gate
    # Activates only after you set repo variable DEPLOY_ENABLED=true (and the VPS
    # secrets). Until then, pushes just run the `gate` job — no failing deploys.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lock
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT,GITHUB_SHA
          script_stop: true
          script: |
            set -e
            export GHCR_PAT="${{ secrets.GHCR_PAT }}"
            export GITHUB_SHA="${{ github.sha }}"
            cd /opt/leadgen
            # --- capture currently-running image for AUTO-ROLLBACK on bad deploy ---
            PREV_IMG_ID="$(docker inspect leadgen_app --format '{{.Image}}' 2>/dev/null || echo '')"
            echo "==> prev image id: ${PREV_IMG_ID:-none}"
            echo "==> sync compose + migrations from git"
            git fetch --all --quiet || true
            git checkout main --quiet || true
            git pull --ff-only || true
            echo "==> login GHCR + pull image ${GITHUB_SHA}"
            echo "${GHCR_PAT}" | docker login ghcr.io -u sumitrevolt --password-stdin
            export APP_VERSION="${GITHUB_SHA}"
            # LIVE stack celery profile ke saath chalta hai (worker+worker-heavy+scheduler).
            # Profile ke BINA `up --remove-orphans` un containers ko ORPHAN maan ke
            # REMOVE kar deta — isliye profile yahan explicit hai.
            export COMPOSE_PROFILES=celery
            docker compose -f docker-compose.vps.yml pull
            echo "==> roll the stack (fresh image -> no stale .pyc possible)"
            docker compose -f docker-compose.vps.yml up -d --remove-orphans
            echo "==> apply migrations (idempotent)"
            docker compose -f docker-compose.vps.yml run --rm app alembic upgrade head || true
            echo "==> health gate: /health/ready (db+redis) with retries"
            ok=0
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1; then ok=1; break; fi
              echo "   not ready yet ($i/12)…"; sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "!!! HEALTH FAILED — AUTO-ROLLBACK to previous image"
              if [ -n "$PREV_IMG_ID" ]; then
                docker tag "$PREV_IMG_ID" ghcr.io/sumitrevolt/leadgenrationaivoiceagent:rollback
                APP_VERSION=rollback COMPOSE_PROFILES=celery docker compose -f docker-compose.vps.yml up -d --remove-orphans || true
                sleep 8
                curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1 && echo "   rolled back, healthy again" || echo "   ROLLBACK ALSO UNHEALTHY — manual check needed"
              else
                echo "   no previous image captured — manual rollback (see CLAUDE.md)"
              fi
              exit 1
            fi
            echo "==> HEALTH OK (ready)"
            docker image prune -f || true
