# =============================================================================
# CI — automated quality gate (SaaS-infra: "Infrastructure → CI/CD" pillar).
#
# Required ruleset contexts (do NOT rename):
#   - Lint + syntax + secrets
#   - prod_check + pytest          ← aggregator over parallel lanes
#   - harness real-redis integration
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "**/*.bak"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint + syntax + secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Syntax check (compileall)   # MUST-PASS — syntax error = red
        run: python -m compileall -q -x '.*/\.claude/.*' app scripts
      - name: Secret scan                 # MUST-PASS — no secrets in commit
        run: python scripts/check_secrets.py --all
      - name: Security misconfig scan     # MUST-PASS — no misconfigurations in commit
        run: python scripts/security_scan.py --quick
      - name: Ruff lint (non-blocking)    # informational only — style debt does not block merge
        run: ruff check --output-format=github --exclude .claude/ . || true

  prod-check:
    name: prod_check + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements-lock.txt 2>/dev/null || pip install -r requirements.txt
      - name: Prod check runtime gates
        run: python scripts/prod_check.py
      - name: Pytest (PR/dispatch only)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: pytest tests -m "not network" -q --no-header -p no:cacheprovider --timeout=60 -n auto --ignore=.claude

  harness:
    name: harness real-redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements-lock.txt 2>/dev/null || pip install -r requirements.txt
      - name: Harness runtime gates
        env:
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/prod_check.py --harness-only
