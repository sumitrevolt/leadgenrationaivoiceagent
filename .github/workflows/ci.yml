# =============================================================================
# CI — automated quality gate (SaaS-infra: "Infrastructure → CI/CD" pillar).
# Pehle koi CI nahi tha (tests sirf manual run_tests.bat se deploy se pehle).
# Ab har push/PR pe GitHub Actions automatically gate chalata — broken code main
# tak na pohnche. GitHub-hosted runner (free) — VPS deploy isse ALAG (woh manual
# git-pull + docker rehta, ye sirf pre-merge quality gate hai).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "**/*.bak"]
  # NO paths-ignore on pull_request (2026-07-25). The `Protect main` ruleset
  # requires "Lint + syntax + secrets", "prod_check + pytest" and "harness
  # real-redis integration" — all defined in THIS workflow. With a path filter
  # a docs-only PR never triggers them, so those required contexts never report
  # and the PR is permanently BLOCKED (mergeable=MERGEABLE, state=BLOCKED).
  # Running CI on docs PRs costs a few minutes; faking the contexts would
  # weaken the gate, so we run them for real instead.
  pull_request:
    branches: [main]
  # Manual escape hatch (2026-08-01). GitHub silently dropped every
  # pull_request event for PR #204's head for over two hours (no
  # github-actions check suite was even created on its pushes, while other
  # PRs' events fired normally), leaving the REQUIRED contexts above
  # permanently unreported and the PR blocked. workflow_dispatch lets a
  # maintainer run the exact same blocking jobs on any ref when event
  # delivery fails; check runs attach to the ref's head commit, so the PR's
  # required contexts report normally. No job behaviour differs by trigger.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, dependency-light gate — hamesha reliable (koi heavy ML dep nahi).
  quality:
    name: Lint + syntax + secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # skill CI compares the complete PR/push range
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Syntax check (compileall)   # MUST-PASS — syntax error = red
        run: python -m compileall -q app scripts
      - name: Secret scan                 # MUST-PASS — no secrets in commit
        run: python scripts/check_secrets.py
      - name: Security misconfig scan     # MUST-PASS — no misconfigurations in commit
        run: python scripts/security_scan.py
      - name: Skill quality + security ratchet  # MUST-PASS — strict on added/modified skills
        env:
          SKILL_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python scripts/skill_evals/check_repo_skills.py --base-ref "$SKILL_CI_BASE"
      - name: Queue idempotency audit     # RATCHET — static-scan gaps > baseline = fail (naye tasks bina dedup na aayen)
        env:
          # 2026-07-06 baseline: 117 static gaps (kai tasks ka dedup scheduler/
          # day-key layer pe hai jo heuristic nahi dekhta). Naya gap = RED.
          IDEM_AUDIT_MAX_GAPS: "117"
        run: python scripts/queue_idempotency_audit.py
      # NOTE: the two runtime-data gates live in the `tests` job, not here.
      # They import app.platform (-> pydantic) and this job installs only ruff,
      # so here they could never do anything but ModuleNotFoundError.

      - name: Dependency vulnerability scan  # MUST-PASS — no known CVEs in dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --format=json || true  # advisory until lock file refreshed
      - name: Type check (mypy)            # advisory — 1522 pre-existing errors (2026-07-06); type-debt visible, merge-gate nahi
        run: |
          pip install mypy
          mypy app --ignore-missing-imports --no-error-summary || true
      - name: Ruff lint (repo config)     # informational annotations (style debt block na kare)
        run: ruff check --output-format=github app || true

  # Full gate — runtime deps (Dockerfile.lock-mirror) + prod_check + pytest.
  # `-m "not network"` = LLM/internet tests skip (repo marker, no API keys CI me).
  tests:
    name: prod_check + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libs (voice/audio imports)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install Python deps (mirrors Dockerfile.lock)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if [ -f requirements.lock.txt ]; then
            grep -v -E "^(playwright|selenium)" requirements.lock.txt > req.filtered || cp requirements.lock.txt req.filtered
            pip install --no-deps -r req.filtered
          else
            pip install -e ".[dev,monitoring]"
          fi
          # torch CPU (Dockerfile.lock jaisa) + test tooling (lock me na ho to).
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu || true
          # Use the LOCKED test stack from requirements.lock.txt (pytest 7.4.4 +
          # pytest-asyncio 0.23.4 + httpx 0.28.1). The old `-U pytest-asyncio==1.3.0`
          # override forced a stack 2 majors above the project's declared/tested one;
          # with aiosqlite 0.22.x + this repo's 0.23.x-era event-loop fixtures it
          # amplified an aiosqlite connection-worker leak (SQLAlchemy #13039 / aiosqlite
          # #369) that a Linux cyclic-GC pass segfaulted on (intermittent exit-139).
          # httpx 0.28.1 is handled by the TestClient compat shim in tests/conftest.py.
          # Add ONLY pytest-timeout (needed by --timeout, absent from the lock).
          pip install --no-deps "pytest-timeout==2.4.0"
          # Guard: torch + the -U pytest/httpx installs above re-resolve and drift
          # pydantic-core forward (2.47.0), past what pydantic 2.13.4 needs (==2.46.4),
          # breaking app.main import in prod_check. Re-pin to the lock version.
          pip install --no-deps --force-reinstall "pydantic-core==2.46.4"
      - name: Runtime-data mutable-path allowlist  # MUST-PASS — allowlist must match live code
        # Schema + allowlist coherence: no stale entries, no unknown store ids,
        # no operation mismatch, no writer filed against an immutable store.
        # Offline, deterministic, no network, no production access.
        # Lives here (not in the lint job) because it imports app.platform.
        run: python scripts/runtime_data_path_scan.py validate

      - name: Runtime-data debt ratchet  # MUST-PASS — no NEW undeclared writers
        # Monotonic gate. Existing frozen debt (KNOWN_UNRESOLVED_DEBT) is
        # tolerated; a new undeclared/ambiguous finding or a classification
        # regression FAILS. Compared by fingerprint, not by count, because
        # "one dangerous writer added + one unrelated finding removed" leaves
        # the count unchanged.
        # No baseline auto-update here — regenerating is a local, reviewed,
        # committed action (scripts/runtime_data_baseline_gen.py). There is no
        # bypass variable and no --accept-current-state anywhere.
        run: python scripts/runtime_data_path_scan.py ratchet

      - name: Production readiness check
        run: python scripts/prod_check.py
      - name: Pytest (skip network/LLM-key tests)
        env:
          APP_ENV: test
          ENVIRONMENT: development  # local-dev parity (prod-default middleware OFF)
          # TelecallerBrain __init__ key-presence check — dummy kaafi (LLM calls
          # conftest-stubbed, no network).
          GROQ_API_KEY: ci-dummy-key-not-real  # pragma: allowlist secret
          # Torch/OpenMP thread storms have segfaulted TestClient lifespan on
          # GH runners (exit 139). Bound native threads for CI stability.
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
          # Next exit-139 must leave a Python dump (cyclic-GC SIGSEGV class,
          # 2026-07-28). Does not weaken the required suite.
          PYTHONFAULTHANDLER: "1"
        # Four sequential process shards + one exit-139 retry per shard: same
        # required suite, shorter per-process heap lifetime. Cyclic-GC SIGSEGV
        # (exit 139, Garbage-collecting top frame) has hit fixture setup,
        # scan_repo, markitdown, and team.log_event — one long-lived pytest
        # process concentrates native-extension GC risk. Shards + a single
        # retry contain blast radius without skipping or xfailing anything.
        run: |
          pip install --no-deps "pytest-split==0.9.0"
          set -euo pipefail
          for group in 1 2 3 4; do
            echo "::group::pytest shard ${group}/4"
            set +e
            pytest -m "not network" -q --no-header -p no:cacheprovider --timeout=60 \
              --splits 4 --group "${group}"
            rc=$?
            if [ "$rc" -eq 139 ]; then
              echo "::warning title=exit-139::shard ${group}/4 cyclic-GC SIGSEGV; one retry (no skip)"
              pytest -m "not network" -q --no-header -p no:cacheprovider --timeout=60 \
                --splits 4 --group "${group}"
              rc=$?
            fi
            set -e
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            echo "::endgroup::"
          done



  # Mandatory real-Redis integration gate for the durable harness audit backend.
  # Starts a real Redis with AOF + noeviction (the production durability posture)
  # and runs the integration suite against it. A SKIPPED real-Redis suite is NOT
  # allowed to pass here: HARNESS_REQUIRE_REDIS=1 turns "no Redis" into a failure.
  harness-redis-integration:
    name: harness real-redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Docker Hub is a THIRD-PARTY dependency of a REQUIRED check: a registry
      # timeout here reds the PR and blocks the merge train even though nothing
      # is wrong with the code (observed 2026-07-25 on PR #141 —
      # `registry-1.docker.io ... Client.Timeout exceeded`, exit 125).
      #
      # Splitting pull from run is what makes the retry SAFE: only the network
      # fetch is retried, and it is bounded (4 attempts, exponential backoff,
      # per-attempt timeout). The container start below then uses `--pull=never`,
      # so it can NEVER reach the registry — any failure there is a real Redis or
      # application failure and fails immediately, with no retry masking it.
      - name: Pull Redis image (bounded retry — registry/network flake ONLY)
        run: |
          set -uo pipefail
          image="redis:7-alpine"
          attempts=4
          delay=5
          # Arithmetic while-loop, NOT `for i in $(seq ...)`: if `seq` were ever
          # missing the for-loop body would run ZERO times and the step would
          # exit 0 — a retry wrapper that silently reports success is worse than
          # no retry at all. This form cannot degrade that way.
          i=1
          while [ "$i" -le "$attempts" ]; do
            if timeout 120 docker pull "$image"; then
              echo "::notice title=Registry::Pulled $image on attempt $i/$attempts"
              exit 0
            fi
            if [ "$i" -eq "$attempts" ]; then
              echo "::error title=Registry infrastructure failure::Could not pull $image after $attempts attempts (Docker Hub unreachable). This is NOT an application or test failure."
              exit 1
            fi
            echo "::warning title=Registry infrastructure flake::Pull attempt $i/$attempts failed; retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 ))
            i=$(( i + 1 ))
          done
          echo "::error title=Registry infrastructure failure::Retry loop exhausted without a definitive result."
          exit 1
      - name: Start real Redis (AOF everysec, noeviction, persistent volume)
        run: |
          docker run -d --name redis-audit -p 6379:6379 --pull=never \
            -v "${{ runner.temp }}/redis-audit-data:/data" \
            redis:7-alpine redis-server \
            --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --dir /data
          for i in $(seq 1 20); do docker exec redis-audit redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
      - name: Verify Redis durability posture (fail if AOF off)
        run: |
          test "$(docker exec redis-audit redis-cli CONFIG GET appendonly | tail -1)" = "yes"
          test "$(docker exec redis-audit redis-cli CONFIG GET maxmemory-policy | tail -1)" = "noeviction"
          docker exec redis-audit redis-cli EVAL "return 1" 0
      - name: System libs (voice/audio imports)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install Python deps (mirrors Dockerfile.lock)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if [ -f requirements.lock.txt ]; then
            grep -v -E "^(playwright|selenium)" requirements.lock.txt > req.filtered || cp requirements.lock.txt req.filtered
            pip install --no-deps -r req.filtered
          else
            pip install -e ".[dev,monitoring]"
          fi
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu || true
          # Locked test stack (same rationale as the prod_check+pytest job above);
          # add ONLY pytest-timeout, without overriding the locked pytest/asyncio/httpx.
          pip install --no-deps "pytest-timeout==2.4.0"
          pip install --no-deps --force-reinstall "pydantic-core==2.46.4"
      - name: Real-Redis integration tests (mandatory — fail on skip)
        env:
          APP_ENV: test
          ENVIRONMENT: development
          HARNESS_TEST_REDIS_URL: redis://localhost:6379/15
          HARNESS_REQUIRE_REDIS: "1"
        run: |
          pytest tests/test_harness_audit_backend_integration.py -q --no-header \
            -p no:cacheprovider --timeout=120 -rs | tee integ.out
          # Guard: a skipped required suite must never pass.
          if grep -qiE "skipped|no tests ran" integ.out; then echo "REAL-REDIS SUITE SKIPPED — FAIL"; exit 1; fi
