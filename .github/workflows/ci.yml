name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "**/*.bak"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint + syntax + secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Syntax check (compileall)
        run: python -m compileall -q -x '.*/\.claude/.*' app scripts
      - name: Secret scan
        run: python scripts/check_secrets.py --all

  prod-check:
    name: prod_check + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements-lock.txt 2>/dev/null || pip install -r requirements.txt
      - name: Prod check runtime gates
        run: python scripts/prod_check.py
      - name: Pytest (PR only)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: pytest tests -m "not network" -q --no-header -p no:cacheprovider --timeout=60 -n auto --ignore=.claude
