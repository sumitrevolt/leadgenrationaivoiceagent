name: tests

# CI TEST GATE (tech-debt fix, 2026-06-11): har push/PR pe prod_check + deterministic
# suites. Deploy se ALAG (deploy-vps.yml DEPLOY_ENABLED-gated hi rehta). Full pytest
# ab hang nahi karta (pytest-timeout in pyproject) — par CI me sirf network-free
# targeted set chalta hai (LLM/Redis/Qdrant-dependent tests local/VPS pe).

on:
  push:
    branches: [main]
  # PRs already run the full required suite in ci.yml (parallel shards).
  # A second targeted pytest job on every PR stole a runner slot from the
  # merge-blocking `prod_check + pytest` aggregator.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: write  # failure pe pytest log ci-debug branch pe push (anonymous-readable)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (live lock, Dockerfile.lock jaisa)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock.txt
          # -U + pins ZAROORI: lock me purane pytest/pytest-asyncio pinned hain —
          # bina -U pip "already satisfied" bolke unhe rakh leta (old pytest-asyncio
          # = event-loop/fixture errors). httpx DOWNGRADE bhi zaroori: lock ka combo
          # starlette 0.35.1 + httpx 0.28.1 TestClient(app=) TypeError deta (httpx
          # 0.28 ne app= hataya) — 0.27.2 starlette-0.35 compatible (runs #1-#4 lesson).
          # Locked test stack (pytest 7.4.4 + pytest-asyncio 0.23.4 + httpx 0.28.1 from
          # the lock). httpx 0.28.1 is handled by the conftest TestClient shim.
          # Add only the non-lock test tooling.
          pip install --no-deps "pytest-timeout==2.4.0"
          pip install pytest-github-actions-annotate-failures

      - name: prod_check (import + routes gate)
        run: python scripts/prod_check.py

      - name: Targeted test suites (deterministic, no external creds)
        shell: bash
        run: |
          set -o pipefail
          pytest -v --tb=line -m "not network" \
            tests/test_product_split.py \
            tests/test_billing_truth_2026.py \
            tests/test_provisioning.py \
            tests/test_2026_features.py \
            tests/test_revenue_infra_2026.py \
            tests/test_revenue_automation.py \
            tests/test_apollo_inspired.py \
            tests/test_parity_clientops.py \
            tests/test_parity_conversion.py \
            tests/test_production_gaps.py 2>&1 | tee pytest_ci.txt || touch .ci_failed
          test ! -f .ci_failed

      - name: Publish failure log to ci-debug branch (read via raw.githubusercontent)
        if: failure()
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci@leadsgenai.in
          git checkout --orphan ci-debug
          git rm -rfq --cached . || true
          mkdir -p /tmp/keep && cp pytest_ci.txt /tmp/keep/ 2>/dev/null || echo "no log" > /tmp/keep/pytest_ci.txt
          git clean -fdxq || true
          cp /tmp/keep/pytest_ci.txt .
          git add pytest_ci.txt
          git commit -m "ci failure log $GITHUB_RUN_NUMBER"
          git push -f origin ci-debug
