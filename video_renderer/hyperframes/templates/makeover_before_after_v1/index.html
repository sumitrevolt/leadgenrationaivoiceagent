<!doctype html>
<!--
  makeover_before_after_v1 — before/after transformation arc (photo-led).

  Contract:
    1080x1920, 30fps, 6 scenes, 25.4s.
    Every value on screen arrives through a declared variable bound with
    `data-bind`; there is no hard-coded business name, price, rating, address or
    testimonial. An unfilled optional variable REMOVES its element rather than
    rendering a blank slot — a fabricated claim in a customer's ad is the worst
    failure this product can have.

  Distinct from the other compositions: this one is a SPLIT-SCREEN reveal. The
  before/after panels are full-bleed and the divider travels between them, so
  the transformation is the spine of the video rather than a card in a list.
  The `before_after` RECIPE still requires verified source assets
  (recipes.recipe_allowed) — this composition never bypasses that gate; it only
  renders whatever the binder was allowed to bind.

  Assets: local only. Photos are absolute file paths the Python provider
  resolved from the tenant's own consented asset registry. Nothing is fetched
  at render time (this file is self-contained: no external CSS, no CDN).
-->
<html lang="en" data-composition-variables='[
  {"id":"business_name","type":"string","label":"Business name","default":""},
  {"id":"monogram","type":"string","label":"Monogram","default":""},
  {"id":"tagline","type":"string","label":"Tagline","default":""},
  {"id":"city","type":"string","label":"City","default":""},
  {"id":"primary_color","type":"color","label":"Brand primary","default":"#c2410c"},
  {"id":"accent_color","type":"color","label":"Brand accent","default":"#fde68a"},
  {"id":"hook_line","type":"string","label":"Transformation headline","default":""},
  {"id":"hook_sub","type":"string","label":"Hook subline","default":""},
  {"id":"before_line","type":"string","label":"Before caption","default":""},
  {"id":"after_line","type":"string","label":"After caption","default":""},
  {"id":"services_json","type":"string","label":"Included services JSON","default":"[]"},
  {"id":"offer_title","type":"string","label":"Offer label","default":""},
  {"id":"offer_sub","type":"string","label":"Offer headline","default":""},
  {"id":"cta_text","type":"string","label":"CTA text","default":""},
  {"id":"cta_channel","type":"string","label":"CTA channel","default":"whatsapp"},
  {"id":"contact_display","type":"string","label":"Contact display","default":""},
  {"id":"photos_json","type":"string","label":"Before/after photo paths JSON","default":"[]"},
  {"id":"footer_note","type":"string","label":"Footer note","default":""}
]'>
<head>
  <meta charset="utf-8" />
  <style>
    /* Self-contained design system — this composition shares no stylesheet with
       the other templates so a change here can never recolour another video. */
    :root {
      --brand: #c2410c;
      --accent: #fde68a;
      --ink: #fbf7f2;
      --ink-dim: rgba(251, 247, 242, 0.66);
      --base-0: #100c0a;
      --base-1: #1c1512;
      --safe-x: 84px;
      --safe-top: 200px;
      --safe-bottom: 280px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: var(--base-0);
      font-family: "LG Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    /* HyperFrames toggles .clip visibility from data-start/data-duration. */
    .clip { position: absolute; inset: 0; }

    .bg { position: absolute; inset: 0; background: var(--base-0); }
    .bg-split {
      position: absolute; inset: -10%;
      background:
        radial-gradient(38% 30% at 18% 22%, color-mix(in srgb, var(--brand) 42%, transparent) 0%, transparent 60%),
        radial-gradient(42% 34% at 84% 74%, color-mix(in srgb, var(--accent) 26%, transparent) 0%, transparent 62%);
      filter: blur(30px) saturate(120%);
      animation: drift 16s ease-in-out 2 alternate both;
    }
    @keyframes drift {
      0%   { transform: translate3d(-2%, -1.4%, 0) scale(1.04); }
      100% { transform: translate3d(2.4%, 1.8%, 0) scale(1.12); }
    }
    .bg-grain {
      position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay;
      background-image: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%);
      background-size: 4px 4px;
    }
    .bg-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(74% 58% at 50% 46%, transparent 0%, rgba(0,0,0,.5) 76%, rgba(0,0,0,.88) 100%);
    }

    .stage {
      position: absolute; left: var(--safe-x); right: var(--safe-x);
      top: var(--safe-top); bottom: var(--safe-bottom);
      display: flex; flex-direction: column; justify-content: center;
    }

    /* ---- intro "mirror" card ---- */
    .mirror {
      position: relative; margin: 0 auto; width: 560px; height: 720px;
      border-radius: 280px 280px 40px 40px;
      background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 40px 100px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
      display: grid; place-items: center;
    }
    .mirror .mono {
      width: 240px; height: 240px; border-radius: 50%; display: grid; place-items: center;
      font-size: 96px; font-weight: 700; letter-spacing: .03em; color: var(--ink);
      background: conic-gradient(from 200deg, var(--brand), var(--accent), var(--brand));
      box-shadow: 0 0 0 3px rgba(255,255,255,.22), 0 28px 80px color-mix(in srgb, var(--brand) 48%, transparent);
      animation: pop .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    .mirror .mono span {
      width: 210px; height: 210px; border-radius: 50%; display: grid; place-items: center;
      background: var(--base-1);
    }

    .headline { font-weight: 700; line-height: 1.06; letter-spacing: -.02em; text-wrap: balance; }
    .sub { font-size: 34px; line-height: 1.42; color: var(--ink-dim); }
    .eyebrow {
      font-size: 30px; font-weight: 700; letter-spacing: .42em; text-transform: uppercase;
      color: var(--accent); opacity: .92;
    }
    .rule {
      height: 3px; width: 148px; border-radius: 3px;
      background: linear-gradient(90deg, var(--brand), var(--accent)); transform-origin: left center;
    }

    /* ---- split before/after reveal ---- */
    .split { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr 1fr; }
    .panel { position: relative; overflow: hidden; }
    .panel .media { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .panel .media.typo {
      display: grid; place-items: center; font-size: 190px; font-weight: 700; letter-spacing: .06em;
      background: linear-gradient(120deg, color-mix(in srgb, var(--brand) 34%, var(--base-0)), var(--base-1));
      color: color-mix(in srgb, var(--accent) 80%, #fff);
    }
    .panel .scrim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.15) 40%, rgba(0,0,0,.72));
    }
    .ribbon {
      position: absolute; top: 42px; left: 42px;
      padding: 16px 34px; border-radius: 999px;
      font-size: 30px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase;
      background: color-mix(in srgb, var(--brand) 78%, #000);
      box-shadow: 0 16px 40px rgba(0,0,0,.5);
      animation: pop .6s cubic-bezier(.34,1.56,.64,1) .12s both;
    }
    .ribbon.after { background: color-mix(in srgb, var(--accent) 82%, #000); color: #1a1206; }
    .panel .caption {
      position: absolute; left: 54px; right: 54px; bottom: 54px;
      font-size: 44px; font-weight: 700; line-height: 1.18;
      animation: slideUp .8s cubic-bezier(.22,1,.36,1) .3s both;
    }
    .divider {
      position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%);
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 70%, transparent);
      animation: wipeX .9s cubic-bezier(.22,1,.36,1) .2s both;
    }
    @keyframes wipeX { from { transform: translateY(-50%) scaleX(0); } to { transform: translateY(-50%) scaleX(1); } }

    /* ---- included services ---- */
    .svc {
      display: flex; flex-direction: column; gap: 8px;
      padding: 30px 36px; border-radius: 24px;
      background: linear-gradient(150deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
      border: 1px solid rgba(255,255,255,.16);
    }
    .svc-t { font-size: 40px; font-weight: 700; line-height: 1.16; }
    .svc-d { font-size: 27px; color: var(--ink-dim); }
    .badge {
      display: inline-flex; align-items: center; padding: 18px 38px; border-radius: 999px;
      font-size: 31px; font-weight: 700; letter-spacing: .02em;
      background: color-mix(in srgb, var(--brand) 24%, transparent);
      border: 1px solid color-mix(in srgb, var(--brand) 58%, transparent);
    }

    /* ---- CTA ---- */
    .cta {
      display: flex; align-items: center; justify-content: center; gap: 26px;
      padding: 40px 56px; border-radius: 999px; font-size: 46px; font-weight: 700;
      background: linear-gradient(120deg, var(--brand), color-mix(in srgb, var(--brand) 60%, #000));
      box-shadow: 0 26px 64px color-mix(in srgb, var(--brand) 52%, transparent);
      animation: ctaPulse 1.9s ease-in-out 3 both;
    }
    @keyframes ctaPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    .cta svg { width: 52px; height: 52px; flex: 0 0 auto; }
    .footer-line {
      position: absolute; left: var(--safe-x); right: var(--safe-x); bottom: 150px;
      text-align: center; font-size: 27px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim);
    }

    /* ---- motion (finite iteration counts: seekable + deterministic) ---- */
    .fade-in { animation: fadeIn .66s ease both; }
    .slide-up { animation: slideUp .82s cubic-bezier(.22,1,.36,1) both; }
    .pop { animation: pop .66s cubic-bezier(.34,1.56,.64,1) both; }
    .wipe { animation: wipe .8s cubic-bezier(.22,1,.36,1) both; }
    .kb { animation: kenBurns 5.2s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translate3d(0,58px,0); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
    @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes kenBurns { from { transform: scale(1.0); } to { transform: scale(1.1) translate3d(0,-16px,0); } }
    .w { display: inline-block; will-change: transform, opacity; }
    .rise .w { animation: wordRise .72s cubic-bezier(.22,1,.36,1) both; }
    @keyframes wordRise {
      from { opacity: 0; transform: translate3d(0,46px,0) rotate(1.4deg); filter: blur(7px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-no-timeline data-start="0"
       data-width="1080" data-height="1920" data-fps="30" data-duration="25.4">

    <div class="bg">
      <div class="bg-split"></div>
      <div class="bg-vignette"></div>
      <div class="bg-grain"></div>
    </div>

    <!-- ============================================== 1. intro (0→3.6) -->
    <div id="scene-intro" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
      <div class="stage" style="align-items:center;text-align:center;gap:48px;">
        <div class="mirror">
          <div class="mono"><span data-bind="monogram"></span></div>
        </div>
        <div>
          <h1 class="headline" data-fit="brand" data-bind="business_name"
              style="animation:slideUp .95s cubic-bezier(.22,1,.36,1) .34s both;"></h1>
          <div class="rule wipe" style="margin:30px auto 0;animation-delay:.84s;"></div>
          <p class="sub" data-bind="tagline" data-optional
             style="margin-top:28px;animation:fadeIn .8s ease 1s both;"></p>
        </div>
        <div class="eyebrow" data-bind="city" data-optional
             style="animation:fadeIn .8s ease 1.24s both;"></div>
      </div>
    </div>

    <!-- =============================================== 2. hook (3.6→8.0) -->
    <div id="scene-hook" class="clip" data-start="3.6" data-duration="4.4" data-track-index="1">
      <div class="stage" style="gap:38px;">
        <div class="eyebrow" data-bind="city" data-suffix=" ·" data-optional
             style="animation:fadeIn .6s ease both;"></div>
        <h2 class="headline rise" data-fit="hook" data-bind="hook_line" data-words></h2>
        <div class="rule wipe" style="animation-delay:.6s;"></div>
        <p class="sub" data-bind="hook_sub" data-optional
           style="max-width:820px;animation:slideUp .9s cubic-bezier(.22,1,.36,1) .7s both;"></p>
      </div>
    </div>

    <!-- ============================================= 3. before (8.0→13.6) -->
    <div id="scene-before" class="clip" data-start="8.0" data-duration="5.6" data-track-index="1">
      <div class="split" style="grid-template-rows:1fr;">
        <div class="panel">
          <div id="before-media" class="media kb"></div>
          <div class="scrim"></div>
          <div class="ribbon">Before</div>
          <div class="caption" data-bind="before_line" data-optional></div>
        </div>
      </div>
    </div>

    <!-- ============================================== 4. after (13.6→17.8) -->
    <div id="scene-after" class="clip" data-start="13.6" data-duration="4.2" data-track-index="1">
      <div class="split" style="grid-template-rows:1fr;">
        <div class="panel">
          <div id="after-media" class="media kb"></div>
          <div class="scrim"></div>
          <div class="ribbon after">After</div>
          <div class="caption" data-bind="after_line" data-optional></div>
        </div>
      </div>
    </div>

    <!-- =========================================== 5. included (17.8→21.4) -->
    <div id="scene-included" class="clip" data-start="17.8" data-duration="3.6" data-track-index="1">
      <div class="stage" style="gap:28px;">
        <div class="eyebrow fade-in">What's included</div>
        <div id="service-list" style="display:flex;flex-direction:column;gap:20px;"></div>
        <div class="badge pop" data-bind="offer_title" data-optional
             style="margin-top:6px;animation-delay:.4s;"></div>
        <h2 class="headline" data-fit="offer" data-bind="offer_sub" data-optional
            style="animation:slideUp .82s cubic-bezier(.22,1,.36,1) .5s both;"></h2>
      </div>
    </div>

    <!-- ================================================= 6. CTA (21.4→25.4) -->
    <div id="scene-cta" class="clip" data-start="21.4" data-duration="4.0" data-track-index="1">
      <div class="stage" style="align-items:center;text-align:center;gap:44px;">
        <h2 class="headline" data-fit="cta" data-bind="cta_text"
            style="animation:slideUp .86s cubic-bezier(.22,1,.36,1) both;"></h2>
        <div class="cta" style="animation-delay:.48s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path id="cta-glyph" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
          <span data-bind="contact_display"></span>
        </div>
        <div class="eyebrow" data-bind="business_name"
             style="animation:fadeIn .8s ease .9s both;"></div>
      </div>
      <div class="footer-line" data-bind="footer_note" data-optional
           style="animation:fadeIn .8s ease 1.1s both;"></div>
    </div>
  </div>

  <script>
    // Local, dependency-free. Runs once before capture; all motion afterwards is
    // CSS, which keeps the timeline seekable and every render identical.
    (function () {
      var V = {};
      try { V = (window.__hyperframes && window.__hyperframes.getVariables()) || {}; }
      catch (e) { V = {}; }

      var S = function (k) { return String(V[k] == null ? "" : V[k]).trim(); };

      function parseList(key) {
        try {
          var raw = JSON.parse(S(key) || "[]");
          return Array.isArray(raw) ? raw : [];
        } catch (e) { return []; }
      }

      var root = document.documentElement;
      if (S("primary_color")) root.style.setProperty("--brand", S("primary_color"));
      if (S("accent_color")) root.style.setProperty("--accent", S("accent_color"));

      // An element bound to an empty variable is REMOVED when optional, so "we
      // have no caption for this tenant" yields a tighter layout, not a blank.
      document.querySelectorAll("[data-bind]").forEach(function (el) {
        var val = S(el.getAttribute("data-bind"));
        if (!val) {
          if (el.hasAttribute("data-optional")) el.remove();
          return;
        }
        var suffix = el.getAttribute("data-suffix") || "";
        if (el.hasAttribute("data-words")) {
          el.textContent = "";
          val.split(/\s+/).forEach(function (word, i) {
            var s = document.createElement("span");
            s.className = "w";
            s.textContent = word;
            s.style.animationDelay = (0.06 + i * 0.055).toFixed(3) + "s";
            el.appendChild(s);
            el.appendChild(document.createTextNode(" "));
          });
        } else {
          el.textContent = val + suffix;
        }
      });

      // Length-driven type: Hindi/Hinglish runs 2-3x the glyph count of English.
      var LADDER = {
        brand:   [[14, 92], [24, 78], [34, 64], [999, 54]],
        hook:    [[26, 100], [42, 82], [64, 66], [999, 56]],
        caption: [[26, 62], [46, 52], [999, 42]],
        offer:   [[22, 88], [38, 72], [58, 58], [999, 50]],
        cta:     [[20, 74], [34, 62], [999, 52]]
      };
      document.querySelectorAll("[data-fit]").forEach(function (el) {
        var rungs = LADDER[el.getAttribute("data-fit")];
        if (!rungs) return;
        var n = (el.textContent || "").length;
        for (var i = 0; i < rungs.length; i++) {
          if (n <= rungs[i][0]) { el.style.fontSize = rungs[i][1] + "px"; break; }
        }
      });

      // ---- before / after panels ---------------------------------------
      // Photo 0 is the "before", photo 1 the "after" (falling back to photo 0).
      // With no consented imagery the panel becomes a designed typographic mark
      // — never a grey "image missing" box and never an unlicensed stock photo.
      var photos = parseList("photos_json").filter(function (p) { return !!p; });
      var mark = S("monogram") || S("business_name").slice(0, 2).toUpperCase();
      function paint(id, src) {
        var el = document.getElementById(id);
        if (!el) return;
        if (src) {
          el.style.backgroundImage = 'url("' + encodeURI(src) + '")';
        } else {
          el.classList.add("typo");
          el.textContent = mark;
        }
      }
      paint("before-media", photos[0]);
      paint("after-media", photos[1] || photos[0]);

      // ---- included services -------------------------------------------
      var list = document.getElementById("service-list");
      if (list) {
        parseList("services_json").slice(0, 4).forEach(function (svc, i) {
          var t = String(svc && svc.title ? svc.title : "").trim();
          if (!t) return;
          var row = document.createElement("div");
          row.className = "svc";
          row.style.animation =
            "slideUp .82s cubic-bezier(.22,1,.36,1) " + (0.16 + i * 0.16).toFixed(2) + "s both";
          var tt = document.createElement("div");
          tt.className = "svc-t";
          tt.textContent = t;
          row.appendChild(tt);
          var d = String(svc && svc.subtitle ? svc.subtitle : "").trim();
          if (d) {
            var dd = document.createElement("div");
            dd.className = "svc-d";
            dd.textContent = d;
            row.appendChild(dd);
          }
          list.appendChild(row);
        });
      }

      // ---- CTA glyph (generic chat / phone only) ------------------------
      if (S("cta_channel").toLowerCase() === "call") {
        var g = document.getElementById("cta-glyph");
        if (g) {
          g.setAttribute("d",
            "M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6" +
            " 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81" +
            "a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45" +
            "c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z");
        }
      }

      document.documentElement.setAttribute("data-lg-bound", "1");
    })();
  </script>
</body>
</html>
