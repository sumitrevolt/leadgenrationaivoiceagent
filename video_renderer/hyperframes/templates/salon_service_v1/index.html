<!doctype html>
<!--
  salon_service_v1 — treatment / service-menu showcase.

  Contract:
    1080x1920, 30fps, 6 scenes, 25.4s.
    Every on-screen value arrives through a declared `data-bind` variable. There
    is NO price, rating, review count or testimonial in this file: the menu
    renders a service NAME plus an optional subtitle, and a row with no name is
    dropped. An unfilled optional element is removed, never left as a blank slot.

  Distinct from the other compositions: this one is a MENU BOARD. A tabbed rail
  runs down the left edge and services render as dotted-leader menu rows — a
  treatment list, not a card grid and not a split reveal. It shares no stylesheet
  with any other template.

  Assets: local only, no CDN, no external CSS. Photos (when present) are absolute
  paths the Python provider resolved from the tenant's consented asset registry.
-->
<html lang="en" data-composition-variables='[
  {"id":"business_name","type":"string","label":"Business name","default":""},
  {"id":"monogram","type":"string","label":"Monogram","default":""},
  {"id":"tagline","type":"string","label":"Tagline","default":""},
  {"id":"city","type":"string","label":"City","default":""},
  {"id":"primary_color","type":"color","label":"Brand primary","default":"#0f766e"},
  {"id":"accent_color","type":"color","label":"Brand accent","default":"#99f6e4"},
  {"id":"intro_line","type":"string","label":"Intro headline","default":""},
  {"id":"intro_sub","type":"string","label":"Intro subline","default":""},
  {"id":"menu_json","type":"string","label":"Service menu JSON","default":"[]"},
  {"id":"speciality_line","type":"string","label":"Signature treatment headline","default":""},
  {"id":"offer_title","type":"string","label":"Offer label","default":""},
  {"id":"offer_sub","type":"string","label":"Offer headline","default":""},
  {"id":"cta_text","type":"string","label":"CTA text","default":""},
  {"id":"cta_channel","type":"string","label":"CTA channel","default":"whatsapp"},
  {"id":"contact_display","type":"string","label":"Contact display","default":""},
  {"id":"photos_json","type":"string","label":"Photo paths JSON","default":"[]"},
  {"id":"footer_note","type":"string","label":"Footer note","default":""}
]'>
<head>
  <meta charset="utf-8" />
  <style>
    /* Self-contained design system (salon menu board). */
    :root {
      --brand: #0f766e;
      --accent: #99f6e4;
      --ink: #f4fbf9;
      --ink-dim: rgba(244, 251, 249, 0.64);
      --base-0: #07100f;
      --base-1: #0e1b19;
      --safe-x: 80px;
      --safe-top: 200px;
      --safe-bottom: 280px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: var(--base-0);
      font-family: "LG Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .clip { position: absolute; inset: 0; }

    .bg { position: absolute; inset: 0; background: var(--base-0); }
    .bg-wash {
      position: absolute; inset: -8%;
      background:
        radial-gradient(44% 30% at 80% 14%, color-mix(in srgb, var(--brand) 44%, transparent) 0%, transparent 62%),
        radial-gradient(40% 32% at 12% 84%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 60%);
      filter: blur(30px) saturate(118%);
      animation: wash 17s ease-in-out 2 alternate both;
    }
    @keyframes wash {
      0%   { transform: translate3d(1.8%, -1.2%, 0) scale(1.05); }
      100% { transform: translate3d(-2.2%, 2%, 0) scale(1.12); }
    }
    .bg-grid {
      position: absolute; inset: 0; opacity: .16;
      background-image:
        linear-gradient(color-mix(in srgb, var(--accent) 18%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, transparent) 1px, transparent 1px);
      background-size: 120px 120px;
      mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 78%);
      -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 78%);
    }
    .bg-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(76% 60% at 50% 46%, transparent 0%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.9) 100%);
    }

    .stage {
      position: absolute; left: var(--safe-x); right: var(--safe-x);
      top: var(--safe-top); bottom: var(--safe-bottom);
      display: flex; flex-direction: column; justify-content: center;
    }

    /* ---- left tab rail (menu-board signature) ---- */
    .rail {
      position: absolute; left: 0; top: 0; bottom: 0; width: 54px;
      background: linear-gradient(180deg, var(--brand), color-mix(in srgb, var(--brand) 50%, #000));
      display: flex; align-items: center; justify-content: center;
    }
    .rail span {
      writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
      font-size: 26px; font-weight: 700; letter-spacing: .5em; text-transform: uppercase;
      color: color-mix(in srgb, var(--accent) 80%, #fff);
    }

    .headline { font-weight: 700; line-height: 1.06; letter-spacing: -.02em; text-wrap: balance; }
    .sub { font-size: 34px; line-height: 1.42; color: var(--ink-dim); }
    .eyebrow {
      font-size: 30px; font-weight: 700; letter-spacing: .42em; text-transform: uppercase;
      color: var(--accent); opacity: .92;
    }
    .rule {
      height: 3px; width: 140px; border-radius: 3px;
      background: linear-gradient(90deg, var(--brand), var(--accent)); transform-origin: left center;
    }

    /* ---- shop board (intro) ---- */
    .board {
      margin: 0 auto; width: 620px; padding: 64px 56px; border-radius: 34px;
      background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 36px 96px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.22);
      display: grid; gap: 34px; place-items: center; text-align: center;
    }
    .board .mono {
      width: 200px; height: 200px; border-radius: 30px; display: grid; place-items: center;
      font-size: 84px; font-weight: 700; letter-spacing: .04em;
      background: linear-gradient(150deg, var(--brand), color-mix(in srgb, var(--brand) 42%, #000));
      box-shadow: 0 22px 60px color-mix(in srgb, var(--brand) 46%, transparent);
      animation: pop .7s cubic-bezier(.34,1.56,.64,1) both;
    }

    /* ---- menu rows with dotted leaders ---- */
    .menu { display: flex; flex-direction: column; gap: 8px; }
    .menu-row {
      display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 18px;
      padding: 22px 26px; border-radius: 18px;
      background: linear-gradient(150deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.14);
    }
    .menu-row .num {
      width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;
      font-size: 30px; font-weight: 700;
      background: color-mix(in srgb, var(--brand) 42%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .menu-row .name { font-size: 40px; font-weight: 700; line-height: 1.14; }
    .menu-row .leader {
      border-bottom: 3px dotted color-mix(in srgb, var(--accent) 46%, transparent);
      transform: translateY(-8px);
    }
    .menu-row .note { font-size: 27px; color: var(--ink-dim); text-align: right; max-width: 260px; }

    /* ---- signature treatment frame ---- */
    .signature {
      position: relative; margin: 0 auto; padding: 60px 54px; max-width: 860px; text-align: center;
      border-radius: 28px; border: 2px solid color-mix(in srgb, var(--accent) 46%, transparent);
      background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    }
    .signature .corner { position: absolute; width: 46px; height: 46px; border: 3px solid var(--accent); opacity: .8; }
    .signature .corner.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
    .signature .corner.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

    .badge {
      display: inline-flex; align-items: center; padding: 18px 38px; border-radius: 999px;
      font-size: 31px; font-weight: 700;
      background: color-mix(in srgb, var(--brand) 26%, transparent);
      border: 1px solid color-mix(in srgb, var(--brand) 60%, transparent);
    }

    .cta {
      display: flex; align-items: center; justify-content: center; gap: 26px;
      padding: 40px 56px; border-radius: 999px; font-size: 46px; font-weight: 700;
      background: linear-gradient(120deg, var(--brand), color-mix(in srgb, var(--brand) 58%, #000));
      box-shadow: 0 26px 64px color-mix(in srgb, var(--brand) 50%, transparent);
      animation: ctaPulse 1.9s ease-in-out 3 both;
    }
    @keyframes ctaPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    .cta svg { width: 52px; height: 52px; flex: 0 0 auto; }
    .footer-line {
      position: absolute; left: var(--safe-x); right: var(--safe-x); bottom: 150px;
      text-align: center; font-size: 27px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim);
    }

    .fade-in { animation: fadeIn .66s ease both; }
    .pop { animation: pop .66s cubic-bezier(.34,1.56,.64,1) both; }
    .wipe { animation: wipe .8s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translate3d(0,58px,0); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
    @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .w { display: inline-block; will-change: transform, opacity; }
    .rise .w { animation: wordRise .72s cubic-bezier(.22,1,.36,1) both; }
    @keyframes wordRise {
      from { opacity: 0; transform: translate3d(0,44px,0) rotate(1.2deg); filter: blur(7px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-no-timeline data-start="0"
       data-width="1080" data-height="1920" data-fps="30" data-duration="25.4">

    <div class="bg">
      <div class="bg-wash"></div>
      <div class="bg-grid"></div>
      <div class="bg-vignette"></div>
    </div>
    <div class="rail"><span>Menu</span></div>

    <!-- ============================================== 1. intro (0→3.6) -->
    <div id="scene-intro" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
      <div class="stage">
        <div class="board">
          <div class="mono" data-bind="monogram"></div>
          <h1 class="headline" data-fit="brand" data-bind="business_name"
              style="animation:slideUp .9s cubic-bezier(.22,1,.36,1) .3s both;"></h1>
          <div class="rule wipe" style="animation-delay:.78s;"></div>
          <p class="sub" data-bind="tagline" data-optional
             style="animation:fadeIn .8s ease .95s both;"></p>
          <div class="eyebrow" data-bind="city" data-optional
               style="animation:fadeIn .8s ease 1.16s both;"></div>
        </div>
      </div>
    </div>

    <!-- ========================================== 2. intro line (3.6→8.0) -->
    <div id="scene-introline" class="clip" data-start="3.6" data-duration="4.4" data-track-index="1">
      <div class="stage" style="gap:38px;">
        <div class="eyebrow" data-bind="city" data-suffix=" ·" data-optional
             style="animation:fadeIn .6s ease both;"></div>
        <h2 class="headline rise" data-fit="hook" data-bind="intro_line" data-words></h2>
        <div class="rule wipe" style="animation-delay:.6s;"></div>
        <p class="sub" data-bind="intro_sub" data-optional
           style="max-width:820px;animation:slideUp .9s cubic-bezier(.22,1,.36,1) .7s both;"></p>
      </div>
    </div>

    <!-- ============================================== 3. menu (8.0→13.6) -->
    <div id="scene-menu" class="clip" data-start="8.0" data-duration="5.6" data-track-index="1">
      <div class="stage" style="gap:30px;">
        <div class="eyebrow fade-in">Our treatments</div>
        <div class="menu" id="menu-list"></div>
      </div>
    </div>

    <!-- ======================================== 4. signature (13.6→17.8) -->
    <div id="scene-signature" class="clip" data-start="13.6" data-duration="4.2" data-track-index="1">
      <div class="stage" style="align-items:center;text-align:center;gap:30px;">
        <div class="eyebrow fade-in">Signature</div>
        <div class="signature pop">
          <div class="corner tl"></div>
          <div class="corner br"></div>
          <h2 class="headline" data-fit="showcase" data-bind="speciality_line"></h2>
        </div>
      </div>
    </div>

    <!-- ============================================= 5. offer (17.8→21.4) -->
    <div id="scene-offer" class="clip" data-start="17.8" data-duration="3.6" data-track-index="1">
      <div class="stage" style="align-items:center;text-align:center;gap:34px;">
        <div class="badge pop" data-bind="offer_title" data-optional></div>
        <h2 class="headline" data-fit="offer" data-bind="offer_sub" data-optional
            style="animation:slideUp .82s cubic-bezier(.22,1,.36,1) .28s both;"></h2>
        <div class="rule wipe" style="margin:0 auto;animation-delay:.7s;"></div>
      </div>
    </div>

    <!-- ================================================= 6. CTA (21.4→25.4) -->
    <div id="scene-cta" class="clip" data-start="21.4" data-duration="4.0" data-track-index="1">
      <div class="stage" style="align-items:center;text-align:center;gap:44px;">
        <h2 class="headline" data-fit="cta" data-bind="cta_text"
            style="animation:slideUp .86s cubic-bezier(.22,1,.36,1) both;"></h2>
        <div class="cta" style="animation-delay:.46s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path id="cta-glyph" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
          <span data-bind="contact_display"></span>
        </div>
        <div class="eyebrow" data-bind="business_name"
             style="animation:fadeIn .8s ease .88s both;"></div>
      </div>
      <div class="footer-line" data-bind="footer_note" data-optional
           style="animation:fadeIn .8s ease 1.08s both;"></div>
    </div>
  </div>

  <script>
    (function () {
      var V = {};
      try { V = (window.__hyperframes && window.__hyperframes.getVariables()) || {}; }
      catch (e) { V = {}; }

      var S = function (k) { return String(V[k] == null ? "" : V[k]).trim(); };

      function parseList(key) {
        try {
          var raw = JSON.parse(S(key) || "[]");
          return Array.isArray(raw) ? raw : [];
        } catch (e) { return []; }
      }

      var root = document.documentElement;
      if (S("primary_color")) root.style.setProperty("--brand", S("primary_color"));
      if (S("accent_color")) root.style.setProperty("--accent", S("accent_color"));

      document.querySelectorAll("[data-bind]").forEach(function (el) {
        var val = S(el.getAttribute("data-bind"));
        if (!val) {
          if (el.hasAttribute("data-optional")) el.remove();
          return;
        }
        var suffix = el.getAttribute("data-suffix") || "";
        if (el.hasAttribute("data-words")) {
          el.textContent = "";
          val.split(/\s+/).forEach(function (word, i) {
            var s = document.createElement("span");
            s.className = "w";
            s.textContent = word;
            s.style.animationDelay = (0.06 + i * 0.055).toFixed(3) + "s";
            el.appendChild(s);
            el.appendChild(document.createTextNode(" "));
          });
        } else {
          el.textContent = val + suffix;
        }
      });

      var LADDER = {
        brand:    [[14, 84], [24, 70], [34, 58], [999, 50]],
        hook:     [[26, 98], [42, 80], [64, 64], [999, 54]],
        showcase: [[24, 66], [44, 56], [999, 46]],
        offer:    [[22, 88], [38, 72], [58, 58], [999, 50]],
        cta:      [[20, 74], [34, 62], [999, 52]]
      };
      document.querySelectorAll("[data-fit]").forEach(function (el) {
        var rungs = LADDER[el.getAttribute("data-fit")];
        if (!rungs) return;
        var n = (el.textContent || "").length;
        for (var i = 0; i < rungs.length; i++) {
          if (n <= rungs[i][0]) { el.style.fontSize = rungs[i][1] + "px"; break; }
        }
      });

      // ---- menu rows ----------------------------------------------------
      // A row needs a NAME to exist; the dotted leader + note are optional, so
      // an unevidenced subtitle simply does not render. No price is ever drawn.
      var menu = document.getElementById("menu-list");
      if (menu) {
        parseList("menu_json").slice(0, 4).forEach(function (svc, i) {
          var name = String(svc && svc.title ? svc.title : "").trim();
          if (!name) return;
          var row = document.createElement("div");
          row.className = "menu-row";
          row.style.animation =
            "slideUp .82s cubic-bezier(.22,1,.36,1) " + (0.16 + i * 0.16).toFixed(2) + "s both";

          var num = document.createElement("div");
          num.className = "num";
          num.textContent = String(i + 1);

          var nm = document.createElement("div");
          nm.className = "name";
          nm.textContent = name;

          var note = String(svc && svc.subtitle ? svc.subtitle : "").trim();
          var tail;
          if (note) {
            tail = document.createElement("div");
            tail.className = "note";
            tail.textContent = note;
          } else {
            tail = document.createElement("div");
            tail.className = "leader";
          }

          row.appendChild(num);
          row.appendChild(nm);
          row.appendChild(tail);
          menu.appendChild(row);
        });
      }

      if (S("cta_channel").toLowerCase() === "call") {
        var g = document.getElementById("cta-glyph");
        if (g) {
          g.setAttribute("d",
            "M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6" +
            " 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81" +
            "a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45" +
            "c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z");
        }
      }

      document.documentElement.setAttribute("data-lg-bound", "1");
    })();
  </script>
</body>
</html>
