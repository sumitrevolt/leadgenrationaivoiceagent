# =============================================================================
# docker-compose.observability.yml  —  OPTIONAL free monitoring stack.
# -----------------------------------------------------------------------------
# Prometheus (metrics) + Grafana (dashboards) + Uptime Kuma (uptime/alerts).
# All free, self-hosted, bound to localhost (reach via SSH tunnel or a Caddy
# route). Attaches to the SAME docker network as the app so Prometheus can
# scrape leadgen_app:8080/metrics.
#
# Prereq: the main stack is up (docker-compose.vps.yml), which creates the
# network `leadgen_leadgen_net`.
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Access (from your laptop):
#   ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 -L 3001:127.0.0.1:3001 root@72.61.245.204
#   Grafana    -> http://localhost:3000   (admin / GRAFANA_PASSWORD)
#   Prometheus -> http://localhost:9090
#   Uptime Kuma-> http://localhost:3001
# =============================================================================

name: leadgen-obs

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: leadgen_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks: [leadgen_net]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: leadgen_alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # SMTP password (gitignored, deploy pe .env se likhi jaati) — secret repo me nahi.
      - ./monitoring/alertmanager_smtp_pass:/etc/alertmanager/smtp_pass:ro
      - amdata:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks: [leadgen_net]

  # Logs (Loki) + Traces (Tempo) — feed by app when ENABLE_OTEL=1. Grafana inhe
  # data-source ke roop me jodo (Tempo: http://tempo:3200, Loki: http://loki:3100).
  loki:
    image: grafana/loki:2.9.0
    container_name: leadgen_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks: [leadgen_net]

  tempo:
    image: grafana/tempo:latest
    container_name: leadgen_tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # tempo query
      - "127.0.0.1:4317:4317"   # OTLP gRPC (app -> OTEL_EXPORTER_OTLP_ENDPOINT)
    restart: unless-stopped
    networks: [leadgen_net]

  grafana:
    image: grafana/grafana:latest
    container_name: leadgen_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [leadgen_net]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: leadgen_uptime
    volumes:
      - kumadata:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    networks: [leadgen_net]

  # Synthetic checks with BODY assertions (Kuma = ping-style only) — ~40MB RAM.
  gatus:
    image: twinproduction/gatus:latest
    container_name: leadgen_gatus
    volumes:
      - ./monitoring/gatus.yaml:/config/config.yaml:ro
      - gatusdata:/data
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    networks: [leadgen_net]

volumes:
  promdata:
  grafanadata:
  kumadata:
  amdata:
  lokidata:
  tempodata:
  gatusdata:

networks:
  leadgen_net:
    external: true
    name: leadgen_leadgen_net
