# Self-hosted LLM on the VPS (CPU-only fallback option). Joins the leadgen network
# so the app reaches it at http://ollama:11434. CPU-limited so inference spikes app
# ko starve na karein (prod-down #3 lesson). Usage:
#   docker compose -f docker-compose.vps.yml -f docker-compose.ollama.yml up -d ollama
#   docker exec leadgen_ollama ollama pull qwen2.5:3b-instruct
#   # .env: OLLAMA_URL=http://ollama:11434/v1  (then recreate app)
services:
  ollama:
    image: ollama/ollama:latest
    container_name: leadgen_ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama        # models persist (bind-mount)
    expose:
      - "11434"
    environment:
      OLLAMA_KEEP_ALIVE: "10m"             # model RAM me 10min — repeat calls fast
      OLLAMA_NUM_PARALLEL: "1"             # 1 concurrent (4-core VPS — no overload)
    deploy:
      resources:
        limits:
          cpus: "3.0"                      # 4-core VPS: 3 ollama, 1 app ke liye
          memory: 6g
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
