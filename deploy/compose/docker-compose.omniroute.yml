# =============================================================================
# docker-compose.omniroute.yml — LOCAL OmniRoute gateway (WSL replacement).
# -----------------------------------------------------------------------------
# The OmniRoute free-LLM gateway now runs as a Docker container instead of a WSL
# Ubuntu-24.04 + tmux + nvm Node 22 stack. DEV / LOOPBACK-ONLY.
#
# Start:   docker compose -f deploy/compose/docker-compose.omniroute.yml up -d --build
# Check:   docker compose -f deploy/compose/docker-compose.omniroute.yml ps
# Logs:    docker compose -f deploy/compose/docker-compose.omniroute.yml logs -f omniroute
# Dashboard: http://127.0.0.1:20128
#
# ⚠️  NEVER publish 20128/20129 beyond loopback. The gateway holds provider keys
#     and can be reached without auth on loopback (2026-08-09 smoke: an anonymous
#     request also returned 200) — loopback binding is the whole security model.
#
# Producer / provider connections live in the named volume `omniroute_data`
# (container path /root/.omniroute — matches the WSL config dir). If you are
# migrating from the WSL instance, seed this volume from the WSL
# /root/.omniroute (or re-establish provider/OAuth connections in the dashboard).
#
# This file is NOT part of the VPS production stack (docker-compose.vps.yml /
# deploy/legacy). OmniRoute must stay absent from production per ADR-111.
# =============================================================================

name: leadgen-omniroute

services:
  omniroute:
    build:
      context: .
      dockerfile: Dockerfile.omniroute
    image: leadgen-omniroute:3.8.46
    container_name: leadgen_omniroute
    restart: unless-stopped
    environment:
      # V8 heap (MB). Default 4096 = prod-proven on an 8GB box (2048 -> HTTP 503 under
      # heap pressure). The launcher auto-detects host RAM and clamps to [1024, 4096];
      # set OMNIROUTE_MEMORY_MB to override for manual control.
      OMNIROUTE_MEMORY_MB: "${OMNIROUTE_MEMORY_MB:-4096}"
    volumes:
      # Persist config / provider connections / logs across restarts.
      - omniroute_data:/root/.omniroute
    ports:
      # Loopback-only — the security boundary. Do not change to 0.0.0.0.
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20129:20129"
    # Hard container memory backstop (well above Node's ~heap*1.3-1.5 RSS) so a
    # runaway gateway never starves Docker Desktop, and so GC pressure is never an
    # OOM tripwire. The adaptive heap (OMNIROUTE_MEMORY_MB) is the real clamp.
    # Override with OMNIROUTE_MEM_LIMIT_MB.
    mem_limit: "${OMNIROUTE_MEM_LIMIT_MB:-8192}m"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  omniroute_data:
