# =============================================================================
# LiteLLM gateway config (G7). free_ai.py ke SAME free providers — gateway sirf
# (a) OpenAI-compatible single endpoint, (b) Redis prompt-cache (repeated/similar
# prompts => provider call bachta => Groq daily-token limit pain kam), (c) auto
# fallback chain. free_ai.py PRIMARY rehta; ye optional layer hai.
#
# Cache NOTE: yahan default Redis exact-match cache hai (zero extra infra). True
# *semantic* cache ke liye `type: redis-semantic` + embedding model chahiye —
# baad me on kar sakta (niche commented).
# =============================================================================

model_list:
  - model_name: chat-primary            # clients ise call karein
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
  - model_name: chat-fallback-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: chat-fallback-openrouter
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: chat-fallback-gemini
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  # Exact-match Redis cache (TTL 1h). Repeated system-prompt/FAQ answers instant.
  cache: true
  cache_params:
    type: redis
    ttl: 3600
  # True semantic cache (similar prompts bhi hit) — enable karne ke liye:
  # cache_params:
  #   type: redis-semantic
  #   similarity_threshold: 0.9
  #   redis_semantic_cache_embedding_model: text-embedding-3-small

router_settings:
  # free_ai.py jaisi fallback chain — primary down/429 -> agla.
  fallbacks:
    - chat-primary: ["chat-fallback-groq", "chat-fallback-openrouter", "chat-fallback-gemini"]
  num_retries: 2
  timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Per-tenant virtual keys + budgets (white-label) ke liye DB chahiye — enable:
  # database_url: os.environ/DATABASE_URL
