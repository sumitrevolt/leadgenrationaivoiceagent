# Minimal Grafana Tempo config — receives OTLP traces from the app
# (ENABLE_OTEL=1) on :4317 (gRPC) / :4318 (HTTP). Local block storage.
#
# NOTE: `ingester:` and `compactor:` blocks REMOVED — is Tempo image me unka
# schema reject hota tha ("field ingester not found in type app.Config" → 329
# restarts). Defaults bilkul theek hain; traces tabhi aate jab ENABLE_OTEL=1
# + otel packages image me hon.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
