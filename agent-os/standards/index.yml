# Agent OS Standards Index

backend:
  api-routers:
    description: APIRouter module conventions, duplicate-route grep, god-router split mounting
  auth:
    description: Centralized auth via auth_deps, require_admin pattern, audit logging
  error-handling:
    description: Soft-error envelope, never-raise aggregators, fail-OPEN vs fail-CLOSED policy
  lazy-imports:
    description: Function-level imports in handlers and the startup-gate blind spot they create
  pydantic-models:
    description: Request model conventions, bounded Fields, defensive dict payload reads

billing:
  billing-truth:
    description: packages.py single pricing source, contract-test-first, GST Rule-46 invoices

frontend:
  admin-actions:
    description: actionConfirmModal for consequential actions, truth-telling dashboards, app:8080

global:
  config:
    description: settings vs os.getenv, secrets in .env only, app port 8080 vs 8000 trap
  feature-flags:
    description: Env-flag gating, INERT defaults, call-time getenv, AUTOMATION_FLAGS registry
  logging:
    description: setup_logger pattern, no secrets/PII in logs, loud canaries

voice:
  circuit-breaker:
    description: Per-provider 429 cooldown, exponential backoff, per-key breakers
  compliance-gate:
    description: TRAI outbound chokepoint, fail-CLOSED DND, calling windows, platform_dial hard-off
  free-provider-chain:
    description: Free-only AI providers, import-safe never-raise chain, empty-tuple fallback
  hot-path:
    description: No-op fallbacks for optional deps, to_thread+deadline for ML, VAD/EdgeTTS pins
  reply-mirror:
    description: reply() and reply_stream_sentences() must stay behaviourally identical
