# Minimal Grafana Tempo config — receives OTLP traces from the app (ENABLE_OTEL=1)
# on :4317 (gRPC) / :4318 (HTTP). Local block storage, 48h retention.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
