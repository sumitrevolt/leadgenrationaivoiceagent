# =============================================================================
# Prometheus alert rules — LeadGen stack.
# Loaded by prometheus.yml (rule_files). Alerts -> Alertmanager -> email.
#
# `up`-based alerts har setup me kaam karte (Prometheus scrape se aata).
# HTTP-rate alerts tabhi fire honge jab app `http_requests_total` /
# `http_request_duration_seconds_bucket` expose kare (2026-08-01: ab production
# me default-on hota hai — app/middleware/http_metrics.py `enabled()`).
# Metric naam alag ho to inhe tune karna.
# =============================================================================
groups:
  - name: availability
    rules:
      - alert: AppInstanceDown
        expr: up{job="leadgen-app"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "leadgen_app down (2m+)"
          description: "Prometheus {{ $labels.job }} target reachable nahi — app/container down ya /metrics block."

      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Scrape target down: {{ $labels.job }}"
          description: "{{ $labels.instance }} 5m se scrape nahi ho raha."

  - name: latency_errors
    rules:
      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_requests_total{job="leadgen-app",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="leadgen-app"}[5m])), 0.001) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "5xx error rate > 2% (5m)"
          description: "App 5xx errors spike — Sentry/Tempo trace dekho."

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="leadgen-app"}[5m])) by (le)) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency > 2s (10m)"
          description: "Requests slow — DB/LLM/TTS downstream check karo."

  # ---------------------------------------------------------------------------
  # SLO BURN-RATE (enterprise audit fix 2026-08-01). Availability SLO: 99.5% /
  # 30d => error budget 0.5%. Multi-window burn-rate alerts fire on budget
  # consumption RATE (Google SRE pattern) instead of a raw static threshold:
  #   - Fast burn (critical): 14.4x rate on 5m AND 6x on 1h — budget khatam
  #     hone se pehle page karta hai.
  #   - Slow burn (warning): 2x on 1h AND 1x on 6h — sustained low-grade
  #     degradation jo static-alert se chhoot jata.
  # Recording rules budget exhaust-time ko Prometheus me expose karte hain.
  # Requires http_requests_total series => production default-on (http_metrics).
  # ---------------------------------------------------------------------------
  - name: slo_burn_rate
    rules:
      - record: leadgen:slo:availability:error_ratio_5m
        expr: |
          sum(rate(http_requests_total{job="leadgen-app",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="leadgen-app"}[5m])), 0.001)
      - record: leadgen:slo:availability:error_ratio_1h
        expr: |
          sum(rate(http_requests_total{job="leadgen-app",status=~"5.."}[1h]))
            / clamp_min(sum(rate(http_requests_total{job="leadgen-app"}[1h])), 0.001)
      - record: leadgen:slo:availability:error_ratio_6h
        expr: |
          sum(rate(http_requests_total{job="leadgen-app",status=~"5.."}[6h]))
            / clamp_min(sum(rate(http_requests_total{job="leadgen-app"}[6h])), 0.001)

      - alert: SLOAvailabilityFastBurn
        expr: |
          leadgen:slo:availability:error_ratio_5m > (1 - 0.995) * 14.4
            and leadgen:slo:availability:error_ratio_1h > (1 - 0.995) * 6
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Availability SLO fast burn — budget 30d/0.5% ~14.4x rate (5m)"
          description: "5xx rate {{ $value }} — 30-din error budget is rate pe ~2 din me khatam. AppDown/5xx spike triage turant karo."

      - alert: SLOAvailabilitySlowBurn
        expr: |
          leadgen:slo:availability:error_ratio_1h > (1 - 0.995) * 2
            and leadgen:slo:availability:error_ratio_6h > (1 - 0.995) * 1
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Availability SLO slow burn — sustained low-grade 5xx (1h)"
          description: "Constant ~1% 5xx saal bhar = budget khatam. Intermittent route/upstream issue ho sakta — trend check karo."

  - name: resources
    rules:
      - alert: ContainerHighMemory
        expr: |
          (process_resident_memory_bytes{job="leadgen-app"} / 1e9) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "App RSS > 1.5GB (10m)"
          description: "Memory creep — worker_max_memory_per_child / leak check."

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE (audit infra-upgrade) — USE metrics from node/cAdvisor/
  # postgres/redis exporters. In alerts ke liye un exporters ka chalna zaroori.
  # ---------------------------------------------------------------------------
  - name: infrastructure
    rules:
      - alert: HostDiskLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/rootfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/rootfs"}) < 0.10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Host disk < 10% free"
          description: "VPS disk bharne wala — logs/jsonl/docker prune karo (single-VPS = data-loss risk)."

      - alert: HostMemoryHigh
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Host memory < 10% available (10m)"
          description: "OOM-kill risk — container mem_limits (P1-1) ya leak check karo."

      - alert: RedisMainNearFull
        expr: |
          redis_memory_max_bytes{job="redis"} > 0
            and (redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"}) > 0.85
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Main redis (noeviction) > 85% full"
          description: "noeviction = full hone pe WRITES FAIL honge (broker/idempotency). maxmemory badhao ya purge (audit P0-1)."

      - alert: RedisMainEvictions
        expr: increase(redis_evicted_keys_total{job="redis"}[15m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Main redis evicting keys (noeviction violated!)"
          description: "Main redis pe eviction NAHI hona chahiye — policy misconfig ya wrong instance. Broker/state data-loss risk."

      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_database_numbackends{job="postgres"})
            / clamp_min(pg_settings_max_connections{job="postgres"}, 1) > 0.80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres connections > 80% of max"
          description: "Pool saturation (audit P1-2) — PgBouncer/app pool sizing ya leak check."

      - alert: PostgresDown
        expr: pg_up{job="postgres"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Postgres reachable nahi (2m+)"
          description: "DB down ya exporter creds wrong — app DB-dependent routes fail honge."

      - alert: ContainerNearMemLimit
        expr: |
          container_spec_memory_limit_bytes{name=~"leadgen_.+"} > 0
            and (container_memory_usage_bytes{name=~"leadgen_.+"}
              / container_spec_memory_limit_bytes{name=~"leadgen_.+"}) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} > 90% of mem_limit (10m)"
          description: "OOM-kill imminent — mem_limit badhao (audit P1-1) ya leak check."

      # --- Backup/DR (textfile metrics: pg_backup.sh / pg_restore_drill.sh) ---
      # "Untested/silent-failed backup = no backup". Single-VPS pe backup hi recovery hai.
      - alert: BackupStale
        expr: (time() - leadgen_pg_backup_last_success_timestamp_seconds) > 93600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No successful pg backup in >26h"
          description: "pg_backup.sh fail ya cron band — /var/log/leadgen_backup.log dekho (backup = only recovery)."

      - alert: BackupMetricMissing
        expr: absent(leadgen_pg_backup_last_success_timestamp_seconds)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Backup metric missing"
          description: "pg_backup.sh ne metric nahi likha (cron/textfile mount check) — ya pehli baar; confirm karo."

      - alert: RestoreDrillFailed
        expr: leadgen_pg_restore_drill_success == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "pg restore-drill FAILED — backup suspect"
          description: "Latest backup restore nahi hua (untested backup = no backup). /var/log/leadgen_drill.log dekho."

      - alert: RestoreDrillStale
        expr: (time() - leadgen_pg_restore_drill_last_timestamp_seconds) > 3456000
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "No restore-drill in >40 days"
          description: "Monthly restore-drill cron band ho sakta — DR confidence verify karo."

  # ---------------------------------------------------------------------------
  # CELERY — queue backlog, DLQ growth, worker availability.
  # Metrics sources:
  #   leadgen_celery_queue_depth  — health.py queue_depth() gauge (app /metrics)
  #   celery_workers_online       — celery-exporter :9808 (docker-compose.addons.yml)
  # ---------------------------------------------------------------------------
  - name: celery
    rules:
      - alert: CeleryQueueBacklog
        expr: leadgen_celery_queue_depth{queue="celery"} > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Celery main queue backlog > 100 tasks (5m)"
          description: "Redis `celery` list depth {{ $value }} — worker concurrency kam ya tasks stuck. `redis-cli llen celery` + Flower :5555 dekho."

      - alert: CeleryDLQNonEmpty
        expr: leadgen_celery_queue_depth{queue="dlq:failed_tasks"} > 3
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Celery DLQ has > 3 failed tasks (5m)"
          description: "Dead-letter queue `dlq:failed_tasks` depth {{ $value }} — tasks permanently failing. `scripts/queue_idempotency_audit.py` + worker logs dekho."

      - alert: CeleryWorkerDown
        expr: celery_workers_online == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "No Celery workers online (2m)"
          description: "celery-exporter (:9808) reports 0 online workers — `leadgen_worker` container down ya broker unreachable. `docker compose ps worker` + `redis-cli ping` karo."

  # ---------------------------------------------------------------------------
  # LLM PROVIDER HEALTH — metrics emitted by app/platform/health.py (lines
  # 362-387). Alerts fire before voice calls start silently failing due to
  # provider exhaustion / chain-level fallback saturation.
  # openrouter excluded from per-provider alert (multi-key pool, ok_rate noisy).
  # ---------------------------------------------------------------------------
  - name: llm
    rules:
      - alert: LLMProviderDegraded
        expr: |
          leadgen_llm_provider_ok_rate{provider!~"openrouter.*"} < 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "LLM provider {{ $labels.provider }} ok_rate < 50% (10m)"
          description: "Provider {{ $labels.provider }} half se zyada requests fail kar raha — circuit-breaker active ya quota near-exhausted. free_ai.py chain log dekho; voice/marketing quality degrade ho sakti hai."

      - alert: LLMChainDegraded
        expr: |
          leadgen_llm_fallback_rate > 0.5
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "LLM fallback_rate > 50% (5m) — chain under stress"
          description: "Primary providers zyada fail ho rahe hain; chain tail-providers (NVIDIA NIM / OpenRouter) pe shift ho rahi hai. Voice calls silently degrade honge. free_ai.py provider health + /api/platform/health dekho."
