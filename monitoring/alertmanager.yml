# =============================================================================
# Alertmanager config — Prometheus alerts ko EMAIL karta hai (Hostinger SMTP).
# Used by docker-compose.observability.yml (alertmanager service).
#
# SECRET-SAFE: SMTP password yahan committed NAHI — `smtp_auth_password_file`
# se padha jaata hai. Woh file (`monitoring/alertmanager_smtp_pass`) gitignored
# hai aur deploy pe `.env` ke SMTP_PASSWORD se VPS pe likhi jaati hai.
# =============================================================================
global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.hostinger.com:587"
  smtp_from: "admin@leadsgenai.in"
  smtp_auth_username: "admin@leadsgenai.in"
  smtp_auth_password_file: /etc/alertmanager/smtp_pass
  smtp_require_tls: true

route:
  receiver: email-admin
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers: ['severity="critical"']
      receiver: email-admin
      repeat_interval: 1h

receivers:
  - name: email-admin
    email_configs:
      - to: "admin@leadsgenai.in"
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["alertname"]
