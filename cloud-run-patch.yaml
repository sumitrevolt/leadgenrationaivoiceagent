apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: leadgen-ai-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '100'
        autoscaling.knative.dev/minScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/startup-cpu-boost: 'true'
      labels:
        deploy-timestamp: '20260104-195200'
    spec:
      containerConcurrency: 80
      containers:
      - image: asia-south1-docker.pkg.dev/gen-lang-client-0363264165/leadgen-ai/leadgen-ai-api:v1.0.6
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
        env:
        - name: DEBUG
          value: 'false'
        - name: APP_ENV
          value: production
        - name: DEFAULT_LLM
          value: vertex-gemini
        - name: DEFAULT_STT
          value: deepgram
        - name: DEFAULT_TELEPHONY
          value: exotel
        - name: DEFAULT_TTS
          value: edge
        - name: ENABLE_DND_CHECK
          value: 'true'
        - name: GOOGLE_CLOUD_PROJECT
          value: gen-lang-client-0363264165
        - name: LOG_LEVEL
          value: INFO
        - name: MAX_CONCURRENT_CALLS
          value: '50'
        - name: TIMEZONE
          value: Asia/Kolkata
        - name: VERTEX_AI_LOCATION
          value: asia-south1
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-anthropic-api-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-database-url
        - name: DEEPGRAM_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-deepgram-api-key
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-elevenlabs-api-key
        - name: EXOTEL_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-exotel-api-key
        - name: EXOTEL_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-exotel-api-token
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-gemini-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-openai-api-key
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-redis-url
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-sentry-dsn
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-twilio-account-sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-twilio-auth-token
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: production-secret-key
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      serviceAccountName: production-cloud-run-sa@gen-lang-client-0363264165.iam.gserviceaccount.com
      timeoutSeconds: 300
