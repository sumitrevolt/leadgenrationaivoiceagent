  worker-cli-operations:
    profiles: ["celery"]
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/sumitrevolt/leadgenrationaivoiceagent}:${APP_VERSION:?set APP_VERSION to the immutable git SHA}
    container_name: leadgen_worker_cli_operations
    healthcheck:
      disable: true
    networks: [leadgen_net]
    mem_limit: 512m
    cpus: "0.5"
    user: "0:0"
    command: python -m app.workers.cli_worker --supervisor operations --interval 60
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leadgen}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@pgbouncer:6432/${POSTGRES_DB:-leadgen}
      REDIS_URL: redis://redis:6379/0
      LEADGEN_RUNTIME_DATA_DIR: ${LEADGEN_RUNTIME_DATA_DIR:-/var/lib/leadgen/runtime}
      LEADGEN_RUNTIME_DATA_HOST_DIR: ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}
      RUN_IN_PROCESS_SCHEDULER: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}:/var/lib/leadgen/runtime
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
  worker-heavy:
    profiles: ["celery"]
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/sumitrevolt/leadgenrationaivoiceagent}:${APP_VERSION:?set APP_VERSION to the immutable git SHA}
    container_name: leadgen_worker_heavy
    mem_limit: 2500m   # heavy ML/LLM/bulk jobs — thoda zyada headroom
    mem_reservation: 512m
    cpus: "1.5"
    user: "0:0"
    command: celery -A app.worker worker -Q heavy,heavy_llm --loglevel=info --concurrency=1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leadgen}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@pgbouncer:6432/${POSTGRES_DB:-leadgen}
      REDIS_URL: redis://redis:6379/0
      LEADGEN_RUNTIME_DATA_DIR: ${LEADGEN_RUNTIME_DATA_DIR:-/var/lib/leadgen/runtime}
      LEADGEN_RUNTIME_DATA_HOST_DIR: ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}
      CACHE_REDIS_URL: redis://redis-cache:6379/0   # evictable cache only (app.cache.Cache); unset = main redis fallback
      RUN_IN_PROCESS_SCHEDULER: "0"
      CELERY_HEAVY_QUEUE: "1"
      CELERY_HEAVY_WORKER: "1"   # process-role marker: Qdrant/ONNX warm-up only here
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}:/var/lib/leadgen/runtime
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "sh /app/scripts/celery_worker_healthcheck.sh"]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [leadgen_net]

  # ---------------------------------------------------------------------------
  # HEAVY-LLM worker (T06 B2 §11.2) — NETWORK/LLM-bound heavy staff-jobs
  # (blog, content, digest, prospect) on their own queue, concurrency 2.
  #
  # Why: `worker-heavy` runs --concurrency=1, so all 8 heavy jobs serialise. The
  # 4 LLM jobs each hold one outbound request at a time → they parallelise; the 4
  # ML jobs (qa/trainer/hot_queue_*) stay serial on `heavy`.
  #
  # ⚠️ NOT asserted memory-safe. The host is a single 16GB/4-core VPS and existing
  # mem_limit ceilings already sum to ≈16.7GB. This ships behind
  # `CELERY_HEAVY_LLM_QUEUE=0` (DEFAULT) — routing stays on the single `heavy`
  # queue until the owner ENABLES it. Before enabling in production run the
  # validation gate: `docker stats --no-stream` + `free -m` under a real
  # `content`+`blog` overlap, and enable only if host free memory stays > 2GB and
  # no container is throttled. `HEAVY_LLM_CONCURRENCY` is clamped 1–3 by intent
  # (default 2); do NOT raise above 2 until measured. Rollback: set
  # `CELERY_HEAVY_LLM_QUEUE=0` and stop this service — `worker-heavy` then drains
  # `heavy,heavy_llm` serially = today's throughput. No data migration.
  #
  # CELERY_HEAVY_WORKER is deliberately NOT set here: only `worker-heavy` runs the
  # memory-heavy Qdrant/ONNX warm-up (test_heavy_worker_marker_is_exclusive...).
  # ---------------------------------------------------------------------------
  worker-heavy-llm:
    profiles: ["celery"]
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/sumitrevolt/leadgenrationaivoiceagent}:${APP_VERSION:?set APP_VERSION to the immutable git SHA}
    container_name: leadgen_worker_heavy_llm
    mem_limit: 1500m   # 2 concurrent network-bound LLM jobs ≈1.2GB peak < 1500m
    mem_reservation: 512m
    cpus: "1.0"
    user: "0:0"
    command: celery -A app.worker worker -Q heavy_llm --loglevel=info --concurrency=${HEAVY_LLM_CONCURRENCY:-2}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leadgen}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@pgbouncer:6432/${POSTGRES_DB:-leadgen}
      REDIS_URL: redis://redis:6379/0
      LEADGEN_RUNTIME_DATA_DIR: ${LEADGEN_RUNTIME_DATA_DIR:-/var/lib/leadgen/runtime}
      LEADGEN_RUNTIME_DATA_HOST_DIR: ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}
      CACHE_REDIS_URL: redis://redis-cache:6379/0
      RUN_IN_PROCESS_SCHEDULER: "0"
      CELERY_HEAVY_QUEUE: "1"
      QDRANT_URL: http://qdrant:6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}:/var/lib/leadgen/runtime
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "sh /app/scripts/celery_worker_healthcheck.sh"]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [leadgen_net]

  # ---------------------------------------------------------------------------
  # VIDEO worker — video-creative pipeline (ffmpeg-heavy) isolated onto its own
  # queue/process, same starve-prevention shape as worker-heavy above.
  # CELERY_VIDEO_QUEUE flag SEND-side routing on karta (scheduler/app/worker
  # pe bhi set — see app/worker.py _route_video_task). Default OFF (INERT) —
  # unset means video tasks fall back to the default "celery" queue, so this
  # ships safely before this service is ever started.
  #
  # T07 (§9.1 / §12 A3) — DEMOTED to the thin, NETWORKED ORCHESTRATOR. The
  # browser toolchain (Node + pinned Chrome headless) moved OUT of this service
  # and into the netless `renderer` below; this service keeps the base app image,
  # fetches inputs, writes a spool job, collects the artifact, then does
  # QA/register/approve. It stays networked on purpose — it is the side that
  # talks to the VPS and to Redis. RC5 isolation is NOT claimed here.
  # ---------------------------------------------------------------------------
  worker-video:
    profiles: ["celery"]
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/sumitrevolt/leadgenrationaivoiceagent}:${APP_VERSION:?set APP_VERSION to the immutable git SHA}
    container_name: leadgen_worker_video
    mem_limit: 2000m
    mem_reservation: 512m
    cpus: "1.5"
    user: "0:0"
    command: celery -A app.worker worker -Q video --loglevel=info --concurrency=1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leadgen}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@pgbouncer:6432/${POSTGRES_DB:-leadgen}
      REDIS_URL: redis://redis:6379/0
      LEADGEN_RUNTIME_DATA_DIR: ${LEADGEN_RUNTIME_DATA_DIR:-/var/lib/leadgen/runtime}
      LEADGEN_RUNTIME_DATA_HOST_DIR: ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}
      CACHE_REDIS_URL: redis://redis-cache:6379/0
      RUN_IN_PROCESS_SCHEDULER: "0"
      QDRANT_URL: http://qdrant:6333
      # T07: the shared spool this orchestrator writes jobs to and collects
      # artifacts from. The netless `renderer` mounts the SAME host directory.
      CREATIVE_RENDER_SPOOL_ROOT: /spool
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}:/var/lib/leadgen/runtime
      - ./logs:/app/logs
      - ${CREATIVE_RENDER_SPOOL_HOST_DIR:-/opt/leadgen-render-spool}:/spool
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "sh /app/scripts/celery_worker_healthcheck.sh"]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [leadgen_net]

  # ---------------------------------------------------------------------------
  # NETLESS RENDERER (T07, RC5 enforcement) — the hermetic render step.
  #
  # `network_mode: "none"` gives this container NO network interface at all (only
  # `lo`). That is STRONGER than a netns prefix and needs ZERO capabilities, which
  # is why `unshare --net` was rejected: worker-video has no CAP_SYS_ADMIN, so the
  # syscall cannot succeed and RC5 would *look* fixed while staying broken (C7).
  #
  # It is NOT a Celery worker and needs no Redis/Postgres/egress, so
  # `network_mode: none` is safe. It is driven by a filesystem SPOOL on the shared
  # volume: the networked orchestrator (worker-video) writes a job file; this
  # service renders and writes the artifact + result back. Viable because
  # render_plane/transport.py already fetches the spec + assets BEFORE the
  # hermetic render (Dockerfile.video:71-73 documents the same intent).
  #
  # HONESTY: CREATIVE_RENDER_NETLESS=1 is a fact asserted by THIS runtime and is
  # only truthful because this service runs `network_mode: none`. It is baked
  # into Dockerfile.video because that image runs netless and nowhere else. The
  # healthcheck re-checks the fact (`spool verify` makes one outbound connection
  # and fails the check if egress still works) so a mislabelled render cannot
  # report healthy.
  #
  # Image: the opt-in overlay deploy/compose/docker-compose.video.yml supplies the
  # video toolchain image; the default deploy path is unchanged (this service is
  # profile-gated and inert until started).
  # ---------------------------------------------------------------------------
  renderer:
    profiles: ["celery"]
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/sumitrevolt/leadgenrationaivoiceagent}:${APP_VERSION:?set APP_VERSION to the immutable git SHA}
    container_name: leadgen_renderer
    # No network interface at all — the RC5 primitive. No `networks:` on purpose:
    # it is incompatible with `network_mode` and would silently re-attach a NIC.
    network_mode: "none"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Chrome is memory-hungry: one 1080x1920 render plus the encoder (moved here
    # from worker-video, which no longer carries the browser). Keep >=8192m: the
    # hyperframes producer switches to a SLOW capture profile below 8192 MiB.
    mem_limit: 10240m
    mem_reservation: 2048m
    cpus: "2.0"
    # Chrome headless shell needs >=256MB of /dev/shm (Docker default 64MB); the
    # render crashes with "Target closed" at ~67/762 frames otherwise.
    shm_size: 512m
    user: "0:0"   # bind-mounted spool volume writable (app jaisa)
    environment:
      # Runtime-asserted fact consumed by network_guard.build_isolation().
      CREATIVE_RENDER_NETLESS: "1"
      # Renderer lives at /opt so the /app bind-mounts cannot shadow it.
      CREATIVE_HYPERFRAMES_ROOT: /opt/video_renderer/hyperframes
      CREATIVE_RENDER_SPOOL_ROOT: /spool
      HYPERFRAMES_NO_TELEMETRY: "1"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HYPERFRAMES_NO_AUTO_INSTALL: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${CREATIVE_RENDER_SPOOL_HOST_DIR:-/opt/leadgen-render-spool}:/spool
    restart: unless-stopped
    healthcheck:
      # `verify` makes ONE outbound connection and exits non-zero when the netless
      # claim is not backed by a real block — an honest, fail-closed healthcheck.
      test: ["CMD-SHELL", "python -m app.render_plane.spool verify >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    command: python -m app.render_plane.spool serve
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Hardened DeepSeek Harness worker — profile-gated and INERT unless the service
  # is explicitly started and authority or shadow is enabled. It receives no
  # env_file/database/provider credentials and can reach only app + Redis on
  # the internal dsh_net. One Celery job owns one source-built DSH process.
  # ---------------------------------------------------------------------------
  dsh-worker:
    profiles: ["dsh"]
    build:
      context: .
      dockerfile: deploy/dsh/worker.Dockerfile
      args:
        DSH_IMAGE: ${DSH_RUNTIME_IMAGE:-leadgen-dsh:47f94385}
    image: ${DSH_WORKER_IMAGE_REPOSITORY:-leadgen-dsh-worker}:${APP_VERSION:?set APP_VERSION to the immutable git SHA}
    container_name: leadgen_dsh_worker
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 128
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      APP_VERSION: ${APP_VERSION:?set APP_VERSION to the immutable git SHA}
      REDIS_URL: redis://redis:6379/0
      DSH_RUNTIME_ENABLED: ${DSH_RUNTIME_ENABLED:-0}
      DSH_SHADOW_ENABLED: ${DSH_SHADOW_ENABLED:-0}
      DSH_MCP_URL: http://app:8080/internal/dsh/mcp
      DSH_LLM_BASE_URL: http://app:8080/internal/dsh/v1
      DSH_TOKEN_BACKEND: redis
      DSH_RUN_STORE_BACKEND: redis
      HOME: /tmp
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=65532,gid=65532
      - /run/dsh:rw,noexec,nosuid,size=32m,uid=65532,gid=65532
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m celery -A app.dsh_worker:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [dsh_net]

  scheduler:
    profiles: ["celery"]
    image: ${APP_IMAGE_REPOSITORY:-ghcr.io/sumitrevolt/leadgenrationaivoiceagent}:${APP_VERSION:?set APP_VERSION to the immutable git SHA}
    container_name: leadgen_scheduler
    mem_limit: 512m
    cpus: "0.5"
    user: "0:0"
    command: celery -A app.worker beat --loglevel=info --schedule /app/data/celerybeat-schedule
    # Persist the beat schedule across recreates (SCHED-001 council fix). /tmp was
    # ephemeral, so a redeploy / selfheal restart re-fired every job whose window
    # was currently active (duplicate sends, wasted free-tier quota). ./data is the
    # same bind-mount the app + worker use.
    volumes:
      - ./data:/app/data
      - ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}:/var/lib/leadgen/runtime
      - ./logs:/app/logs
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-leadgen}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD_in_.env}@pgbouncer:6432/${POSTGRES_DB:-leadgen}
      REDIS_URL: redis://redis:6379/0
      LEADGEN_RUNTIME_DATA_DIR: ${LEADGEN_RUNTIME_DATA_DIR:-/var/lib/leadgen/runtime}
      LEADGEN_RUNTIME_DATA_HOST_DIR: ${LEADGEN_RUNTIME_DATA_HOST_DIR:-/opt/leadgen-runtime}
      CACHE_REDIS_URL: redis://redis-cache:6379/0   # evictable cache only (app.cache.Cache); unset = main redis fallback
      CELERY_HEAVY_QUEUE: "1"   # beat = SENDER — routing yahi evaluate hota hai
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # NOTE: image me pgrep NAHI hai (procps absent) → pgrep check hamesha fail
      # hota tha → 'unhealthy' → vps_selfheal cron har 10 min beat restart kar
      # raha tha. /proc scan se beat process dhundo (busybox/sh-safe).
      test: ["CMD-SHELL", "grep -lq beat /proc/[0-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [leadgen_net]

  # ---------------------------------------------------------------------------
  # Qdrant — vector RAG (reuses legacy /opt/qdrant_storage bind mount).
  # Migrate: stop standalone `qdrant` container, then `up -d qdrant` (scripts/vps_migrate_qdrant.sh).
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: leadgen_qdrant
    mem_limit: 768m
    cpus: "1.0"
    volumes:
      - /opt/qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped
    healthcheck:
      # qdrant image has no curl/wget — use bash /dev/tcp TCP probe (bash IS present).
      # Old curl check failed forever (false "unhealthy", FailingStreak 448).
      test: ["CMD", "bash", "-c", ": < /dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [leadgen_net]

volumes:
  pgdata:
  redisdata:
  walarchive:

networks:
  leadgen_net:
    driver: bridge
  dsh_net:
    driver: bridge
    internal: true
