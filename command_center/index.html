<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWNER COMMAND CENTER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--card, #141414);
    color: var(--foreground, #eee);
    height: 100vh;
    display: grid;
    grid-template-columns: 240px 1fr;
    overflow: hidden;
    font-size: 14px;
  }
  /* ---------- SIDEBAR ---------- */
  aside {
    background: var(--background, #0d0d0d);
    border-right: 1px solid var(--border, #2a2a2a);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  aside h1 { font-size: 15px; padding: 14px 14px 4px; }
  .sub { padding: 0 14px 10px; color: var(--muted-foreground, #888); font-size: 12px; border-bottom: 1px solid var(--border, #2a2a2a); }
  .sec { padding: 10px 14px 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground, #777); }
  .row { display: flex; align-items: center; gap: 9px; padding: 7px 14px; cursor: pointer; }
  .row:hover { background: rgba(255,255,255,.05); }
  .row.active { background: rgba(124,58,237,.18); }
  .av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .nm { flex: 1; min-width: 0; }
  .nm b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { font-size: 11px; color: var(--muted-foreground, #999); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .g{background:#22c55e}.y{background:#eab308}.r{background:#ef4444}.x{background:#666}
  /* ---------- CHAT ---------- */
  main { display: flex; flex-direction: column; overflow: hidden; }
  header {
    padding: 10px 18px; border-bottom: 1px solid var(--border, #2a2a2a);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header b { font-size: 16px; }
  header span { color: var(--muted-foreground, #888); font-size: 12.5px; }
  .pin {
    margin: 10px 18px 0; padding: 9px 13px; font-size: 12.5px; line-height: 1.55;
    border-left: 3px solid #7c3aed; background: rgba(124,58,237,.08); border-radius: 6px;
  }
  .pin .t { font-weight: 700; }
  #feed { flex: 1; overflow-y: auto; padding: 14px 18px 20px; }
  .msg { max-width: 78%; margin: 0 0 12px; }
  .msg.owner-side { margin-left: auto; }
  .meta { font-size: 12px; margin-bottom: 3px; }
  .meta .role { color: var(--muted-foreground, #888); }
  .meta .tm { color: var(--muted-foreground, #777); font-size: 11px; margin-left: 6px; }
  .replyto {
    font-size: 11.5px; color: var(--muted-foreground, #999);
    border-left: 2px solid var(--accent, #7c3aed); padding: 1px 8px; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bubble {
    background: var(--muted, #1d1d1d); padding: 8px 12px; border-radius: 10px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .owner-side .bubble { background: rgba(124,58,237,.22); }
  .taskref { color: #a78bfa; cursor: pointer; text-decoration: underline dotted; }
  .mention { color: #60a5fa; }
  footer { padding: 10px 18px; border-top: 1px solid var(--border, #2a2a2a); color: var(--muted-foreground, #777); font-size: 12px; }
</style>
</head>
<body>
<aside id="side"></aside>
<main>
  <header><b>OWNER COMMAND CENTER</b><span id="hdr-sub"></span></header>
  <div class="pin" id="pin"></div>
  <div id="feed"></div>
  <footer>Chronological group history · every task visible here · long technical logs live in task threads</footer>
</main>
<script src="state.js"></script>
<script>
(function () {
  const S = window.CC_STATE || {};
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
      c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = ts => { try { return new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); } catch(e){ return ts; } };

  // linkify @mentions and TASK ids
  const rich = t => esc(t)
    .replace(/@([A-Za-z][\w-]*)/g, '<span class="mention">@$1</span>')
    .replace(/\b((?:REV|TASK)-\d+)\b/g, '<span class="taskref">$1</span>');

  const dotFor = st => /BLOCK/i.test(st) ? "r" : (/REV-|WORKING|COORDINATING|RUNNING/i.test(st) ? "y" : (/IDLE/i.test(st) ? "g" : "x"));

  // sidebar
  document.getElementById("hdr-sub").textContent = S.subtitle || "";
  const side = document.getElementById("side");
  let h = '<h1>OWNER COMMAND CENTER</h1><div class="sub">' + esc(S.subtitle||"") + "</div>";
  const teams = [["Engineering",["engineering","platform"]],["Revenue",["sales","hunter"]],["Operations",["operations","board"]],["Customer Success",["success","guardian"]]];
  h += '<div class="sec">Teams</div>';
  teams.forEach(([t]) => h += '<div class="row"><div class="nm"><b>' + t + "</b></div></div>");
  h += '<div class="sec">Bots</div>';
  Object.entries(S.bots || {}).forEach(([name, b]) => {
    h += '<div class="row' + (name==="Pilot"?" active":"") + '">'
       + '<div class="av">' + esc(b.avatar||"🤖") + '</div>'
       + '<div class="nm"><b>' + esc(name) + '</b><div class="st">' + esc(b.status||"IDLE") + '</div></div>'
       + '<div class="dot ' + dotFor(b.status) + '"></div></div>';
  });
  side.innerHTML = h;

  // pinned objective
  const p = S.pinned || {};
  document.getElementById("pin").innerHTML =
    '<span class="t">📌 OWNER OBJECTIVE</span><br>' +
    esc(p.text || "").replace(/\n/g,"<br>");

  // feed
  const feed = document.getElementById("feed");
  (S.messages || []).forEach(m => {
    const b = (S.bots||{})[m.from] || {};
    let d = '<div class="msg' + (m.from==="OWNER"?" owner-side":"") + '">';
    if (m.reply_to) d += '<div class="replyto">↳ Reply to: ' + esc(m.reply_to) + "</div>";
    d += '<div class="meta"><b>' + esc(b.avatar||"") + " " + esc(m.from) + '</b> <span class="role">· ' + esc(b.role||"Owner") + '</span><span class="tm">' + fmt(m.ts) + "</span></div>";
    d += '<div class="bubble">' + rich(m.text) + "</div></div>";
    feed.insertAdjacentHTML("beforeend", d);
  });
  feed.scrollTop = feed.scrollHeight;
})();
</script>
</body>
</html>
