# /etc/logrotate.d/leadgen — Log rotation for LeadGen VPS stack
# Deploy: cp scripts/logrotate_leadgen.conf /etc/logrotate.d/leadgen
# Test:   logrotate -f /etc/logrotate.d/leadgen

/opt/leadgen/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        # Signal app to reopen log files (Docker container: send SIGUSR1 to uvicorn)
        docker kill --signal=USR1 leadgen_app 2>/dev/null || true
    endscript
}

/var/log/leadgen_selfheal.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
}

/var/log/leadgen_backup.log {
    monthly
    rotate 12
    compress
    missingok
    notifempty
}
