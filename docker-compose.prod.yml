# Production Docker Compose Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOT the live deploy path (production audit 2026-07-01, F-INF1) — the live VPS
# uses docker-compose.vps.yml + Dockerfile.lock exclusively (see
# .github/workflows/deploy-vps.yml + scripts/vps_*). Edits here have zero effect
# on https://leadsgenai.in until something explicitly repoints the deploy path.

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - AUTO_START_PLATFORM=true
      # Disable in-process scheduler on web replicas — scheduler container runs it.
      # With replicas: 3, leaving this ON fires every job 3x (duplicate calls/emails).
      - RUN_IN_PROCESS_SCHEDULER=0
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    volumes:
      - leadgen_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  db:
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=5242kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  redis:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    # -Q explicit: task_routes (app/worker.py) sends scraping/calling/reporting/
    # sync/brain_training/heavy tasks to their own named queues — a bare
    # `worker` with no -Q only drains the default "celery" queue, so those
    # tasks would enqueue but never run. No separate heavy worker in this
    # compose file, so "heavy" is included here (unlike docker-compose.vps.yml,
    # which isolates it onto worker-heavy).
    command: celery -A app.worker worker -Q celery,calling,scraping,reporting,sync,training,heavy,video --loglevel=info --concurrency=8
    volumes:
      - leadgen_data:/app/data
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 4G

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      - RUN_IN_PROCESS_SCHEDULER=1
    volumes:
      - leadgen_data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: voice_agent_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - voice_agent_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  leadgen_data:
    driver: local
