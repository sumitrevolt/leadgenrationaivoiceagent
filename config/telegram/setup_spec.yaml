# =============================================================================
# LeadGen AI — Enterprise Telegram Setup Spec (canonical single source of truth)
# -----------------------------------------------------------------------------
# Consumed by scripts/telegram_setup.py (Bot-API bootstrap) AND by
# docs/TELEGRAM_ENTERPRISE_SETUP.md (human design). Edit HERE, not in the doc.
#
# Products:
#   P1 = AI Automated Marketing   (Main Rs 1,999/mo · Combo/Advanced Rs 5,999/mo)
#   P2 = AI Voice Calling Agent    (Rs 4,999 / 9,999 / 19,999 per niche-band/mo,
#                                    DLT-gated for cold outbound)
#
# Access model:
#   public  = has a t.me/<handle>, discoverable, join via link/search
#   private = invite-only (owner generates + rotates link), join-request approval
#
# chat_id / invite_link are FILLED BY THE OWNER after manual creation (Bot API
# cannot create channels/groups). See docs/TELEGRAM_ENTERPRISE_SETUP.md.
# =============================================================================

version: 1
platform: "LeadGen AI"
base_url: "https://leadsgenai.in"
compliance_note: >-
  Opt-in only. No scraping, no bulk-add, no cold-DM. DPDP Act 2023 + TRAI
  TCCCPR apply. Bots MUST disclose they are automated. No PII/tokens/OTP in
  any chat (bots strip + warn). Manual-UPI payment truth: never claim
  "auto-paid".

# -----------------------------------------------------------------------------
# Global admin roles (referenced by each group's `admins` list)
# -----------------------------------------------------------------------------
admin_roles:
  founder:
    label: "Founder / Owner"
    scope: "all chats"
    perms: ["full", "manage_admins", "delete", "ban", "post", "pin"]
  pm:
    label: "Product Manager"
    scope: "announcements(P1,P2), feedback, internal_admin"
    perms: ["post", "pin", "moderate", "manage_topics"]
  community_manager:
    label: "Community Manager"
    scope: "community, feedback"
    perms: ["moderate", "manage_topics", "pin", "ban"]
  support_lead:
    label: "Support Lead"
    scope: "support"
    perms: ["full_support", "escalate", "ban"]
  support_agent:
    label: "Support Agent"
    scope: "support"
    perms: ["reply", "close_ticket", "label"]
  devops:
    label: "Dev / Ops"
    scope: "internal_admin, owner_alerts"
    perms: ["post", "bot_status", "deploy_notice"]
  bot_welcome:
    label: "LeadGenBot (welcome/consent)"
    scope: "community, support, feedback"
    perms: ["send", "no_admin"]
  bot_mod:
    label: "LeadGenBot (moderation)"
    scope: "community, support, feedback"
    perms: ["delete_msgs", "ban", "no_admin_promote"]
  bot_support:
    label: "LeadGenBot (ticket intake)"
    scope: "support"
    perms: ["send", "no_admin"]
  bot_broadcast:
    label: "LeadGenBot (broadcast)"
    scope: "announcements"
    perms: ["post_via_cms", "no_admin"]

# -----------------------------------------------------------------------------
# PRODUCT 1 — AI Automated Marketing
# -----------------------------------------------------------------------------
products:
  - id: marketing
    name: "AI Automated Marketing"
    pricing: "Main Rs 1,999/mo · Combo/Advanced Rs 5,999/mo (voice callback = 500-min feature)"
    groups:
      - key: announcements
        kind: channel
        name: "LeadGen AI Marketing · Announcements"
        handle: "LeadGenAIMarketingNews"
        purpose: >-
          One-way product updates: feature releases, pricing changes, scheduled
          maintenance, compliance/DPDP notices, outage status. Broadcast only.
        target_audience: "All subscribers — customers + prospects + public"
        access: public
        admins: ["founder", "pm", "bot_broadcast"]
        comments_enabled: false
        intro: >-
          Official LeadGen AI (Marketing) announcements. Subscribe for releases,
          pricing & status. Support: t.me/LeadGenAIMarketingSupport
        chat_id: null
        invite_link: null

      - key: community
        kind: supergroup
        name: "LeadGen AI Marketing · Community"
        handle: "LeadGenAIMarketingCommunity"
        purpose: >-
          Peer discussions, use-cases, wins, growth tactics among SMB owners
          using the Marketing product.
        target_audience: "Customers + trial users + interested SMB owners"
        access: public
        admins: ["founder", "community_manager", "bot_welcome", "bot_mod"]
        forum_topics:
          - "📣 intros"
          - "💡 use-cases"
          - "🚀 wins"
          - "🛠 how-to"
          - "📰 updates (mirror)"
        rules:
          - "No cold DM / scraping of members"
          - "No PII (use ticket ID in Support)"
          - "AI replies are labeled automated"
        chat_id: null
        invite_link: null

      - key: support
        kind: supergroup
        name: "LeadGen AI Marketing · Support"
        purpose: >-
          Ticketed support: bugs, billing, incident updates. Customers only.
        target_audience: "Paying customers (verified post UPI)"
        access: private
        admins: ["founder", "support_lead", "support_agent", "bot_support", "bot_mod"]
        forum_topics:
          - "🎫 open-tickets"
          - "💳 billing-UPI"
          - "🐞 bugs"
          - "🔥 incidents"
        rules:
          - "Reference your ticket ID, not PII"
          - "No tokens/OTP/passwords in chat (bot strips)"
          - "SLA: first reply < 4 business hrs"
        chat_id: null
        invite_link: null

      - key: feedback
        kind: supergroup
        name: "LeadGen AI Marketing · Feedback"
        purpose: >-
          Feature requests, product feedback, beta access. Not for support.
        target_audience: "Customers + selected power users"
        access: private
        admins: ["founder", "pm", "community_manager", "bot_welcome"]
        forum_topics:
          - "✨ requests (P0/P1/P2)"
          - "🧪 beta"
          - "📊 polls"
        rules:
          - "Label requests P0/P1/P2"
          - "Support issues → Support group"
        chat_id: null
        invite_link: null

