# -----------------------------------------------------------------------------
# CROSS-PRODUCT (platform-level, team-only)
# -----------------------------------------------------------------------------
cross_product:
  - key: internal_admin
    kind: supergroup
    name: "LeadGen AI · Internal Ops"
    purpose: >-
      Internal coordination, incident war-room, deploy notices, bot status,
      cross-product decisions. NO customers.
    target_audience: "Team only (founder, dev, support, PM)"
    access: private
    admins: ["founder", "devops", "pm", "support_lead"]
    forum_topics:
      - "🚨 incidents"
      - "🚀 deploys"
      - "🤖 bot-status"
      - "📋 decisions"
    rules:
      - "Secret-free: no tokens/passwords/OTP (bot strips + warns)"
      - "Customer PII only as ticket ID, never raw"
    chat_id: null
    invite_link: null

  - key: owner_alerts
    kind: supergroup
    name: "LeadGen AI · Owner Alerts"
    purpose: >-
      Critical alerts mirror to founder: health, payment-received (UPI),
      incident, kill-switch state. Telegram mirror of the ntfy owner feed.
    target_audience: "Founder only (+ LeadGenBot)"
    access: private
    admins: ["founder", "devops", "bot_broadcast"]
    forum_topics:
      - "💰 payments"
      - "❤️ health"
      - "🔥 incidents"
    rules:
      - "Alerts only — no discussion"
      - "Secret-free"
    chat_id: null
    invite_link: null

# -----------------------------------------------------------------------------
# Global moderation + escalation SOP (applied to every group)
# -----------------------------------------------------------------------------
moderation:
  join_policy: "Voluntary opt-in only. No scraping, no bulk-add, no cold-DM."
  on_join: >-
    WelcomeBot posts rules + consent notice; member must tap /start (or react)
    before posting. Bots identify as automated (AI disclosure).
  anti_abuse:
    spam_phishing_scam: "bot_mod auto-deletes + bans; CM reviews"
    harassment_illegal: "ban + report to Telegram"
  pii_rule: "No PII in chat; Support uses ticket ID. Secret-free everywhere."
  escalation: "Support → Internal Ops → Founder (war-room if incident)"
  opt_out: "Respect leave/unsubscribe; never message a departed member."
  incident: "Internal Ops war-room → Announcements channel status post."

# -----------------------------------------------------------------------------
# Compliance gates (mirrors platform hard gates — never weaken)
# -----------------------------------------------------------------------------
compliance:
  dpdp_2023: "Lawful purpose, consent, data minimization, erasure on leave."
  trai_tccctr: "No UCC; opt-in; honor DND + 09:00–21:00 for any outbound."
  ai_disclosure: "Every automated reply labels itself as a bot."
  payment_truth: "Manual UPI only; never claim 'auto-paid'."
  no_cold_outreach: "No cold Telegram/WhatsApp adds (mirrors existing ban)."
  tenant_isolation: "No cross-customer PII leakage in shared groups."
