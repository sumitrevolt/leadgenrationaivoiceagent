    scope: all chats
    perms:
    - full
    - manage_admins
    - delete
    - ban
    - post
    - pin
  pm:
    label: Product Manager
    scope: announcements(P1,P2), feedback, internal_admin
    perms:
    - post
    - pin
    - moderate
    - manage_topics
  community_manager:
    label: Community Manager
    scope: community, feedback
    perms:
    - moderate
    - manage_topics
    - pin
    - ban
  support_lead:
    label: Support Lead
    scope: support
    perms:
    - full_support
    - escalate
    - ban
  support_agent:
    label: Support Agent
    scope: support
    perms:
    - reply
    - close_ticket
    - label
  devops:
    label: Dev / Ops
    scope: internal_admin, owner_alerts
    perms:
    - post
    - bot_status
    - deploy_notice
  bot_welcome:
    label: LeadGenBot (welcome/consent)
    scope: community, support, feedback
    perms:
    - send
    - no_admin
  bot_mod:
    label: LeadGenBot (moderation)
    scope: community, support, feedback
    perms:
    - delete_msgs
    - ban
    - no_admin_promote
  bot_support:
    label: LeadGenBot (ticket intake)
    scope: support
    perms:
    - send
    - no_admin
  bot_broadcast:
    label: LeadGenBot (broadcast)
    scope: announcements
    perms:
    - post_via_cms
    - no_admin
