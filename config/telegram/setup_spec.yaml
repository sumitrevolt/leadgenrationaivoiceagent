moderation:
  join_policy: Voluntary opt-in only. No scraping, no bulk-add, no cold-DM.
  anti_abuse:
    spam_phishing_scam: bot auto-deletes + bans
    harassment_illegal: ban + report to Telegram
  pii_rule: No PII in chat. Support uses ticket ID. Secret-free everywhere.
  escalation: Support -> Internal Ops -> Founder (war-room if incident)
  opt_out: Respect leave/unsubscribe; never message a departed member.
compliance:
  dpdp_2023: Lawful purpose, consent, data minimization, erasure on leave.
  trai_tccctr: No UCC; opt-in; honor DND + 09:00-21:00 for any outbound.
  ai_disclosure: Every automated reply labels itself as a bot.
  payment_truth: Manual UPI only; never claim auto-paid.
  no_cold_outreach: No cold Telegram/WhatsApp adds.
  tenant_isolation: No cross-customer PII leakage.
