# ---------------------------------------------------------------------------
# KILL SWITCHES — single source of truth for emergency halts
# ---------------------------------------------------------------------------
kill_switches:
  voice_launch_kill:
    env: VOICE_LAUNCH_KILL
    default: 0
    combos: [leadgen-swara-live, leadgen-swara-flagship, hermes-voice]
    description: Voice/telephony hard halt. Production default = 0 (armed).

  hermes_emergency_kill:
    env: HERMES_EMERGENCY_KILL
    default: 0
    combos:
      - leadgen-free-first
      - hermes-owner
      - hermes-sales
      - hermes-engineer
      - hermes-marketing
      - hermes-ops
      - hermes-qa
      - hermes-research
      - hermes-finance
    description: Cross-surface emergency halt for all agent + free combos.

  project_budget_kill:
    env: PROJECT_BUDGET_KILL
    default: 0
    combos: [leadgen-project-best]
    description: Heavy combo budget fence; cost > ₹X/day → halt.

# ---------------------------------------------------------------------------
# SELF-HEALING RULES — autonomous re-route on provider failure
# ---------------------------------------------------------------------------
self_healing:
  enabled: true
  rules:
    - id: SH-01
      name: provider_failure_cascade
      trigger: 3_consecutive_5xx_from_provider
      action: demote_provider_to_failover_slot
      cooldown_seconds: 300

    - id: SH-02
      name: quota_exceeded_daily
      trigger: free_tier_limit_daily_reached
      action: route_to_next_combo_in_manifest
      cooldown_seconds: 3600

    - id: SH-03
      name: combo_all_providers_down
      trigger: 0_providers_healthy_in_combo
      action: surface_to_owner_via_ntfy_and_email
      cooldown_seconds: 0       # immediate

    - id: SH-04
      name: kill_fence_engaged
      trigger: kill_switch_env_1
      action: hard_halt_combo_immediately
      cooldown_seconds: 0

    - id: SH-05
      name: rpm_breach
      trigger: free_tier_limit_rpm_exceeded
      action: throttle_to_remaining_rpm_for_window
      cooldown_seconds: 60

    - id: SH-06
      name: desktop_app_unreachable
      trigger: 3_failed_health_probes_to_desktop
      action: failover_to_next_desktop_in_manifest
      cooldown_seconds: 900

