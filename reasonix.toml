allow = ["Bash=cat << 'EOF' > fix_css.py\nimport re\nwith open(\"frontend/customer_dashboard.html\", \"r\", encoding=\"utf-8\") as f:\n    orig = f.read()\n\n# We check out the exact version from d2949ccd~1\nimport subprocess\nsubprocess.run([\"git\", \"checkout\", \"d2949ccd~1\", \"--\", \"frontend/customer_dashboard.html\"])\n\nwith open(\"frontend/customer_dashboard.html\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nclasses = [\".status-card\", \".next-step-card\", \".priority-card\", \".action-card\", \".card\", \".onboard-card\", \".approve-card\"]\nfor cls in classes:\n    text = text.replace(f\"{cls}{{\", f\"{cls}{{transition: transform 0.2s ease, box-shadow 0.2s ease; \")\n    \nif \".btn.primary\" not in text:\n    text = text.replace(\"</style>\", \"  .btn.primary { transition: all 0.2s ease; }\\n  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 15px -5px var(--indigo, rgba(79,70,229, 0.4)); filter: brightness(1.05); }\\n</style>\")\n\nwith open(\"frontend/customer_dashboard.html\", \"w\", encoding=\"utf-8\") as f:\n    f.write(text)\nEOF\npython fix_css.py\ngit diff HEAD frontend/customer_dashboard.html"]
