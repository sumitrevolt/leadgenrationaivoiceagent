# =============================================================================
# Dockerfile.lock — builds the app image from the LIVE-VENV lockfile, not the
# drifted requirements.txt. Installs the EXACT set that already runs in prod
# (requirements.lock.txt, generated by scripts/vps_freeze.sh) with --no-deps,
# so pip does NO resolution -> zero dependency conflicts. Base = py3.12 to match
# the live venv (Python 3.12.3).
#
# Build context MUST contain requirements.lock.txt (run scripts/vps_freeze.sh on
# the VPS first; for CI, commit the lockfile).
# =============================================================================
FROM python:3.12-slim AS builder
WORKDIR /build
RUN apt-get update && apt-get install -y --no-install-recommends \
    build-essential gcc libffi-dev libssl-dev \
    && rm -rf /var/lib/apt/lists/*
COPY requirements.lock.txt .
# Drop browser-only packages (no Playwright/Selenium in the server image).
RUN grep -v -E "^(playwright|selenium)" requirements.lock.txt > req.filtered || cp requirements.lock.txt req.filtered
RUN python -m venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"
ENV PIP_DEFAULT_TIMEOUT=60
RUN pip install --no-cache-dir --retries 10 --upgrade pip wheel setuptools && \
    pip install --no-cache-dir --retries 10 --no-deps -r req.filtered
# Silero VAD (turn-taking, USE_SILERO_VAD=1) — torch CPU-only wheels (CUDA
# wheel ~2.5GB hota, CPU ~200MB). silero-vad ka model wheel ke ANDAR bundled
# hai = zero runtime download (2026-06-12 model-bake lesson). Fail = non-fatal
# (turn_detector graceful RMS fallback).
RUN (pip install --no-cache-dir --retries 10 torch torchaudio --index-url https://download.pytorch.org/whl/cpu \
    && pip install --no-cache-dir --retries 10 silero-vad) \
    || echo "WARN: silero-vad install failed — RMS fallback"
# Smart Turn v3.2 (USE_SMART_TURN=1) — pipecat bundles ONNX; bake at build so
# runtime download never blocks the voice event loop. Fail = non-fatal (RMS fallback).
RUN (pip install --no-cache-dir --retries 10 "pipecat-ai>=0.0.60" \
    && python -c "from pipecat.audio.turn.smart_turn.local_smart_turn_v3 import LocalSmartTurnAnalyzerV3; LocalSmartTurnAnalyzerV3()") \
    || echo "WARN: pipecat/smart-turn bake failed — silence-timer fallback"
# Kokoro TTS (USE_KOKORO_TTS=1) — self-hosted EdgeTTS FAILOVER. Bake the 82M model
# at build (verify with 'a' = no espeak needed in builder) so runtime never
# downloads; Hindi g2p uses espeak-ng (added to the production apt below). Fail =
# non-fatal → app/voice_agent/kokoro_tts available()=False, EdgeTTS stays primary.
# GOTCHA (2026-06-19): silero/torch above upgrades numpy to 2.x while lockfile
# pandas/sklearn were installed --no-deps against 1.26.3 → kokoro→transformers→sklearn→pandas ABI crash.
# Fix: after kokoro, force-reinstall numpy+pandas+scipy+sklearn from lock versions together.
RUN (pip install --no-cache-dir --retries 10 kokoro soundfile \
    && pip install --no-cache-dir --force-reinstall \
         "numpy==1.26.3" "pandas==2.2.0" "scipy==1.16.3" "scikit-learn==1.9.0" \
    && python -c "from kokoro import KPipeline; KPipeline(lang_code='a')") \
    || echo "WARN: kokoro bake failed — EdgeTTS-only (USE_KOKORO_TTS inert)"
# rembg (Studio Media img-bgremove, background removal). onnxruntime ALREADY in
# lock (the heavy ~200MB piece), so this just adds the wrapper + u2net model.
# Model baked INTO the venv (U2NET_HOME=/opt/venv/u2net) so the COPY /opt/venv
# carries it → ZERO runtime download (same bake lesson as fastembed/kokoro). After
# rembg (pulls scipy/scikit-image) re-pin ABI-critical pkgs to lock versions
# (numpy ABI gotcha above). Fail = non-fatal → bg_remove.available()=False,
# img-bgremove stays graceful-inert (never 500).
ENV U2NET_HOME=/opt/venv/u2net
RUN (pip install --no-cache-dir --retries 10 "rembg>=2.0.50,<2.1" "onnxruntime==1.26.0" \
    && pip install --no-cache-dir --force-reinstall \
         "numpy==1.26.3" "pandas==2.2.0" "scipy==1.16.3" "scikit-learn==1.9.0" \
    && python -c "from rembg import new_session; new_session('u2net')") \
    || echo "WARN: rembg bake failed — img-bgremove stays inert"

FROM python:3.12-slim AS production
ARG APP_VERSION=latest
ENV APP_VERSION=${APP_VERSION}
RUN groupadd -r appgroup && useradd -r -g appgroup appuser
RUN apt-get update && apt-get install -y --no-install-recommends \
    ffmpeg libsndfile1 espeak-ng curl ca-certificates tzdata \
    && rm -rf /var/lib/apt/lists/* && apt-get clean
ENV TZ=Asia/Kolkata
RUN ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
COPY --from=builder /opt/venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"
# rembg u2net model lives inside the venv (baked above) — point runtime at it so
# background removal never downloads at request time.
ENV U2NET_HOME=/opt/venv/u2net
WORKDIR /app
RUN mkdir -p /app/logs /app/data
COPY --chown=appuser:appgroup app/ ./app/
COPY --chown=appuser:appgroup alembic/ ./alembic/
COPY --chown=appuser:appgroup alembic.ini ./
COPY --chown=appuser:appgroup scripts/ ./scripts/
COPY --chown=appuser:appgroup frontend/ ./frontend/
COPY --chown=appuser:appgroup data/ ./data/
# Project skills — skill_pack inhe VPS agents ko runtime pe serve karta hai
COPY --chown=appuser:appgroup .claude/skills/ ./.claude/skills/
COPY --chown=appuser:appgroup .agents/skills/ ./.agents/skills/
RUN chown -R appuser:appgroup /app
# Embedding model BAKE (2026-06-12 prod-down lesson): cache missing hone par
# fastembed runtime me HuggingFace se download karta hai -> event-loop hang ->
# poora prod down. Build-time download + fixed cache path = kabhi runtime
# download nahi. Bake fail ho to image phir bhi banti hai (keyword fallback).
ENV FASTEMBED_CACHE_PATH=/opt/fastembed_cache
RUN (python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2')" \
    && chmod -R a+rX /opt/fastembed_cache) \
    || echo "WARN: fastembed model bake failed — runtime keyword fallback"
# Hinglish STT BAKE (free self-host Sarvam-Saaras alternative, HINGLISH_STT=1):
# open Whisper-Hindi2Hinglish -> CTranslate2 int8 so the EXISTING faster-whisper
# runtime loads it as a strong LOCAL fallback with ROMAN Hinglish output. Build-
# time convert = zero runtime download (same lesson as fastembed/silero). torch +
# transformers + ctranslate2 already in the venv (silero/kokoro bakes). Skip with
# --build-arg BAKE_HINGLISH_STT=0. Fail = non-fatal (whisper-base stays fallback).
ARG BAKE_HINGLISH_STT=1
ENV HINGLISH_WHISPER_DIR=/opt/hinglish_whisper
RUN if [ "${BAKE_HINGLISH_STT}" = "1" ]; then \
        (sh scripts/build_hinglish_stt.sh && echo "[hinglish-stt] baked") \
        || echo "WARN: hinglish STT bake failed — whisper-base fallback"; \
    else echo "[hinglish-stt] bake skipped (BAKE_HINGLISH_STT=${BAKE_HINGLISH_STT})"; fi
USER appuser
ENV PYTHONUNBUFFERED=1 \
    PYTHONDONTWRITEBYTECODE=1 \
    PYTHONPATH=/app \
    PORT=8080 \
    WEB_CONCURRENCY=2 \
    GRACEFUL_TIMEOUT=30
HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
    CMD curl -f http://localhost:${PORT}/health || exit 1
EXPOSE 8080
# --proxy-headers + --forwarded-allow-ips='*': app Caddy ke peeche hai (container
# port sirf 127.0.0.1 pe bound — sirf local Caddy pahunchta, isliye '*' safe).
# Bina iske request.client.host = Docker gateway (sab clients ek hi IP) → global
# rate-limit poori site ko ek bucket me throttle karta. Yeh flag se real client IP
# (X-Forwarded-For) resolve hota — per-IP limiting + sahi access logs.
CMD ["sh", "-c", "python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080} --workers ${WEB_CONCURRENCY:-2} --timeout-keep-alive 30 --proxy-headers --forwarded-allow-ips='*'"]
