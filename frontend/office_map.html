<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#4f46e5">
<title>LeadGen AI — Virtual Office</title>
<link rel="stylesheet" href="/design-system/styles.css" />
<!-- Vendored (not CDN) — phaser@3.80.1, MIT license, served from frontend/design-system/
     (/design-system mount), same pattern as sigma/graphology/elkjs in control_center_graph.html.
     Avoids a third-party CDN runtime dependency for a core admin page. -->
<script src="/design-system/vendor/phaser.min.js"></script>
<style>
  :root{
    --brand:#6d28d9; --brand-2:#4f46e5; --brand-soft:#ede9fe;
    --ink:#1e1b2e; --muted:#6b7280; --line:#e9e7f2; --bg:#f6f5fb; --card:#ffffff;
    --ok:#10b981; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px}
  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;text-decoration:none;color:var(--ink)}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#a78bfa,#6366f1);
    display:grid;place-items:center;font-size:16px;color:#fff}
  .back{font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:600}
  .spacer{flex:1}
  #banner{display:none;max-width:1200px;margin:10px auto 0;padding:0 16px}
  #banner .b{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;
    padding:8px 14px;font-size:12.5px;font-weight:600}
  #wrap{max-width:1200px;margin:16px auto;padding:0 16px}
  #stage{width:100%;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(24,16,55,.06),0 8px 24px rgba(24,16,55,.05)}

  #agentPanel{position:fixed;inset:0;background:rgba(15,17,35,.35);z-index:50;display:flex;
    justify-content:flex-end}
  #agentPanel.panel-hidden{display:none}
  .panel-card{width:340px;max-width:92vw;height:100%;background:#fff;box-shadow:-8px 0 30px rgba(24,16,55,.18);
    padding:18px;overflow-y:auto;position:relative}
  .panel-card #panelClose{position:absolute;top:12px;right:12px;border:none;background:var(--bg);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px}
  .panel-title{font-size:17px;font-weight:800;margin:4px 0 2px;padding-right:34px}
  .panel-sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .panel-stats{display:flex;gap:8px;margin:10px 0}
  .panel-stat{background:var(--bg);border-radius:9px;padding:8px 10px;font-size:11.5px;color:var(--muted);flex:1}
  .panel-stat b{display:block;font-size:16px;color:var(--ink)}
  .panel-events{margin-top:14px;font-size:12.5px}
  .panel-event{border-left:3px solid var(--brand-2);padding:6px 10px;margin-bottom:6px;background:var(--bg);border-radius:0 8px 8px 0}
  .panel-event .pe-when{color:var(--muted);font-size:10.5px}

  #ticker{max-width:1200px;margin:14px auto 0;padding:0 16px}
  .ticker-card{background:#111827;color:#e5e7eb;border-radius:12px;padding:10px 14px;
    max-height:172px;overflow:hidden}
  .ticker-head{display:flex;align-items:center;gap:7px;font-weight:700;margin-bottom:6px;
    color:#f9fafb;font-size:12.5px}
  .ticker-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:tickerPulse 1.4s infinite}
  @keyframes tickerPulse{0%,100%{opacity:1}50%{opacity:.3}}
  .ticker-row{display:flex;gap:9px;padding:3.5px 0;border-bottom:1px solid rgba(255,255,255,.07);
    font-size:12px;animation:tickerIn .3s ease-out}
  .ticker-row:last-child{border-bottom:none}
  .ticker-time{flex:0 0 auto;color:#9ca3af;font-variant-numeric:tabular-nums;width:78px}
  .ticker-who{flex:0 0 auto;font-weight:700;color:#c4b5fd;max-width:130px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .ticker-what{color:#e5e7eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  @keyframes tickerIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/app/admin"><span class="logo">🏢</span> Virtual Office</a>
    <a class="back" href="/app/team">AI Staff Team (list view) →</a>
    <div class="spacer"></div>
  </div>
  <div id="banner"><div class="b" id="bannerMsg"></div></div>
  <div id="wrap"><div id="stage"></div></div>
  <div id="ticker">
    <div class="ticker-card">
      <div class="ticker-head"><span class="ticker-dot"></span> Live automation — poora project ka feed (har agent ka kaam yahan aata hai)</div>
      <div id="tickerList"></div>
    </div>
  </div>
  <div id="agentPanel" class="panel-hidden">
    <div class="panel-card">
      <button id="panelClose" aria-label="Close">✕</button>
      <div id="panelBody">Loading…</div>
    </div>
  </div>
<script>
  var OFFICE = {};

  // ---- Auth (same localStorage key as every other admin page) -------------
  function token(){ return localStorage.getItem("accessToken") || ""; }
  function hdrs(){
    var h = {};
    var t = token();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }
  function showBanner(msg){
    document.getElementById("bannerMsg").textContent = msg;
    document.getElementById("banner").style.display = "block";
  }
  function hideBanner(){ document.getElementById("banner").style.display = "none"; }

  OFFICE.fetchTeam = async function(){
    try {
      var r = await fetch("/api/platform/team", { headers: hdrs() });
      if (!r.ok) throw new Error("HTTP " + r.status);
      var data = await r.json();
      hideBanner();
      return data;
    } catch (e) {
      showBanner("Office data load nahi ho paya — retry karega automatically (25s me)");
      return null;
    }
  };

  // ---- Live project-wide automation feed (no `member` filter = every agent,
  // every automation job across the whole project — not just the 31 STAFF's
  // idle/working status). Drives the ticker + per-avatar speech bubbles +
  // the coordinator workflow-token animation below.
  OFFICE.fetchEvents = async function(limit){
    try {
      var r = await fetch("/api/platform/team/events?limit=" + (limit || 20), { headers: hdrs() });
      if (!r.ok) throw new Error("HTTP " + r.status);
      var d = await r.json();
      return (d && d.events) || [];
    } catch (e) {
      return [];
    }
  };

  // ---- Room layout (2x2-ish: Coordinator strip on top, 3 rooms below) -----
  // floor/rug reference real Kenney "Roguelike/RPG Pack" tiles (CC0) — see
  // office-sprites/CREDITS.txt. rug keeps each room's original identity color.
  OFFICE.ROOMS = [
    { id: "coordinator", label: "🧑‍💼 Coordinator Room", x: 0,   y: 0,   w: 1200, h: 130, stroke: 0x8b5cf6, floor: "floor_stone_cream", rug: "rug_purple" },
    { id: "voice",       label: "📞 Voice Team",              x: 0,   y: 130, w: 400,  h: 690, stroke: 0x3b82f6, floor: "floor_stone_grey",  rug: "rug_cyan" },
    { id: "marketing",   label: "📣 Marketing Team",          x: 400, y: 130, w: 400,  h: 690, stroke: 0xec4899, floor: "floor_stone_grey",  rug: "rug_orange" },
    { id: "platform",    label: "🛠️ Platform / Engineering",  x: 800, y: 130, w: 400,  h: 690, stroke: 0x10b981, floor: "floor_stone_grey",  rug: "rug_teal" }
  ];

  OFFICE.roomForMember = function(m){
    if (m.key === "manager") return "coordinator";
    if (m.product === "voice") return "voice";
    if (m.product === "marketing") return "marketing";
    return "platform";
  };

  // Shared scale for every furniture/floor/character tile (native 16x16px) so
  // desks, rugs and avatars all read as the same art scale.
  OFFICE.TILE_SCALE = 2.4;

  OFFICE.drawRooms = function(){
    var scene = OFFICE.scene;
    var s = OFFICE.TILE_SCALE;
    OFFICE.ROOMS.forEach(function(room){
      var ix = room.x + 6, iy = room.y + 6, iw = room.w - 12, ih = room.h - 12;
      // Real tiled floor texture (not a flat color fill).
      scene.add.tileSprite(ix, iy, iw, ih, room.floor).setOrigin(0, 0).setTileScale(s, s);
      // Colored rug band under the room label — carries each room's identity color.
      var rugH = Math.min(34, ih * 0.22);
      scene.add.tileSprite(ix, iy, iw, rugH, room.rug).setOrigin(0, 0).setTileScale(s, s).setAlpha(0.5);
      // Wall border (square corners to match the tile grid, not a rounded rect).
      var border = scene.add.graphics();
      border.lineStyle(4, room.stroke, 1);
      border.strokeRect(ix, iy, iw, ih);
      scene.add.text(room.x + 20, room.y + 16, room.label, {
        fontSize: "16px", fontFamily: "sans-serif", fontStyle: "bold", color: "#1e1b2e"
      }).setShadow(0, 1, "#ffffff", 2, false, true);
      OFFICE.drawRoomDecor(room, ix, iy, iw, ih);
    });
  };

  // A few static furniture pieces per room (plant + wall painting) so rooms
  // read as furnished spaces, not empty colored boxes — placed in the corners
  // so they never collide with the avatar/desk grid computed by layoutSlots().
  OFFICE.drawRoomDecor = function(room, ix, iy, iw, ih){
    var scene = OFFICE.scene;
    scene.add.image(ix + iw - 20, iy + 22, "painting").setScale(OFFICE.TILE_SCALE * 0.9);
    scene.add.image(ix + 16, iy + ih - 16, "plant").setScale(OFFICE.TILE_SCALE * 0.9);
  };

  // ---- Staff avatars: real pixel-art character sprites -----------------------
  // Kenney "RPG Urban Pack" (CC0, public domain) — 10 distinct character tiles,
  // vendored at frontend/design-system/vendor/office-sprites/ (see CREDITS.txt).
  // 31 staff cycle deterministically across these 10 looks (same person always
  // gets the same look, but looks repeat — this is a real-asset compromise, not
  // 31 unique custom sprites).
  OFFICE.CHAR_COUNT = 10;
  OFFICE.STATE_COLOR = { working: 0x10b981, active: 0xf59e0b, offline: 0x94a3b8 };
  OFFICE.avatars = {};

  OFFICE.charKeyFor = function(memberKey){
    var h = 0;
    for (var i = 0; i < memberKey.length; i++) h = (h * 31 + memberKey.charCodeAt(i)) >>> 0;
    return "char" + ((h % OFFICE.CHAR_COUNT) + 1);
  };

  // Deterministic grid slots inside a room — scales to any member count so a
  // 32nd STAFF entry later needs zero layout-code changes.
  OFFICE.layoutSlots = function(room, count){
    var padX = 24, padTop = 56, padBottom = 20;
    var usableW = room.w - padX * 2;
    var usableH = room.h - padTop - padBottom;
    var cols = Math.max(1, Math.min(count, Math.floor(usableW / 72)));
    var rows = Math.max(1, Math.ceil(count / cols));
    var pitchX = usableW / cols;
    var pitchY = Math.min(90, usableH / rows);
    var slots = [];
    for (var i = 0; i < count; i++){
      var r = Math.floor(i / cols), c = i % cols;
      slots.push({
        x: room.x + padX + pitchX * c + pitchX / 2,
        y: room.y + padTop + pitchY * r + pitchY / 2
      });
    }
    return slots;
  };

  OFFICE.drawAvatar = function(m, slot){
    var scene = OFFICE.scene;
    var color = OFFICE.STATE_COLOR[m.state] || OFFICE.STATE_COLOR.offline;
    var s = OFFICE.TILE_SCALE;
    // Desk stays fixed — real Kenney furniture tile (Roguelike/RPG Pack, CC0),
    // not a flat procedural rectangle.
    var desk = scene.add.image(slot.x, slot.y + 15, "desk_1").setScale(s);
    // Character + badge + label ride together in a container so idle "wander"
    // (scheduleWander below) moves all three as one unit, while the desk stays
    // anchored — local coords below are relative to the container's origin.
    var sprite = scene.add.image(0, -4, OFFICE.charKeyFor(m.key)).setScale(s);
    sprite.setInteractive({ useHandCursor: true });
    sprite.on("pointerdown", function(){ OFFICE.openAgentPanel(m.key); }); // Task 4 defines this
    // Status-color badge (small dot, bottom-right of sprite) instead of a full ring.
    var badge = scene.add.circle(14, 6, 6, color).setStrokeStyle(2, 0xffffff);
    var label = scene.add.text(0, 34, m.name, {
      fontSize: "11px", fontFamily: "sans-serif", color: "#1e293b"
    }).setOrigin(0.5, 0);
    var group = scene.add.container(slot.x, slot.y, [sprite, badge, label]);
    var av = {
      desk: desk, sprite: sprite, badge: badge, label: label, group: group,
      homeX: slot.x, homeY: slot.y, wandering: false
    };
    OFFICE.scheduleWander(m.key);
    return av;
  };

  // ---- Idle "walk around the desk" wander. Per the original design decision,
  // this is a position-tween (not a real walk-cycle — these sprites only have
  // one static pose each) so it reads as gentle movement without needing
  // per-character animation frames for all 31 staff.
  OFFICE.scheduleWander = function(key){
    setTimeout(function(){
      var av = OFFICE.avatars[key];
      if (!av || !OFFICE.scene) return;
      OFFICE.wanderOnce(av);
      OFFICE.scheduleWander(key);
    }, 4000 + Math.random() * 10000);
  };

  OFFICE.wanderOnce = function(av){
    // Guard against two overlapping tweens ever fighting over av.group's
    // x/y (would otherwise risk compounding drift away from the desk).
    if (av.wandering) return;
    av.wandering = true;
    var scene = OFFICE.scene;
    var dx = (Math.random() - 0.5) * 44;
    var dy = (Math.random() - 0.5) * 26;
    av.sprite.setFlipX(dx < 0);
    scene.tweens.add({
      targets: av.group,
      x: av.homeX + dx, y: av.homeY + dy,
      duration: 850 + Math.random() * 350,
      ease: "Sine.easeInOut",
      yoyo: true,
      hold: 700 + Math.random() * 900,
      onYoyo: function(){ av.sprite.setFlipX(dx >= 0); },
      onComplete: function(){
        av.sprite.setFlipX(false);
        av.group.setPosition(av.homeX, av.homeY); // snap-correct any float drift
        av.wandering = false;
      }
    });
  };

  // ---- Ticker: readable HTML feed of every recent automation event ---------
  OFFICE.renderTicker = function(events){
    var list = document.getElementById("tickerList");
    if (!list) return;
    var top = events.slice(0, 8);
    list.innerHTML = top.map(function(e){
      return '<div class="ticker-row">' +
        '<div class="ticker-time">' + esc(relTime(e.at)) + '</div>' +
        '<div class="ticker-who">' + esc(e.emoji || "🤖") + ' ' + esc(e.name || e.member) + '</div>' +
        '<div class="ticker-what">' + esc(e.detail || e.action) + '</div>' +
      '</div>';
    }).join("") || '<div class="ticker-row"><div class="ticker-what">Abhi koi activity nahi record hui.</div></div>';
  };

  // ---- Speech bubble: transient in-canvas text above an avatar on a fresh event.
  // Anchored to the avatar's home desk position (not live sprite position) since
  // the character may be mid-wander (see scheduleWander below) — home is stable
  // and visually close enough for a bubble that only lives a few seconds.
  OFFICE.spawnBubble = function(memberKey, text){
    var av = OFFICE.avatars[memberKey];
    if (!av || !OFFICE.scene) return;
    var scene = OFFICE.scene;
    var short = String(text || "").slice(0, 36);
    var t = scene.add.text(av.homeX, av.homeY - 30, short, {
      fontSize: "10px", fontFamily: "sans-serif", color: "#1e1b2e",
      backgroundColor: "#ffffff", padding: { x: 6, y: 3 }
    }).setOrigin(0.5, 1).setDepth(50);
    scene.tweens.add({
      targets: t, alpha: 0, y: t.y - 14, duration: 1200, delay: 4200,
      onComplete: function(){ t.destroy(); }
    });
  };

  // ---- Workflow token: coordinator.py attributes coordinated_step/fanout_step/
  // hier_step/adv_step/av_contrib events under the ACTUAL delegated staff key
  // (not "manager") — so seeing one of these fire for member X means the
  // Coordinator genuinely just dispatched work to X. Animate a token traveling
  // Coordinator -> X to make that real dispatch visible, not just implied.
  OFFICE.COORD_ACTIONS = { coordinated_step: 1, fanout_step: 1, hier_step: 1, adv_step: 1, av_contrib: 1 };

  OFFICE.spawnWorkflowToken = function(fromKey, toKey){
    var from = OFFICE.avatars[fromKey], to = OFFICE.avatars[toKey];
    if (!from || !to || !OFFICE.scene) return;
    var scene = OFFICE.scene;
    var dot = scene.add.circle(from.homeX, from.homeY - 20, 6, 0xfbbf24).setStrokeStyle(2, 0x92400e).setDepth(60);
    var pulse = scene.add.circle(from.homeX, from.homeY - 20, 10, 0xfbbf24, 0.35).setDepth(59);
    scene.tweens.add({ targets: pulse, radius: 20, alpha: 0, duration: 500, onComplete: function(){ pulse.destroy(); } });
    scene.tweens.add({
      targets: dot,
      x: to.homeX, y: to.homeY - 20,
      duration: 900, ease: "Cubic.easeInOut",
      onComplete: function(){
        var ring = scene.add.circle(to.homeX, to.homeY - 20, 8, 0xfbbf24, 0.4).setDepth(59);
        scene.tweens.add({ targets: ring, radius: 18, alpha: 0, duration: 450, onComplete: function(){ ring.destroy(); } });
        dot.destroy();
      }
    });
  };

  // First poll only seeds the seen-set + fills the ticker — doesn't replay
  // history as if it just happened (same seed-then-diff pattern events.py
  // already uses for its own SSE poll-fallback).
  OFFICE.seenEventIds = {};
  OFFICE.eventsSeeded = false;

  OFFICE.pollEvents = async function(){
    var events = await OFFICE.fetchEvents(20);
    OFFICE.renderTicker(events);
    if (!OFFICE.eventsSeeded){
      events.forEach(function(e){ OFFICE.seenEventIds[e.id] = true; });
      OFFICE.eventsSeeded = true;
      return;
    }
    var fresh = events.filter(function(e){ return !OFFICE.seenEventIds[e.id]; });
    fresh.slice().reverse().forEach(function(e){ // oldest-first = feels sequential, not all-at-once
      OFFICE.seenEventIds[e.id] = true;
      OFFICE.spawnBubble(e.member, e.detail || e.action);
      if (OFFICE.COORD_ACTIONS[e.action] && e.member !== "manager") {
        OFFICE.spawnWorkflowToken("manager", e.member);
      }
    });
  };

  OFFICE.renderMembers = function(data){
    if (!data || !data.members) return;
    var byRoom = {};
    OFFICE.ROOMS.forEach(function(r){ byRoom[r.id] = []; });
    data.members.forEach(function(m){ byRoom[OFFICE.roomForMember(m)].push(m); });
    OFFICE.ROOMS.forEach(function(room){
      var members = byRoom[room.id];
      var slots = OFFICE.layoutSlots(room, members.length);
      members.forEach(function(m, i){
        var existing = OFFICE.avatars[m.key];
        if (existing) {
          // Refresh path: just update the status-badge color, don't redraw.
          existing.badge.setFillStyle(OFFICE.STATE_COLOR[m.state] || OFFICE.STATE_COLOR.offline);
        } else {
          OFFICE.avatars[m.key] = OFFICE.drawAvatar(m, slots[i]);
        }
      });
    });
  };

  // ---- Click-to-expand agent panel ------------------------------------------
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function relTime(iso){
    if (!iso) return "";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var s = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (s < 60) return "abhi";
    if (s < 3600) return Math.floor(s / 60) + " min pehle";
    if (s < 86400) return Math.floor(s / 3600) + " ghante pehle";
    return Math.floor(s / 86400) + " din pehle";
  }

  OFFICE.lastData = null;

  OFFICE.openAgentPanel = async function(key){
    var panel = document.getElementById("agentPanel");
    var body = document.getElementById("panelBody");
    panel.classList.remove("panel-hidden");
    body.innerHTML = "Loading…";
    var member = (OFFICE.lastData && OFFICE.lastData.members || []).filter(function(m){ return m.key === key; })[0];
    var eventsHtml = "";
    try {
      var r = await fetch("/api/platform/team/events?member=" + encodeURIComponent(key) + "&limit=8", { headers: hdrs() });
      var d = r.ok ? await r.json() : { events: [] };
      eventsHtml = (d.events || []).map(function(e){
        return '<div class="panel-event"><div>' + esc(e.detail || e.action) + '</div>' +
          '<div class="pe-when">' + esc(e.action) + ' · ' + relTime(e.at) + '</div></div>';
      }).join("") || '<div class="pe-when">Koi recent activity nahi mili.</div>';
    } catch (e) {
      eventsHtml = '<div class="pe-when">Events load nahi ho paye.</div>';
    }
    if (!member) { body.innerHTML = "Agent nahi mila."; return; }
    body.innerHTML =
      '<div class="panel-title">' + esc(member.emoji) + ' ' + esc(member.name) + '</div>' +
      '<div class="panel-sub">' + esc(member.title) + '</div>' +
      '<div class="panel-sub">' + esc(member.duties) + '</div>' +
      '<div class="panel-stats">' +
        '<div class="panel-stat">State<br><b>' + esc(member.state) + '</b></div>' +
        '<div class="panel-stat">Aaj actions<br><b>' + esc(member.today_actions) + '</b></div>' +
        '<div class="panel-stat">Aaj errors<br><b>' + esc(member.today_errors) + '</b></div>' +
      '</div>' +
      '<div class="panel-events">' + eventsHtml + '</div>';
  };

  document.getElementById("panelClose").onclick = function(){
    document.getElementById("agentPanel").classList.add("panel-hidden");
  };

  OFFICE.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: "stage",
    width: 1200,
    height: 820,
    backgroundColor: "#f6f5fb",
    pixelArt: true,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: {
      preload: function(){
        for (var i = 1; i <= OFFICE.CHAR_COUNT; i++){
          var n = i < 10 ? "0" + i : "" + i;
          this.load.image("char" + i, "/design-system/vendor/office-sprites/char_" + n + ".png");
        }
        // Room/furniture tiles — Kenney "Roguelike/RPG Pack" (CC0), see CREDITS.txt.
        ["floor_stone_grey", "floor_stone_cream", "rug_teal", "rug_orange", "rug_purple",
         "rug_cyan", "desk_1", "desk_2", "desk_corner", "chair", "bookshelf", "cabinet",
         "plant", "plant_flower", "painting", "door_arch"].forEach(function(name){
          this.load.image(name, "/design-system/vendor/office-sprites/" + name + ".png");
        }, this);
      },
      create: function(){
        OFFICE.scene = this;
        OFFICE.drawRooms();
        OFFICE.fetchTeam().then(function(data){
          OFFICE.lastData = data;
          OFFICE.renderMembers(data);
          OFFICE.pollEvents(); // avatars must exist first (bubbles/tokens anchor to them)
        });
      }
    }
  });

  setInterval(function(){
    OFFICE.fetchTeam().then(function(data){
      if (!data) return; // fetchTeam already showed the error banner
      OFFICE.lastData = data;
      OFFICE.renderMembers(data);
    });
  }, 25000);

  // Faster cadence than the roster poll — roster composition rarely changes,
  // but "what's happening right now" (the whole point of this ask) should feel live.
  setInterval(function(){ OFFICE.pollEvents(); }, 8000);
</script>
</body>
</html>
