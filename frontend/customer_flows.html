<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadGen AI — My Automations</title>
<link rel="stylesheet" href="/design-system/styles.css" />
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0b0b0d;color:#e2e8f0;font-size:14px}
  .wrap{max-width:880px;margin:0 auto;padding:20px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:#94a3b8;font-size:12px;margin-bottom:18px}
  .card{background:#161618;border:1px solid #26262b;border-radius:10px;padding:16px;margin-bottom:16px}
  .hdr{font-size:13px;font-weight:600;color:#cbd5e1;margin-bottom:10px;border-bottom:1px solid #26262b;padding-bottom:6px}
  input,select{background:#0d0d0f;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:13px;width:100%;margin-bottom:8px}
  .row{display:flex;gap:8px;align-items:center}
  .row select,.row input{margin-bottom:0}
  button{background:#1a2a42;border:1px solid #2563eb;color:#60a5fa;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
  button:hover{background:#22365a} button.ghost{background:#161618;border-color:#2d3748;color:#94a3b8}
  button.danger{border-color:#7f1d1d;color:#f87171;background:#1a1010}
  .step{display:flex;align-items:center;gap:8px;background:#0d0d0f;border:1px solid #26262b;border-radius:6px;padding:8px 10px;margin-bottom:6px}
  .step .n{color:#475569;font-size:11px;width:18px}
  .step .x{margin-left:auto;color:#f87171;cursor:pointer}
  .flowrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #26262b;border-radius:6px;margin-bottom:6px;cursor:pointer}
  .flowrow:hover{border-color:#2563eb}
  .muted{color:#64748b;font-size:12px} .ok{color:#4ade80} .err{color:#f87171} .warn{color:#fbbf24}
  .pill{font-size:10px;padding:1px 6px;border-radius:10px;background:#1a2a42;color:#60a5fa}
  a{color:#60a5fa}
</style>
</head>
<body>
<div style="background:linear-gradient(135deg,#080c18,#0d1629);padding:10px 18px;display:flex;align-items:center;border-bottom:1px solid rgba(99,120,199,.15)"><a href="/app/admin" style="font-weight:700;font-size:14px;color:#e2e8f0;text-decoration:none">LeadGen AI</a><div style="flex:1"></div><span class="ao-topbar-status"><span class="dot"></span>AI Active</span></div>
<div class="wrap">
  <h1>⚙️ My Automations</h1>
  <div class="sub">Apne draft-automations banao — content, posts, blog, brand-pulse, reviews, reports. Sab <b>draft-only</b> (kuch auto-send nahi). Human-approval step laga sakte ho.</div>
  <div id="authmsg" class="card" style="display:none"></div>

  <div class="card" id="builder">
    <div class="hdr">Build a flow</div>
    <input id="flowName" placeholder="Flow name (e.g. Weekly content + blog)">
    <div id="steps"></div>
    <div class="row" style="margin-top:8px">
      <select id="addAction">
        <option value="content_pack">📦 Content Pack (niche posts)</option>
        <option value="social_drafts">📝 Social Drafts</option>
        <option value="seo_blog_draft">📰 SEO Blog Draft</option>
        <option value="brand_pulse">📡 Brand Pulse (mentions)</option>
        <option value="review_scan">⭐ Review Scan</option>
        <option value="client_report_draft">📊 Client Report (draft)</option>
        <option value="__break">✋ Human Approval</option>
      </select>
      <button class="ghost" onclick="addStep()">+ Add step</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button onclick="saveFlow()">💾 Save</button>
      <button onclick="runFlow()">▶ Run</button>
      <button class="ghost" onclick="newFlow()">＋ New</button>
      <span id="status" class="muted" style="margin-left:6px"></span>
    </div>
  </div>

  <div class="card" id="tplcard">
    <div class="hdr">✨ Starter Templates — ek click me ready flow</div>
    <div id="templates"><span class="muted">loading…</span></div>
  </div>

  <div class="card">
    <div class="hdr">My flows</div>
    <div id="flows"><span class="muted">loading…</span></div>
  </div>

  <div class="card" id="runcard" style="display:none">
    <div class="hdr">Run status</div>
    <div id="runstate" class="muted"></div>
  </div>
</div>

<script>
const TOKEN = localStorage.getItem("lgai_token") || "";
const H = {"Content-Type":"application/json", "Authorization":"Bearer "+TOKEN};
let cur = {id:null, name:"", steps:[]};   // steps: [{action} | {kind:'breakpoint'}]
let runId = null, poll = null;

const LABELS = {content_pack:"Content Pack", social_drafts:"Social Drafts", seo_blog_draft:"SEO Blog Draft",
  brand_pulse:"Brand Pulse", review_scan:"Review Scan", client_report_draft:"Client Report", __break:"Human Approval"};

function setStatus(m, cls){ const e=document.getElementById('status'); e.className=(cls||'muted'); e.textContent=m; }

if(!TOKEN){
  document.getElementById('authmsg').style.display='block';
  document.getElementById('authmsg').innerHTML='Pehle <a href="/app/customer">portal me login</a> karo — fir yahan apne automations banao.';
}

function renderSteps(){
  const el=document.getElementById('steps');
  if(!cur.steps.length){ el.innerHTML='<div class="muted">Koi step nahi — niche se add karo.</div>'; return; }
  el.innerHTML = cur.steps.map((s,i)=>{
    const lbl = s.kind==='breakpoint' ? '✋ Human Approval' : (LABELS[s.action]||s.action);
    return `<div class="step"><span class="n">${i+1}</span> ${lbl}<span class="x" onclick="rmStep(${i})">×</span></div>`;
  }).join('');
}
function addStep(){
  const v=document.getElementById('addAction').value;
  cur.steps.push(v==='__break' ? {kind:'breakpoint'} : {action:v});
  renderSteps();
}
function rmStep(i){ cur.steps.splice(i,1); renderSteps(); }
function newFlow(){ cur={id:null,name:"",steps:[]}; document.getElementById('flowName').value=""; renderSteps(); setStatus(""); }

function _payload(){
  const nodes=[], edges=[];
  cur.steps.forEach((s,i)=>{
    const id='n'+i;
    if(s.kind==='breakpoint') nodes.push({id, kind:'breakpoint', question:'Approve to continue?'});
    else nodes.push({id, action:s.action, title:LABELS[s.action]||s.action});
    if(i>0) edges.push({f:'n'+(i-1), t:id});
  });
  return {id:cur.id||undefined, name:document.getElementById('flowName').value||'Untitled', nodes, edges};
}

async function api(path, opts){
  try{ const r=await fetch(path, Object.assign({headers:H}, opts||{})); return {status:r.status, body:await r.json().catch(()=>null)}; }
  catch(e){ return {status:0, body:null}; }
}

async function saveFlow(){
  if(!cur.steps.length){ setStatus('add at least one step','warn'); return null; }
  const r=await api('/api/customer/flow',{method:'POST', body:JSON.stringify(_payload())});
  if(r.status===503){ setStatus('feature off — admin se enable karwao','warn'); return null; }
  if(r.status===401){ setStatus('login chahiye','err'); return null; }
  if(r.body && r.body.flow){
    cur.id=r.body.flow.id;
    if(r.body.runnable) setStatus('saved ✓ runnable','ok');
    else setStatus('saved — '+(r.body.compile_errors||[]).join('; '),'err');
    loadFlows();
    return r.body;
  }
  setStatus('save failed','err'); return null;
}

async function runFlow(){
  const saved = cur.id ? {runnable:true} : await saveFlow();
  if(!saved) return;
  if(saved.runnable===false){ setStatus('fix errors pehle','err'); return; }
  const r=await api('/api/customer/flow/'+cur.id+'/run',{method:'POST'});
  if(r.body && r.body.run_id){ runId=r.body.run_id; document.getElementById('runcard').style.display='block'; startPoll(); }
  else setStatus('run failed: '+JSON.stringify(r.body),'err');
}

function startPoll(){
  if(poll) clearInterval(poll);
  poll=setInterval(async ()=>{
    const r=await api('/api/customer/flow/run/'+runId,{method:'GET'});
    const st=(r.body&&r.body.state)||{};
    const rs=document.getElementById('runstate');
    if(st.status==='waiting_approval'){
      rs.innerHTML='⏸ Waiting approval'+(st.waiting?(' @'+st.waiting):'')+' <button onclick="approve()">✓ Approve</button>';
    } else {
      const prog = st.nodes ? (Object.values(st.nodes).filter(x=>['done','skipped'].includes(x.state)).length+'/'+Object.keys(st.nodes).length+' steps') : (st.status||'?');
      rs.textContent='Run: '+(st.status||'?')+' · '+prog;
    }
    if(st.status==='completed'||st.status==='failed'){ clearInterval(poll); poll=null; }
  }, 2500);
}

async function approve(){ await api('/api/customer/flow/run/'+runId+'/approve',{method:'POST',body:JSON.stringify({note:'ok'})}); }

async function loadFlows(){
  const r=await api('/api/customer/flows',{method:'GET'});
  const el=document.getElementById('flows');
  if(r.status===503){ el.innerHTML='<span class="muted">Feature abhi off hai (admin enable karega).</span>'; return; }
  const flows=(r.body&&r.body.flows)||[];
  if(!flows.length){ el.innerHTML='<span class="muted">Abhi koi flow nahi.</span>'; return; }
  el.innerHTML=flows.map(f=>`<div class="flowrow" onclick="openFlow('${f.id}')"><b>${f.name}</b> <span class="pill">${f.nodes} steps</span><span class="x" style="margin-left:auto;color:#f87171" onclick="event.stopPropagation();delFlow('${f.id}')">delete</span></div>`).join('');
}

async function openFlow(id){
  const r=await api('/api/customer/flow/'+id,{method:'GET'});
  if(!(r.body&&r.body.flow)) return;
  const fl=r.body.flow;
  cur={id:fl.id, name:fl.name, steps:(fl.nodes||[]).map(n=>n.kind==='breakpoint'?{kind:'breakpoint'}:{action:n.action})};
  document.getElementById('flowName').value=fl.name||'';
  renderSteps();
  setStatus(r.body.runnable?'loaded ✓':'loaded — '+(r.body.compile_errors||[]).join('; '), r.body.runnable?'ok':'err');
}

async function delFlow(id){
  if(!confirm('Delete this flow?')) return;
  await api('/api/customer/flow/'+id,{method:'DELETE'});
  if(cur.id===id) newFlow();
  loadFlows();
}

async function loadTemplates(){
  const r=await api('/api/customer/flow-templates',{method:'GET'});
  const el=document.getElementById('templates');
  if(r.status===503){ el.innerHTML='<span class="muted">Feature abhi off hai (admin enable karega).</span>'; return; }
  const tpls=(r.body&&r.body.templates)||[];
  if(!tpls.length){ el.innerHTML='<span class="muted">Koi template nahi.</span>'; return; }
  el.innerHTML=tpls.map(t=>`<div class="flowrow" style="cursor:default;align-items:flex-start"><div><b>${t.name}</b> <span class="pill">${t.steps} steps · ${t.trigger}</span><div class="muted" style="margin-top:3px">${t.description}</div><div class="muted" style="font-size:11px;margin-top:2px">niche: ${t.niche_hint}</div></div><button style="margin-left:auto" onclick="useTemplate('${t.tid}')">Use →</button></div>`).join('');
}

async function useTemplate(tid){
  const r=await api('/api/customer/flow-templates/'+tid+'/apply',{method:'POST',body:JSON.stringify({})});
  if(r.status===503){ setStatus('feature off — admin se enable karwao','warn'); return; }
  if(r.status===401){ setStatus('login chahiye','err'); return; }
  if(r.body && r.body.ok && r.body.flow){
    setStatus('template added ✓ — niche edit ya Run karo','ok');
    loadFlows();
    openFlow(r.body.flow.id);
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    setStatus('template apply failed: '+((r.body&&r.body.error)||'?'),'err');
  }
}

renderSteps();
if(TOKEN){ loadFlows(); loadTemplates(); }
</script>
</body>
</html>
