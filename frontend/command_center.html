<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadGen AI — Ops Command Center</title>
  <link rel="stylesheet" href="/design-system/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f1117;
      --bg2: #1a1d27;
      --bg3: #22263a;
      --border: #2e3354;
      --text: #e2e8f0;
      --muted: #8892a4;
      --accent: #6366f1;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #a855f7;
      --teal: #14b8a6;
      --r: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

    /* HEADER */
    .hdr { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .hdr-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    .badge { background: var(--accent); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .hdr-right { display: flex; align-items: center; gap: 16px; }
    .health-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.5} }
    .refresh-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .refresh-btn:hover { background: var(--accent); border-color: var(--accent); }
    .last-update { color: var(--muted); font-size: 12px; }

    /* LAYOUT */
    .page { padding: 20px 24px; max-width: 1600px; margin: 0 auto; }
    .row { display: grid; gap: 16px; margin-bottom: 16px; }
    .kpi-row { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .chart-row-2 { grid-template-columns: 1fr 1fr; }
    .chart-row-3 { grid-template-columns: 2fr 1fr 1fr; }
    .full-row { grid-template-columns: 1fr; }
    @media(max-width:900px){ .chart-row-2,.chart-row-3{ grid-template-columns:1fr; } }

    /* CARD */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
    .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }

    /* KPI CARDS */
    .kpi-val { font-size: 30px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .kpi-sub { font-size: 12px; color: var(--muted); }
    .kpi-delta { font-size: 12px; margin-top: 6px; font-weight: 600; }
    .up { color: var(--green); } .dn { color: var(--red); } .neutral { color: var(--muted); }

    /* CHARTS */
    .chart-wrap { position: relative; height: 220px; }
    .chart-wrap.tall { height: 260px; }

    /* PROGRESS BAR */
    .prog-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
    .prog-bar { height: 8px; background: var(--bg3); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 4px; transition: width .4s; }

    /* TABLE */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; }
    .tbl td { padding: 9px 12px; border-bottom: 1px solid rgba(46,51,84,.5); }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr:hover td { background: var(--bg3); }

    /* PILLS */
    .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .pill-green { background: rgba(34,197,94,.15); color: var(--green); }
    .pill-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
    .pill-red { background: rgba(239,68,68,.15); color: var(--red); }
    .pill-blue { background: rgba(59,130,246,.15); color: var(--blue); }
    .pill-purple { background: rgba(168,85,247,.15); color: var(--purple); }
    .pill-muted { background: var(--bg3); color: var(--muted); }

    /* FLAGS GRID */
    .flags-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .flag-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg3); border-radius: 6px; padding: 8px 12px; font-size: 12px; }
    .flag-on { border-left: 3px solid var(--green); }
    .flag-off { border-left: 3px solid var(--border); opacity: .6; }

    /* FUNNEL */
    .funnel-step { display: flex; align-items: center; margin-bottom: 10px; }
    .funnel-label { width: 140px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .funnel-bar-wrap { flex: 1; height: 26px; background: var(--bg3); border-radius: 4px; overflow: hidden; position: relative; }
    .funnel-bar { height: 100%; display: flex; align-items: center; padding-left: 10px; font-size: 12px; font-weight: 600; border-radius: 4px; transition: width .6s; color: #fff; white-space: nowrap; }

    /* SECTION HEADER */
    .section-hdr { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    /* LOADING */
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ERROR BANNER */
    .err-banner { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: var(--red); padding: 10px 16px; border-radius: var(--r); margin-bottom: 12px; font-size: 13px; display: none; }
  </style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div class="logo">⚡ LeadGen AI</div>
    <div class="badge">Ops Command Center</div>
  </div>
  <div class="hdr-right">
    <span class="ao-topbar-status" style="margin-right:8px"><span class="dot"></span>AI Active</span>
    <span class="health-dot" id="healthDot"></span>
    <span class="last-update" id="lastUpdate">Loading...</span>
    <button class="refresh-btn" onclick="loadAll()">🔄 Refresh</button>
  </div>
</div>

<div class="page">
  <div class="err-banner" id="errBanner"></div>

  <!-- KPI ROW -->
  <div class="row kpi-row" id="kpiRow">
    <div class="card"><div class="loading"><div class="spinner"></div></div></div>
    <div class="card"><div class="loading"><div class="spinner"></div></div></div>
    <div class="card"><div class="loading"><div class="spinner"></div></div></div>
    <div class="card"><div class="loading"><div class="spinner"></div></div></div>
    <div class="card"><div class="loading"><div class="spinner"></div></div></div>
    <div class="card"><div class="loading"><div class="spinner"></div></div></div>
    <div class="card"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <!-- FUNNEL + LLM HEALTH -->
  <div class="row chart-row-2">
    <div class="card">
      <div class="card-title">📊 Lead Funnel</div>
      <div id="funnelArea"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="card">
      <div class="card-title">🤖 LLM Provider Health</div>
      <div class="chart-wrap" id="llmArea"><canvas id="llmChart"></canvas></div>
    </div>
  </div>

  <!-- PROSPECT PIPELINE + AUTOMATION JOBS -->
  <div class="row chart-row-2">
    <div class="card">
      <div class="card-title">📈 Prospect Pipeline Breakdown</div>
      <div class="chart-wrap tall"><canvas id="pipeChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">⚙️ Automation Job Health</div>
      <div id="jobsArea"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- AI STAFF ROSTER -->
  <div class="section-hdr">👥 AI Staff Roster</div>
  <div class="row full-row">
    <div class="card">
      <div id="staffArea"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- AUTOMATION FLAGS -->
  <div class="section-hdr">🚩 Automation Flags</div>
  <div class="row full-row">
    <div class="card">
      <div id="flagsArea"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- HOT LEADS -->
  <div class="section-hdr">🔥 Hot Leads</div>
  <div class="row full-row">
    <div class="card">
      <div id="hotLeadsArea"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<script>
const BASE = '';  // same-origin

// ── helpers ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n||0);
const fmtINR = n => n >= 1e5 ? '₹'+(n/1e5).toFixed(1)+'L' : n >= 1e3 ? '₹'+(n/1e3).toFixed(1)+'K' : '₹'+(n||0);
const ago = ts => { const d=(Date.now()-new Date(ts).getTime())/1000; return d<60?`${~~d}s ago`:d<3600?`${~~(d/60)}m ago`:`${~~(d/3600)}h ago`; };

const TOKEN = localStorage.getItem('accessToken') || '';
const hdrs = TOKEN ? {'Authorization':'Bearer '+TOKEN} : {};

async function apiFetch(path) {
  const r = await fetch(BASE + path, { headers: hdrs });
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

function showErr(msg) {
  const b = $('errBanner');
  b.textContent = '⚠️ ' + msg;
  b.style.display = 'block';
  setTimeout(() => b.style.display='none', 8000);
}

// ── KPI cards ──────────────────────────────────────────────────────────────
function renderKPIs(stats, growth) {
  const gp = (growth && growth.prospects) || {};
  const ge = (growth && growth.emails) || {};
  const kpis = [
    { label:'Prospects', val: fmt(gp.total||stats.total_prospects||0), sub:'in pipeline', color:'var(--accent)', delta: gp.ready ? `${gp.ready} ready` : '', cls:'neutral' },
    { label:'Clients', val: fmt(stats.active_clients||0), sub:`of ${stats.total_clients||0} total`, color:'var(--green)', delta:'', cls:'up' },
    { label:'Calls Made', val: fmt(stats.total_calls||0), sub:'all time', color:'var(--blue)', delta:'', cls:'neutral' },
    { label:'Appointments', val: fmt(stats.total_appointments||0), sub:'booked', color:'var(--purple)', delta:'', cls:'neutral' },
    { label:'MRR', val: fmtINR(stats.total_revenue_inr||0), sub:'revenue collected', color:'var(--yellow)', delta:'', cls:'up' },
    { label:'Emails Sent', val: fmt(ge.emailed||stats.emails_sent||0), sub:`${ge.with_email||0} with email`, color:'var(--teal)', delta:'', cls:'neutral' },
    { label:'Agent Actions', val: fmt((growth&&growth.actions_today)||0), sub:'today', color:'var(--red)', delta:'', cls:'neutral' },
  ];
  $('kpiRow').innerHTML = kpis.map(k => `
    <div class="card">
      <div class="card-title">${k.label}</div>
      <div class="kpi-val" style="color:${k.color}">${k.val}</div>
      <div class="kpi-sub">${k.sub}</div>
      ${k.delta?`<div class="kpi-delta ${k.cls}">${k.delta}</div>`:''}
    </div>
  `).join('');
}

// ── Funnel ─────────────────────────────────────────────────────────────────
function renderFunnel(gp, ge) {
  const steps = [
    { label:'Total Prospects', val: gp.total||0, color:'#6366f1' },
    { label:'With Email', val: gp.with_email||ge.with_email||0, color:'#3b82f6' },
    { label:'Emailed', val: ge.emailed||0, color:'#14b8a6' },
    { label:'Replied / Hot', val: gp.replied||0, color:'#f59e0b' },
    { label:'Became Client', val: gp.client||0, color:'#22c55e' },
  ];
  const max = steps[0].val || 1;
  $('funnelArea').innerHTML = steps.map(s => {
    const pct = Math.max(4, Math.round((s.val/max)*100));
    const rate = steps.indexOf(s) > 0 ? ` (${((s.val/(steps[steps.indexOf(s)-1].val||1))*100).toFixed(1)}%)` : '';
    return `<div class="funnel-step">
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-bar-wrap">
        <div class="funnel-bar" style="width:${pct}%;background:${s.color}">${fmt(s.val)}${rate}</div>
      </div>
    </div>`;
  }).join('');
}

// ── LLM chart ──────────────────────────────────────────────────────────────
let llmChart;
function renderLLM(data) {
  const providers = (data && data.providers) || {};
  const labels = Object.keys(providers);
  const okRates = labels.map(k => Math.round((providers[k].ok_rate||0)*100));
  const colors = okRates.map(r => r>=70?'rgba(34,197,94,.8)':r>=40?'rgba(245,158,11,.8)':'rgba(239,68,68,.8)');

  if (llmChart) llmChart.destroy();
  llmChart = new Chart($('llmChart'), {
    type:'bar',
    data:{ labels, datasets:[{ data:okRates, backgroundColor:colors, borderRadius:6 }] },
    options:{
      responsive:true, maintainAspectRatio:false, indexAxis:'y',
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c=>`${c.parsed.x}% ok-rate` } } },
      scales:{
        x:{ min:0, max:100, ticks:{ callback:v=>v+'%' }, grid:{color:'rgba(46,51,84,.6)'} },
        y:{ grid:{display:false} }
      }
    }
  });
}

// ── Pipeline chart ─────────────────────────────────────────────────────────
let pipeChart;
function renderPipeline(gp) {
  const labels = ['Ready','Sent','Replied','Client','Dead'];
  const vals = [gp.ready||0, gp.sent||0, gp.replied||0, gp.client||0, gp.dead||0];
  const colors = ['rgba(99,102,241,.8)','rgba(59,130,246,.8)','rgba(245,158,11,.8)','rgba(34,197,94,.8)','rgba(100,116,139,.5)'];
  if (pipeChart) pipeChart.destroy();
  pipeChart = new Chart($('pipeChart'), {
    type:'bar',
    data:{ labels, datasets:[{ data:vals, backgroundColor:colors, borderRadius:6 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c=>`${fmt(c.parsed.y)} leads` } } },
      scales:{
        x:{ grid:{display:false} },
        y:{ beginAtZero:true, grid:{color:'rgba(46,51,84,.6)'}, ticks:{callback:v=>fmt(v)} }
      }
    }
  });
}

// ── Jobs health ────────────────────────────────────────────────────────────
function renderJobs(health) {
  const jobs = (health && health.jobs) || {};
  const entries = Object.entries(jobs).slice(0, 12);
  if (!entries.length) { $('jobsArea').innerHTML = '<div class="loading" style="color:var(--muted)">No job data</div>'; return; }
  $('jobsArea').innerHTML = `<table class="tbl">
    <thead><tr><th>Job</th><th>Last Run</th><th>Status</th></tr></thead>
    <tbody>${entries.map(([job, info]) => {
      const ok = info && info.status !== 'overdue' && info.status !== 'missing';
      const pill = ok ? `<span class="pill pill-green">✓ OK</span>` : `<span class="pill pill-red">⚠ ${info&&info.status||'?'}</span>`;
      const last = info && info.last_run ? ago(info.last_run) : 'never';
      return `<tr><td>${job.replace(/_/g,' ')}</td><td style="color:var(--muted)">${last}</td><td>${pill}</td></tr>`;
    }).join('')}</tbody>
  </table>`;
}

// ── Staff roster ───────────────────────────────────────────────────────────
function renderStaff(data) {
  const members = (data && data.members) || [];
  if (!members.length) { $('staffArea').innerHTML = '<div class="loading" style="color:var(--muted)">No staff data</div>'; return; }
  const stateColor = s => s==='working'?'pill-green':s==='active'?'pill-blue':'pill-muted';
  $('staffArea').innerHTML = `<table class="tbl">
    <thead><tr><th>Staff</th><th>Role</th><th>Product</th><th>Actions Today</th><th>State</th><th>Last Active</th></tr></thead>
    <tbody>${members.map(m => `
      <tr>
        <td>${m.emoji||'🤖'} <strong>${m.name||''}</strong></td>
        <td style="color:var(--muted)">${m.role||''}</td>
        <td><span class="pill ${m.product==='voice'?'pill-purple':m.product==='marketing'?'pill-blue':'pill-muted'}">${m.product||'platform'}</span></td>
        <td>${fmt(m.today_actions||0)}</td>
        <td><span class="pill ${stateColor(m.state)}">${m.state||'idle'}</span></td>
        <td style="color:var(--muted)">${m.last_active_mins!=null ? m.last_active_mins+'m ago':'-'}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

// ── Flags ──────────────────────────────────────────────────────────────────
function renderFlags(data) {
  const flags = (data && data.flags) || [];
  if (!flags.length) { $('flagsArea').innerHTML = '<div class="loading" style="color:var(--muted)">No flags data</div>'; return; }
  $('flagsArea').innerHTML = `<div class="flags-grid">${flags.map(f => {
    const on = f.value === true || f.value === '1' || f.value === 'true' || f.value === 'on';
    return `<div class="flag-item ${on?'flag-on':'flag-off'}">
      <span>${f.key||f.name||''}</span>
      <span class="pill ${on?'pill-green':'pill-muted'}">${on?'ON':'OFF'}</span>
    </div>`;
  }).join('')}</div>`;
}

// ── Hot Leads ──────────────────────────────────────────────────────────────
function renderHotLeads(data) {
  const leads = (data && (data.leads||data)) || [];
  if (!leads.length) { $('hotLeadsArea').innerHTML = '<div class="loading" style="color:var(--muted)">No hot leads at the moment</div>'; return; }
  $('hotLeadsArea').innerHTML = `<table class="tbl">
    <thead><tr><th>Name / Company</th><th>Niche</th><th>City</th><th>Score</th><th>Status</th><th>Phone</th></tr></thead>
    <tbody>${leads.slice(0,15).map(l => `
      <tr>
        <td><strong>${l.business_name||l.name||'-'}</strong></td>
        <td style="color:var(--muted)">${l.niche||'-'}</td>
        <td style="color:var(--muted)">${l.city||'-'}</td>
        <td><span class="pill ${l.lead_score>=70?'pill-green':l.lead_score>=40?'pill-yellow':'pill-muted'}">${l.lead_score||0}</span></td>
        <td><span class="pill pill-purple">${l.status||'-'}</span></td>
        <td style="color:var(--muted)">${l.phone||'-'}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

// ── Main load ──────────────────────────────────────────────────────────────
async function loadAll() {
  $('lastUpdate').textContent = 'Refreshing...';
  $('healthDot').style.background = 'var(--yellow)';

  let stats={}, growth={}, llm={}, health={}, staff={}, flags={}, hotLeads={};
  const errors = [];

  const [rStats, rGrowth, rLlm, rHealth, rStaff, rFlags, rHotLeads] = await Promise.allSettled([
    apiFetch('/api/admin/live-stats'),
    apiFetch('/api/growth/overview/today'),
    apiFetch('/api/growth/infra/llm'),
    apiFetch('/api/growth/infra/automation-health'),
    apiFetch('/api/platform/team'),
    apiFetch('/api/growth/infra/flags'),
    apiFetch('/api/growth/leads/hot'),
  ]);
  const pick = (r, label) => {
    if (r.status === 'fulfilled') return r.value;
    errors.push(label + ': ' + r.reason.message);
    return {};
  };
  stats = pick(rStats, 'live-stats');
  growth = pick(rGrowth, 'growth');
  llm = pick(rLlm, 'llm');
  health = pick(rHealth, 'automation-health');
  staff = pick(rStaff, 'team');
  flags = pick(rFlags, 'flags');
  hotLeads = pick(rHotLeads, 'hot-leads');

  // Render
  const gp = (growth&&growth.prospects)||{};
  const ge = (growth&&growth.emails)||{};
  renderKPIs(stats, growth);
  renderFunnel(gp, ge);
  renderLLM(llm);
  renderPipeline(gp);
  renderJobs(health);
  renderStaff(staff);
  renderFlags(flags);
  renderHotLeads(hotLeads);

  // Health dot
  $('healthDot').style.background = errors.length > 3 ? 'var(--red)' : errors.length > 0 ? 'var(--yellow)' : 'var(--green)';
  $('healthDot').style.boxShadow = `0 0 6px ${errors.length > 3 ? 'var(--red)' : errors.length > 0 ? 'var(--yellow)' : 'var(--green)'}`;
  $('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');

  if (errors.length) showErr(errors.join(' | '));
}

// Auto-refresh every 60s
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
