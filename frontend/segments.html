<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0f1117">
<title>LeadGen AI — Dynamic Segments</title>
<link rel="stylesheet" href="/design-system/styles.css" />
<style>
:root{--bg:#0f1117;--card:#181b25;--line:#2a2f3e;--txt:#e6e8ef;--mut:#8b91a5;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--acc:#8b5cf6;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,Arial;padding:18px}
h1{font-size:1.3rem;margin-bottom:4px} .sub{color:var(--mut);font-size:.85rem;margin-bottom:14px}
input,select{background:#11141d;border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:.85rem}
button{background:var(--acc);border:0;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.85rem}
button.ghost{background:#222636}
button.del{background:#3a1f28;color:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.msg{font-size:.8rem;margin-left:8px} .mut{color:var(--mut);font-size:.78rem}
.builder{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.builder h2{font-size:.95rem;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cond{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.cond select,.cond input{font-size:.8rem}
.seglist{display:flex;flex-direction:column;gap:10px}
.seg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.seg .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg b{font-size:.95rem} .seg .cd{color:var(--mut);font-size:.75rem;margin-top:4px}
.pill{background:#222636;border-radius:8px;padding:1px 8px;font-size:.72rem;color:var(--blue)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.78rem}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.cnt{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<div style="background:linear-gradient(135deg,#080c18,#0d1629);padding:10px 18px;display:flex;align-items:center;border-bottom:1px solid rgba(99,120,199,.15)"><a href="/app/admin" style="font-weight:700;font-size:14px;color:#e2e8f0;text-decoration:none">LeadGen AI</a><div style="flex:1"></div><span class="ao-topbar-status"><span class="dot"></span>AI Active</span></div>
<h1>🎯 Dynamic Segments</h1>
<div class="sub">Condition-based auto-grouping (Mautic parity). Static list snapshot nahi — har Preview LIVE recompute hota hai prospect/lead pool pe.</div>
<div class="bar">
  <input id="tok" type="password" placeholder="Admin token paste karo" style="width:260px">
  <button onclick="saveTok()">Save</button>
  <button class="ghost" onclick="load()">↻ Reload</button>
  <a href="/app/admin-login" style="color:var(--mut);font-size:.8rem">login →</a>
  <span id="err" class="msg" style="color:var(--bad)"></span>
</div>

<div class="builder">
  <h2>➕ Naya Segment</h2>
  <div class="row">
    <input id="s_name" placeholder="Segment ka naam" style="width:220px">
    <label class="mut">Match:</label>
    <select id="s_match"><option value="all">ALL (sab conditions)</option><option value="any">ANY (koi ek)</option></select>
  </div>
  <div id="conds"></div>
  <div class="row">
    <button class="ghost" onclick="addCond()">+ Condition</button>
    <button onclick="saveSegment()">💾 Save Segment</button>
    <span id="savemsg" class="msg mut"></span>
  </div>
</div>

<div class="seglist" id="seglist"></div>

<script>
const $=id=>document.getElementById(id);
let FIELDS={}, OPS=[];
function tok(){return localStorage.getItem('accessToken')||''}
function saveTok(){localStorage.setItem('accessToken',$('tok').value.trim());load()}
async function api(p,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+tok()},opt.headers||{});
  const r=await fetch(p,opt);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function condRow(){
  const fieldOpts=Object.keys(FIELDS).map(f=>'<option value="'+f+'">'+f+' ('+FIELDS[f]+')</option>').join('');
  const opOpts=OPS.map(o=>'<option>'+o+'</option>').join('');
  const div=document.createElement('div');
  div.className='cond';
  div.innerHTML='<select class="c_field">'+fieldOpts+'</select>'+
    '<select class="c_op">'+opOpts+'</select>'+
    '<input class="c_val" placeholder="value" style="width:160px">'+
    '<button class="del" onclick="this.parentNode.remove()">✕</button>';
  return div;
}
function addCond(){ $('conds').appendChild(condRow()); }

function gatherConds(){
  const out=[];
  document.querySelectorAll('#conds .cond').forEach(function(c){
    const f=c.querySelector('.c_field').value;
    const op=c.querySelector('.c_op').value;
    const v=c.querySelector('.c_val').value;
    if(f) out.push({field:f,op:op,value:v});
  });
  return out;
}

async function saveSegment(){
  const name=$('s_name').value.trim();
  if(!name){ $('savemsg').textContent='naam to do'; return; }
  $('savemsg').textContent='…';
  try{
    await api('/api/segments',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,match:$('s_match').value,conditions:gatherConds()})});
    $('savemsg').textContent='✅ saved';
    $('s_name').value=''; $('conds').innerHTML=''; addCond();
    load();
  }catch(e){ $('savemsg').textContent='❌ '+e.message+' — token?'; }
}

async function preview(id,btn){
  btn.textContent='…';
  try{
    const d=await api('/api/segments/'+encodeURIComponent(id)+'/preview');
    btn.textContent='Preview';
    const wrap=document.getElementById('prev_'+id);
    let html='<div class="mut">Live count: <span class="cnt">'+(d.count||0)+'</span> leads · sample (max 50):</div>';
    const rows=d.sample||[];
    if(rows.length){
      html+='<table><tr><th>Business</th><th>Niche</th><th>City</th><th>Status</th><th>Score</th><th>Email?</th></tr>';
      html+=rows.map(function(r){return '<tr><td>'+esc(r.business_name)+'</td><td>'+esc(r.niche)+
        '</td><td>'+esc(r.city)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.lead_score)+
        '</td><td>'+(r.has_email?'✓':'—')+'</td></tr>';}).join('');
      html+='</table>';
    } else { html+='<div class="mut">Koi lead match nahi hua.</div>'; }
    wrap.innerHTML=html;
  }catch(e){ btn.textContent='Preview'; document.getElementById('prev_'+id).innerHTML='<div class="msg" style="color:var(--bad)">preview fail ('+e.message+')</div>'; }
}

async function delSeg(id){
  if(!confirm('Segment delete karein?'))return;
  try{ await api('/api/segments/'+encodeURIComponent(id),{method:'DELETE'}); load(); }
  catch(e){ $('err').textContent='delete fail ('+e.message+')'; }
}

function condText(c){ return esc(c.field)+' '+esc(c.op)+' '+esc(c.value); }

async function load(){
  $('err').textContent='';
  try{
    const meta=await api('/api/segments/_meta');
    FIELDS=meta.fields||{}; OPS=meta.ops||[];
    if(!$('conds').children.length) addCond();
    const d=await api('/api/segments');
    const segs=d.segments||[];
    $('seglist').innerHTML = segs.length ? segs.map(function(s){
      const conds=(s.conditions||[]).map(condText).join(' <span class="mut">'+(s.match==='any'?'OR':'AND')+'</span> ')||'<span class="mut">(sab leads)</span>';
      return '<div class="seg"><div class="top"><div><b>'+esc(s.name)+'</b> '+
        '<span class="pill">'+esc(s.match)+'</span></div>'+
        '<div><button class="ghost" onclick="preview(\''+s.id+'\',this)">Preview</button> '+
        '<button class="del" onclick="delSeg(\''+s.id+'\')">Delete</button></div></div>'+
        '<div class="cd">'+conds+'</div>'+
        '<div id="prev_'+s.id+'"></div></div>';
    }).join('') : '<div class="mut">Abhi koi segment nahi — upar se banao.</div>';
  }catch(e){ $('err').textContent='Load fail — token sahi hai? ('+e.message+')'; }
}

$('tok').value=tok();
load();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
