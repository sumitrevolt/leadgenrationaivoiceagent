<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGen AI — Key Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #334155; }
        .card h2 { color: #f8fafc; margin-bottom: 1rem; font-size: 1.1rem; }
        .status-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #334155; }
        .status-row:last-child { border-bottom: none; }
        .service-name { font-weight: 600; color: #f8fafc; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .status-enabled { background: #22c55e; color: #052e16; }
        .status-disabled { background: #64748b; color: #f1f5f9; }
        .key-prefix { font-family: monospace; color: #94a3b8; font-size: 0.875rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .actions { display: flex; gap: 0.5rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%; }
        .modal-content h3 { color: #f8fafc; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: #94a3b8; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
        .audit-log { max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; }
        .audit-entry { padding: 0.5rem; border-bottom: 1px solid #334155; color: #94a3b8; }
        .audit-entry:last-child { border-bottom: none; }
        .audit-time { color: #64748b; }
        .audit-action { color: #38bdf8; font-weight: 600; }
        .audit-service { color: #a78bfa; }
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 8px; color: white; font-weight: 500; opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Key Manager</h1>
        <p class="subtitle">Secure API key management for LeadGen AI</p>
        
        <!-- Services Status -->
        <div class="card">
            <h2>API Keys Status</h2>
            <div id="services-list">
                <p style="color: #94a3b8;">Loading...</p>
            </div>
        </div>
        
        <!-- Actions -->
        <div class="card">
            <h2>Quick Actions</h2>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="openModal('set')">Set New Key</button>
                <button class="btn btn-success" onclick="openModal('rotate')">Rotate Key</button>
                <button class="btn btn-primary" onclick="loadAudit()">View Audit Log</button>
            </div>
        </div>
        
        <!-- Audit Log -->
        <div class="card" id="audit-card" style="display: none;">
            <h2>Audit Log</h2>
            <div class="audit-log" id="audit-log">
                <p style="color: #94a3b8;">Loading...</p>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div class="modal" id="key-modal">
        <div class="modal-content">
            <h3 id="modal-title">Set API Key</h3>
            <div class="form-group">
                <label>Service</label>
                <select id="modal-service">
                    <option value="typesafe">TypeSafe AI</option>
                    <option value="groq">Groq</option>
                    <option value="gemini">Gemini</option>
                    <option value="vobiz">Vobiz</option>
                    <option value="whatsapp">WhatsApp (WAHA)</option>
                </select>
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="modal-key" placeholder="Enter key (never shared in chat)">
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitKey()">Save Key</button>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <script>
        const API_BASE = '/api/admin/keys';
        let currentMode = 'set';
        
        async function loadServices() {
            const services = ['typesafe', 'groq', 'gemini', 'vobiz', 'whatsapp'];
            const container = document.getElementById('services-list');
            
            let html = '';
            for (const service of services) {
                try {
                    const resp = await fetch(`${API_BASE}/status/${service}`);
                    const data = await resp.json();
                    
                    const statusClass = data.enabled ? 'status-enabled' : 'status-disabled';
                    const statusText = data.enabled ? 'ENABLED' : 'DISABLED';
                    const prefix = data.prefix || 'No key set';
                    
                    html += `
                        <div class="status-row">
                            <div>
                                <div class="service-name">${service.charAt(0).toUpperCase() + service.slice(1)}</div>
                                <div class="key-prefix">${prefix}</div>
                            </div>
                            <div class="actions">
                                <span class="status-badge ${statusClass}">${statusText}</span>
                                <button class="btn btn-primary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="openModal('set', '${service}')">Update</button>
                            </div>
                        </div>
                    `;
                } catch (e) {
                    html += `
                        <div class="status-row">
                            <div>
                                <div class="service-name">${service.charAt(0).toUpperCase() + service.slice(1)}</div>
                                <div class="key-prefix" style="color: #ef4444;">Error loading status</div>
                            </div>
                        </div>
                    `;
                }
            }
            
            container.innerHTML = html;
        }
        
        async function loadAudit() {
            const card = document.getElementById('audit-card');
            const log = document.getElementById('audit-log');
            
            card.style.display = 'block';
            log.innerHTML = '<p style="color: #94a3b8;">Loading...</p>';
            
            try {
                const resp = await fetch(`${API_BASE}/audit?limit=50`);
                const entries = await resp.json();
                
                if (entries.length === 0) {
                    log.innerHTML = '<p style="color: #94a3b8;">No audit entries</p>';
                    return;
                }
                
                log.innerHTML = entries.map(e => `
                    <div class="audit-entry">
                        <span class="audit-time">${new Date(e.timestamp).toISOString()}</span>
                        <span class="audit-action">[${e.action}]</span>
                        <span class="audit-service">${e.service}</span>
                        ${e.note ? `<br><span style="color: #64748b;">${e.note}</span>` : ''}
                    </div>
                `).reverse().join('');
            } catch (e) {
                log.innerHTML = '<p style="color: #ef4444;">Error loading audit log</p>';
            }
        }
        
        function openModal(mode, service = 'typesafe') {
            currentMode = mode;
            document.getElementById('modal-title').textContent = mode === 'set' ? 'Set API Key' : 'Rotate API Key';
            document.getElementById('modal-service').value = service;
            document.getElementById('modal-key').value = '';
            document.getElementById('key-modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('key-modal').classList.remove('active');
        }
        
        async function submitKey() {
            const service = document.getElementById('modal-service').value;
            const key = document.getElementById('modal-key').value;
            
            if (!key || key.length < 8) {
                showToast('Key too short', 'error');
                return;
            }
            
            const endpoint = currentMode === 'set' ? 'set' : 'rotate';
            
            try {
                const resp = await fetch(`${API_BASE}/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service, key })
                });
                
                const data = await resp.json();
                
                if (data.success) {
                    showToast(`Key ${currentMode === 'set' ? 'set' : 'rotated'} for ${service}`, 'success');
                    closeModal();
                    loadServices();
                } else {
                    showToast(data.detail || 'Error', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Load on page open
        loadServices();
    </script>
</body>
</html>
