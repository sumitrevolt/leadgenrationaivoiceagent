<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadGen AI — Control Center</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0c;--panel:#111113;--panel2:#13141a;--card:#161618;
  --bd:#1e2028;--bd2:#2d3748;--tx:#e2e8f0;--mut:#64748b;--mut2:#475569;
  --amber:#f59e0b;
  --healthy:#22c55e;--processing:#3b82f6;--waiting:#eab308;--retry:#f97316;
  --failed:#ef4444;--ai:#a855f7;--idle:#64748b;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:13px}
button{font-family:inherit}
a{color:inherit}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#23252e;border-radius:4px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px;border-radius:3px}

/* ===== TOP STRIP ===== */
#top{height:46px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:200}
.brand{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brand .bdot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 7px var(--amber)}
.crumb{font-size:11px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:6px}
.crumb .sep{color:#33363f}
.crumb b{color:#cbd5e1;font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:7px}
.pill{font-size:11px;padding:3px 9px;border-radius:5px;border:1px solid var(--bd2);background:var(--card);color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.env{border-color:#15803d;color:#4ade80}
.pill.env .pdot{width:6px;height:6px;border-radius:50%;background:#22c55e}
.tbtn{padding:4px 9px;border-radius:5px;font-size:12px;cursor:pointer;color:var(--mut);border:1px solid var(--bd2);background:var(--card);display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap;transition:all .12s}
.tbtn:hover{color:var(--tx);border-color:#4b5563}
#clock{font-size:11px;color:#94a3b8;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== METRIC CARDS ROW ===== */
#metrics{flex-shrink:0;background:#0d0d0f;border-bottom:1px solid var(--bd);padding:9px 12px;display:grid;grid-template-columns:repeat(6,1fr);gap:9px;z-index:150}
.mcard{background:var(--panel2);border:1px solid var(--bd);border-left:3px solid var(--idle);border-radius:8px;padding:8px 11px;min-width:0}
.mcard .mhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mcard .mlabel{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mbig{font-size:22px;font-weight:800;color:#fff;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.mcard .msub{font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.ok{border-left-color:var(--healthy)}
.mcard.warn{border-left-color:var(--waiting)}
.mcard.bad{border-left-color:var(--failed)}
.mcard.proc{border-left-color:var(--processing)}

/* shared live/projection badge */
.lb{font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.lb.live{background:#06210f;border:1px solid #14532d;color:#4ade80}
.lb.live .d{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e}
.lb.proj{background:#14151a;border:1px dashed #3a3d47;color:#8a93a3}
.lb.proj .d{width:5px;height:5px;border-radius:50%;background:#4b5563}
.lb.idle{background:#16171c;border:1px solid #2a2d36;color:var(--mut)}
.lb.idle .d{width:5px;height:5px;border-radius:50%;background:#3d4350}

/* ===== MAIN ROW ===== */
#main{flex:1;display:flex;overflow:hidden;min-height:0}

/* LEFT RAIL */
#rail{width:200px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .14s;overflow:hidden;z-index:100}
#rail.collapsed{width:60px}
.rail-item{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;color:var(--mut);font-size:12px;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap;text-decoration:none;transition:background .1s,color .1s;border-left:3px solid transparent}
.rail-item:hover{background:#16181f;color:var(--tx)}
.rail-item.active{color:#fff;background:#181b22;border-left-color:var(--amber)}
.rail-item .ri-ic{width:18px;flex-shrink:0;text-align:center;font-size:15px}
.rail-item .ri-tx{overflow:hidden;text-overflow:ellipsis}
#rail.collapsed .ri-tx{opacity:0;width:0}
.rail-div{height:1px;background:var(--bd);margin:9px 12px}
.rail-cap{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#384152;padding:4px 14px 4px;white-space:nowrap}
#rail.collapsed .rail-cap{opacity:0}
.rail-foot{margin-top:auto;padding:8px}
.rail-collapse{width:100%;border:1px solid var(--bd2);background:var(--card);color:var(--mut);border-radius:6px;padding:6px;cursor:pointer;font-size:13px}
.rail-collapse:hover{color:var(--tx);border-color:#4b5563}

/* CENTER CANVAS */
#canvas{flex:1;overflow-y:auto;padding:16px;min-width:0;background:radial-gradient(circle at 50% -10%,#0e1016 0,#0a0a0c 60%)}

/* RIGHT INSPECTOR */
#inspector{width:360px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--bd);display:flex;flex-direction:column;transition:width .14s,margin .14s;overflow:hidden;z-index:100}
#inspector.collapsed{width:0;border-left:none}
.ins-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.ins-title{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#94a3b8}
.ins-x{cursor:pointer;border:none;background:transparent;color:var(--mut);font-size:16px;line-height:1;padding:2px 5px;border-radius:4px}
.ins-x:hover{color:var(--tx);background:#1c1f27}
.ins-body{flex:1;overflow-y:auto;padding:14px}
.ins-empty{color:var(--mut2);font-size:12px;line-height:1.7;padding:24px 8px;text-align:center}
.ins-empty .ie-ic{font-size:26px;display:block;margin-bottom:10px;opacity:.5}

/* ===== panels / cards in canvas ===== */
.headline{border-radius:10px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--bd2);border-left:4px solid var(--mut);background:var(--panel2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.headline.sev-ok{border-left-color:var(--healthy);background:#0c1a12}
.headline.sev-warn{border-left-color:var(--waiting);background:#1a1606}
.headline.sev-bad{border-left-color:var(--failed);background:#1a0e0e}
.headline.sev-idle{border-left-color:var(--idle);background:var(--panel2)}
.headline .hl-tx{font-size:15px;font-weight:700;color:#fff;line-height:1.45;flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px;align-items:start}
.panel{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px;border-bottom:1px solid var(--bd)}
.panel-h .ph-t{font-size:12px;font-weight:700;color:#e2e8f0;display:flex;align-items:center;gap:7px}
.panel-h .ph-t .pic{font-size:13px}
.panel-b{padding:6px 13px 12px}
.panel.dashed{border-style:dashed;border-color:#33363f;background:#101117}

/* status row */
.srow{display:flex;align-items:flex-start;gap:9px;padding:8px 6px;border-bottom:1px solid #15161c;cursor:pointer;border-radius:5px;border-left:3px solid transparent}
.srow:last-child{border-bottom:none}
.srow:hover{background:#16181f}
.srow .sdot{width:8px;height:8px;border-radius:50%;background:var(--idle);margin-top:4px;flex-shrink:0}
.srow .stx{flex:1;min-width:0}
.srow .stitle{font-size:12px;color:#cbd5e1;line-height:1.4}
.srow .ssub{font-size:11px;color:var(--mut);line-height:1.5;margin-top:2px;word-break:break-word}
.srow .ssub.fix{color:#86efac}
.srow .smeta{font-size:11px;color:var(--mut2);flex-shrink:0;margin-top:3px;text-align:right;white-space:nowrap}
.srow.st-healthy{border-left-color:var(--healthy)}.srow.st-healthy .sdot{background:var(--healthy)}
.srow.st-processing{border-left-color:var(--processing)}.srow.st-processing .sdot{background:var(--processing)}
.srow.st-waiting{border-left-color:var(--waiting)}.srow.st-waiting .sdot{background:var(--waiting)}
.srow.st-retry{border-left-color:var(--retry)}.srow.st-retry .sdot{background:var(--retry)}
.srow.st-failed{border-left-color:var(--failed)}.srow.st-failed .sdot{background:var(--failed)}
.srow.st-ai{border-left-color:var(--ai)}.srow.st-ai .sdot{background:var(--ai)}
.srow.st-idle{border-left-color:var(--idle)}.srow.st-idle .sdot{background:var(--idle)}

.empty-line{font-size:11px;color:var(--mut);padding:10px 6px;line-height:1.6}
.empty-line.good{color:#4ade80}

/* staff groups */
.grp-cap{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut2);margin:8px 6px 3px}
.grp-cap:first-child{margin-top:2px}

/* cost tile */
.cost-tile{text-align:center;padding:18px 10px}
.cost-tile .ct-glyph{font-size:24px;color:#4b5563}
.cost-tile .ct-big{font-size:18px;font-weight:800;color:#6b7280;margin-top:6px;letter-spacing:.5px}
.cost-tile .ct-sub{font-size:11px;color:var(--mut2);margin-top:5px;line-height:1.6}

/* flag chip rows */
.flag-line{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-bottom:1px solid #15161c}
.flag-line:last-child{border-bottom:none}
.flag-line .fl-name{font-size:11px;color:#fbbf24;flex-shrink:0;background:#1a1408;border:1px solid #3a2e0a;border-radius:4px;padding:2px 6px}
.flag-line .fl-tx{font-size:11px;color:var(--mut);line-height:1.5}

/* stub panel */
.stub-wrap{max-width:620px;margin:6px auto}
.stub-desc{font-size:13px;color:#cbd5e1;line-height:1.7;margin-bottom:10px}
.stub-note{font-size:11px;color:#fbbf24;background:#1a1408;border:1px solid #3a2e0a;border-radius:7px;padding:9px 12px;margin-bottom:14px;line-height:1.6}
.stub-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:7px;background:#1a2a42;border:1px solid #1e3a5f;color:#60a5fa;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
.stub-btn:hover{background:#1e3350;border-color:#2563eb;color:#93c5fd}
.runs-list{margin-top:16px}
.run-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;margin-bottom:6px;background:var(--card)}
.run-row .rdot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex-shrink:0}
.run-row .rid{font-size:11px;color:var(--mut);flex-shrink:0}
.run-row .rproc{font-size:12px;color:#cbd5e1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-row .rstat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}

/* no-token banner */
.tok-banner{background:#1a1408;border:1px solid #3a2e0a;border-radius:9px;padding:13px 16px;margin-bottom:14px;color:#fbbf24;font-size:12px;line-height:1.7;display:flex;align-items:center;gap:11px}
.tok-banner a{color:#fcd34d;font-weight:700}
.tok-banner .tk-ic{font-size:20px}

/* ===== BOTTOM PANEL ===== */
#bottom{flex-shrink:0;background:var(--panel);border-top:1px solid var(--bd);display:flex;flex-direction:column;transition:height .14s;z-index:120}
#bottom.collapsed{height:34px}
.bot-tabs{display:flex;align-items:center;height:34px;flex-shrink:0;padding:0 6px;gap:2px}
.bot-tab{padding:5px 12px;font-size:11px;font-weight:600;color:var(--mut);background:transparent;border:none;cursor:pointer;border-radius:5px}
.bot-tab:hover{color:var(--tx)}
.bot-tab.active{color:var(--amber);background:#1a1408}
.bot-spacer{margin-left:auto;display:flex;align-items:center;gap:9px;padding-right:6px}
.bot-live{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.bot-live .bldot{width:7px;height:7px;border-radius:50%;background:#3d4350}
.bot-live.on .bldot{background:#22c55e;box-shadow:0 0 6px #22c55e}
.bot-live.recon .bldot{background:#eab308;animation:pulse 1.1s infinite}
.bot-toggle{cursor:pointer;border:none;background:transparent;color:var(--mut);font-size:13px;padding:3px 7px;border-radius:4px}
.bot-toggle:hover{color:var(--tx);background:#1c1f27}
.bot-body{flex:1;overflow-y:auto;padding:8px 12px;min-height:0}
#bottom.collapsed .bot-body{display:none}
.log-line{font-size:11px;color:#94a3b8;padding:3px 0;line-height:1.5;border-bottom:1px solid #131319;display:flex;gap:9px}
.log-line .lt{color:var(--mut2);flex-shrink:0;font-variant-numeric:tabular-nums}
.log-line .lm{flex:1;word-break:break-word}
.log-line .lm b{color:#cbd5e1;font-weight:600}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== RESPONSIVE ===== */
@media (max-width:1100px){
  #inspector{width:300px}
  #metrics{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:768px){
  #rail{width:60px}
  #rail .ri-tx,#rail .rail-cap{opacity:0;width:0}
  #inspector{position:absolute;right:0;top:0;bottom:0;width:300px;box-shadow:-8px 0 24px rgba(0,0,0,.5)}
  #inspector.collapsed{width:0}
  #metrics{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  #canvas{padding:11px}
}
</style>
</head>
<body>

<div id="top">
  <div class="brand"><span class="bdot"></span>LeadGen AI · Control Center</div>
  <div class="crumb"><span class="sep">/</span><b id="crumb-level">L1 Executive Overview</b></div>
  <div class="top-right">
    <span class="pill env"><span class="pdot"></span>prod</span>
    <span id="clock" class="mono">--:--:-- IST</span>
    <button class="tbtn" title="coming soon" id="cmdk-btn">⌘K</button>
    <button class="tbtn" title="Settings (coming soon)">⚙</button>
    <button class="tbtn" id="theme-btn" title="Theme (placeholder)">◑</button>
    <a class="tbtn" href="/app/explorer" target="_blank" rel="noopener" title="Architecture Explorer">Explorer ↗</a>
  </div>
</div>

<div id="metrics">
  <div class="mcard" id="m-staff"><div class="mhead"><span class="mlabel">Staff</span><span class="lb idle" data-lb><span class="d"></span>—</span></div><div class="mbig">—</div><div class="msub">—</div></div>
  <div class="mcard" id="m-jobs"><div class="mhead"><span class="mlabel">Jobs aaj</span><span class="lb idle" data-lb><span class="d"></span>—</span></div><div class="mbig">—</div><div class="msub">—</div></div>
  <div class="mcard" id="m-runs"><div class="mhead"><span class="mlabel">Runs</span><span class="lb idle" data-lb><span class="d"></span>—</span></div><div class="mbig">—</div><div class="msub">—</div></div>
  <div class="mcard" id="m-queue"><div class="mhead"><span class="mlabel">Queue / DLQ</span><span class="lb idle" data-lb><span class="d"></span>—</span></div><div class="mbig">—</div><div class="msub">—</div></div>
  <div class="mcard" id="m-heart"><div class="mhead"><span class="mlabel">Heartbeat</span><span class="lb idle" data-lb><span class="d"></span>—</span></div><div class="mbig">—</div><div class="msub">—</div></div>
  <div class="mcard" id="m-llm"><div class="mhead"><span class="mlabel">LLM brain</span><span class="lb idle" data-lb><span class="d"></span>—</span></div><div class="mbig">—</div><div class="msub">—</div></div>
</div>

<div id="main">
  <nav id="rail">
    <div class="rail-cap">Levels</div>
    <button class="rail-item" data-route="" id="rail-l1"><span class="ri-ic">▣</span><span class="ri-tx">L1 Executive</span></button>
    <button class="rail-item" data-route="stack" id="rail-l2"><span class="ri-ic">⛁</span><span class="ri-tx">L2 Stack</span></button>
    <button class="rail-item" data-route="workflow" id="rail-l3"><span class="ri-ic">⛓</span><span class="ri-tx">L3 Workflow</span></button>
    <button class="rail-item" data-route="agent" id="rail-l4"><span class="ri-ic">◈</span><span class="ri-tx">L4 Agent</span></button>
    <div class="rail-div"></div>
    <div class="rail-cap">Deep links</div>
    <a class="rail-item" href="/app/explorer" target="_blank" rel="noopener"><span class="ri-ic">🗺</span><span class="ri-tx">Explorer ↗</span></a>
    <a class="rail-item" href="/app/automation" target="_blank" rel="noopener"><span class="ri-ic">🛠</span><span class="ri-tx">Mission Control ↗</span></a>
    <a class="rail-item" href="/app/team" target="_blank" rel="noopener"><span class="ri-ic">👥</span><span class="ri-tx">Team ↗</span></a>
    <a class="rail-item" href="/app/admin" target="_blank" rel="noopener"><span class="ri-ic">⚙</span><span class="ri-tx">Admin ↗</span></a>
    <div class="rail-foot">
      <button class="rail-collapse" id="rail-collapse" title="Collapse rail">⮜</button>
    </div>
  </nav>

  <main id="canvas" aria-live="polite"><div class="ins-empty">Loading…</div></main>

  <aside id="inspector" class="collapsed">
    <div class="ins-head">
      <span class="ins-title" id="ins-title">Inspector</span>
      <button class="ins-x" id="ins-close" title="Band karo (Esc)">✕</button>
    </div>
    <div class="ins-body" id="ins-body"></div>
  </aside>
</div>

<div id="bottom">
  <div class="bot-tabs">
    <button class="bot-tab active" data-bot="log">Live Log</button>
    <button class="bot-tab" data-bot="runs">Recent Runs</button>
    <button class="bot-tab" data-bot="dlq">DLQ / Queue</button>
    <div class="bot-spacer">
      <span class="bot-live" id="bot-live"><span class="bldot"></span><span id="bot-live-tx">offline</span></span>
      <button class="bot-toggle" id="bot-toggle" title="Toggle panel">▾</button>
    </div>
  </div>
  <div class="bot-body" id="bot-body"></div>
</div>

<script>
"use strict";

// ════════════════════════════════════════════════════════════════
// LeadGen AI — Control Center · Phase 1 shell + wired L1
// Vanilla, single-file, no deps. Never-crash on missing data.
// ════════════════════════════════════════════════════════════════

var API_BASES = ['https://leadsgenai.in', 'http://127.0.0.1:8000', 'http://localhost:8000'];
function getApiBases(){
  var bases = [];
  try {
    if (location.protocol.indexOf('http') === 0 && location.host) bases.push(location.origin);
  } catch(e){}
  API_BASES.forEach(function(b){ if (bases.indexOf(b) < 0) bases.push(b); });
  return bases;
}
function getToken(){
  try { return localStorage.getItem('accessToken') || localStorage.getItem('adminToken') || ''; }
  catch(e){ return ''; }
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function el(id){ return document.getElementById(id); }
function num(v, d){ var n = Number(v); return (isFinite(n)) ? n : (d == null ? 0 : d); }

// ---- in-memory fetch cache + abort -------------------------------------
var _cache = new Map();
function fetchJSON(url, opts){
  opts = opts || {};
  var ttl = opts.ttl || 0;
  var now = Date.now();
  if (ttl) {
    var hit = _cache.get(url);
    if (hit && (now - hit.t) < ttl) return Promise.resolve(hit.v);
  }
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctl ? setTimeout(function(){ try { ctl.abort(); } catch(e){} }, opts.timeout || 9000) : null;
  var headers = {};
  if (opts.token) headers['Authorization'] = 'Bearer ' + opts.token;
  return fetch(url, {
    mode: 'cors', credentials: 'omit', headers: headers,
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){
    if (timer) clearTimeout(timer);
    if (!r.ok) { var e = new Error('http ' + r.status); e.status = r.status; throw e; }
    return r.json();
  }).then(function(j){
    if (ttl) _cache.set(url, {t: now, v: j});
    return j;
  }).catch(function(err){
    if (timer) clearTimeout(timer);
    throw err;
  });
}

// DATA — primary call + fallback fan-out → unified contract shape
// ════════════════════════════════════════════════════════════════
function blankOverview(){
  return {
    ok:false, at:null, headline:'', problems:[],
    metrics:{ staff:{total:0,active:0}, jobs:{total:0,ok:0,issues:0}, runs:{total:0,running:0},
      queue:{depth:0,dlq:0}, heartbeat:{up:0,total:0}, llm:{ok_rate:null,primary:''} },
    staff:[], jobs:[], flags_off:[], activation:{ready_for_paid:null,blockers:[]},
    eval_gate:{status:'',regression:null}, providers:[],
    cost:{available:false, note:'instrument pending'}
  };
}

function loadOverview(){
  if (!STATE.token) {
    STATE.hasToken = false;
    STATE.overview = null;
    render(); renderMetrics(); return Promise.resolve();
  }
  if (STATE.fetching) return Promise.resolve();
  STATE.fetching = true;
  var bases = getApiBases();
  // try primary /control-center/overview on each base (unless known-dead)
  var chain = Promise.resolve(null);
  if (!STATE.primaryDead) {
    bases.forEach(function(base){
      chain = chain.then(function(got){
        if (got) return got;
        return fetchJSON(base + '/api/control-center/overview', {token:STATE.token, ttl:0, timeout:9000})
          .then(function(j){ STATE.liveBase = base; STATE.degraded = false; return j; })
          .catch(function(err){
            if (err && err.status === 404) STATE.primaryDead = true; // skip primary forever this session
            return null;
          });
      });
    });
  }
  return chain.then(function(primary){
    if (primary) { STATE.overview = primary; STATE.hasToken = true; STATE.liveAt = Date.now(); return; }
    return fanoutFallback(bases);
  }).then(function(){
    STATE.fetching = false; STATE.loaded = true;
    render(); renderMetrics();
  }).catch(function(){
    STATE.fetching = false; STATE.loaded = true;
    render(); renderMetrics();
  });
}

// fan out to REAL existing endpoints (Promise.allSettled, partial is fine)
function fanoutFallback(bases){
  var base = STATE.liveBase || bases[0];
  function tryEach(path){
    var ch = Promise.resolve(null);
    bases.forEach(function(b){
      ch = ch.then(function(got){
        if (got) return got;
        return fetchJSON(b + path, {token:STATE.token, ttl:0, timeout:9000})
          .then(function(j){ STATE.liveBase = b; return {base:b, data:j}; })
          .catch(function(){ return null; });
      });
    });
    return ch;
  }
  return Promise.all([
    tryEach('/api/growth/overview/today'),
    tryEach('/api/growth/infra/automation-health'),
    tryEach('/api/activation/summary'),
    tryEach('/api/growth/infra/llm'),
    tryEach('/api/eval-gate/summary'),
    tryEach('/api/growth/process/runs')
  ]).then(function(res){
    var today  = res[0] && res[0].data;
    var autoh  = res[1] && res[1].data;
    var act    = res[2] && res[2].data;
    var llm    = res[3] && res[3].data;
    var evalg  = res[4] && res[4].data;
    var runsR  = res[5] && res[5].data;
    var anyOk = !!(today || autoh || act || llm || evalg || runsR);
    if (!anyOk) { STATE.overview = null; STATE.hasToken = true; STATE.degraded = true; return; }
    STATE.overview = mapFallback(today, autoh, act, llm, evalg, runsR);
    STATE.degraded = true;
    STATE.hasToken = true;
    STATE.liveAt = Date.now();
    if (runsR && Array.isArray(runsR.runs)) STATE.runs = runsR.runs;
  });
}

function mapFallback(today, autoh, act, llm, evalg, runsR){
  var o = blankOverview();
  o.ok = true;
  o.at = (today && today.at) || new Date().toISOString();
  today = today || {}; autoh = autoh || {}; act = act || {}; llm = llm || {}; evalg = evalg || {};

  // headline + problems + staff + jobs + flags from overview/today
  o.headline = today.headline || '';
  o.problems = Array.isArray(today.problems) ? today.problems : [];
  o.staff = Array.isArray(today.staff) ? today.staff.map(function(s){
    return { name:s.name||s.member||'', emoji:s.emoji||'🤖', state:_staffState(s.line),
             role:s.role||'', today:num(s.today), last:s.last||'' };
  }) : [];
  o.jobs = Array.isArray(today.jobs) ? today.jobs.map(function(j){
    return { label:j.label||j.job||'', status:j.status||'unknown', line:j.line||'', kya:j.kya||'' };
  }) : [];
  o.flags_off = Array.isArray(today.flags_off) ? today.flags_off : [];

  // ---- metrics ----
  var totals = today.totals || {};
  var staffTotal = num(totals.staff, o.staff.length);
  var staffActive = o.staff.filter(function(s){ return s.state==='healthy' || s.state==='processing'; }).length;
  if (!staffActive) staffActive = num(totals.working, 0);
  o.metrics.staff = { total: staffTotal, active: staffActive };

  var jobs = Array.isArray(autoh.jobs) ? autoh.jobs : o.jobs;
  var jOk = 0, jIssue = 0;
  jobs.forEach(function(j){
    var st = j.status || '';
    if (st === 'ok') jOk++;
    else if (st === 'overdue' || st === 'last_failed' || st === 'never_ran') jIssue++;
  });
  o.metrics.jobs = { total: jobs.length, ok: jOk, issues: jIssue };

  // heartbeat: jobs that have run at least once / total
  var hbUp = jobs.filter(function(j){ return j.status==='ok' || j.status==='overdue' || j.status==='last_failed'; }).length;
  o.metrics.heartbeat = { up: hbUp, total: jobs.length };

  // queue / dlq
  var q = autoh.queue || {};
  o.metrics.queue = { depth: num(q.celery, 0) < 0 ? 0 : num(q.celery, 0), dlq: num(q.dlq, 0) < 0 ? 0 : num(q.dlq, 0) };

  // llm — derive ok_rate from fallback-rate, primary from busiest provider
  var llmMetric = _deriveLlm(llm);
  o.metrics.llm = llmMetric;
  o.providers = _providerList(llm);

  // runs
  if (runsR && Array.isArray(runsR.runs)) {
    var running = runsR.runs.filter(function(r){ return (r.status||'') === 'running' || (r.status||'') === 'active'; }).length;
    o.metrics.runs = { total: runsR.runs.length, running: running };
  } else {
    o.metrics.runs = { total: null, running: null };
  }

  // activation
  var ready = act.ready_for_first_paid_customer;
  if (ready == null) ready = act.production_ready;
  if (ready == null) ready = act.ready_for_launch;
  o.activation = { ready_for_paid: (ready == null ? null : !!ready), blockers: act.blockers || [] };

  // eval gate
  o.eval_gate = { status: _evalStatus(evalg), regression: _evalRegression(evalg) };

  return o;
}

function _staffState(line){
  line = String(line || '');
  if (line.indexOf('🟢') >= 0 || line.toLowerCase().indexOf('working') >= 0) return 'processing';
  if (line.indexOf('🔵') >= 0 || line.toLowerCase().indexOf('active') >= 0) return 'healthy';
  return 'idle';
}
function _deriveLlm(llm){
  if (!llm || typeof llm !== 'object') return { ok_rate:null, primary:'' };
  var fbRate = llm.fallback_or_fail_rate;
  var okRate = (typeof fbRate === 'number') ? Math.max(0, Math.min(1, 1 - fbRate)) : null;
  var provs = llm.providers || {};
  var primary = '', best = -1;
  Object.keys(provs).forEach(function(p){
    var c = num(provs[p] && provs[p].calls, 0);
    if (c > best) { best = c; primary = p; }
  });
  return { ok_rate: okRate, primary: primary };
}
function _providerList(llm){
  if (!llm || !llm.providers) return [];
  return Object.keys(llm.providers).map(function(p){
    var v = llm.providers[p] || {};
    return { name:p, calls:num(v.calls,0), ok_rate:(typeof v.ok_rate==='number'?v.ok_rate:null) };
  }).sort(function(a,b){ return b.calls - a.calls; });
}
function _evalStatus(e){
  if (!e || typeof e !== 'object') return '';
  if (e.status) return String(e.status);
  if (e.latest_decision) return String(e.latest_decision);
  if (e.decisions && typeof e.decisions === 'object') {
    if (num(e.decisions.reject) > 0) return 'reject';
    if (num(e.decisions.accept) > 0) return 'accept';
  }
  return e.suites || e.count != null ? 'tracking' : '';
}
function _evalRegression(e){
  if (!e || typeof e !== 'object') return null;
  if (typeof e.regression === 'boolean') return e.regression;
  if (e.decisions && num(e.decisions.reject) > 0) return true;
  return null;
}

function setBadge(cardId, kind, txt){
  var card = el(cardId); if (!card) return;
  var b = card.querySelector('[data-lb]'); if (!b) return;
  b.className = 'lb ' + kind;
  b.innerHTML = '<span class="d"></span>' + esc(txt);
}
function setCard(cardId, cls, big, sub){
  var card = el(cardId); if (!card) return;
  card.className = 'mcard' + (cls ? (' ' + cls) : '');
  var bigEl = card.querySelector('.mbig'); if (bigEl) bigEl.textContent = (big == null ? '—' : big);
  var subEl = card.querySelector('.msub'); if (subEl) subEl.textContent = (sub == null ? '' : sub);
}
function renderMetrics(){
  var o = STATE.overview;
  if (!o || !o.metrics) {
    ['m-staff','m-jobs','m-runs','m-queue','m-heart','m-llm'].forEach(function(id){
      setCard(id, '', '—', STATE.hasToken ? 'data nahi mila' : 'login chahiye');
      setBadge(id, 'idle', '—');
    });
    return;
  }
  var m = o.metrics;
  var liveTxt = STATE.degraded ? 'live·fb' : 'live';

  // Staff (REAL count, never hardcoded)
  setCard('m-staff', 'ok', m.staff.total, m.staff.active + ' active');
  setBadge('m-staff', 'live', liveTxt);

  // Jobs
  var jcls = m.jobs.issues > 0 ? 'warn' : 'ok';
  setCard('m-jobs', jcls, m.jobs.total, m.jobs.ok + ' ok · ' + m.jobs.issues + ' issue');
  setBadge('m-jobs', 'live', liveTxt);

  // Runs (may be null if no source)
  if (m.runs.total == null) {
    setCard('m-runs', '', '—', 'process runs');
    setBadge('m-runs', 'idle', 'n/a');
  } else {
    setCard('m-runs', m.runs.running > 0 ? 'proc' : 'ok', m.runs.total, m.runs.running + ' running');
    setBadge('m-runs', 'live', liveTxt);
  }

  // Queue / DLQ
  var qcls = m.queue.dlq > 0 ? 'bad' : (m.queue.depth > 200 ? 'warn' : 'ok');
  setCard('m-queue', qcls, m.queue.depth, 'DLQ ' + m.queue.dlq);
  setBadge('m-queue', 'live', liveTxt);

  // Heartbeat
  var hcls = (m.heartbeat.total && m.heartbeat.up < m.heartbeat.total) ? 'warn' : 'ok';
  setCard('m-heart', hcls, m.heartbeat.up + '/' + m.heartbeat.total, 'jobs alive');
  setBadge('m-heart', 'live', liveTxt);

  // LLM brain
  if (m.llm.ok_rate == null) {
    setCard('m-llm', '', '—', m.llm.primary || 'no data');
    setBadge('m-llm', 'idle', 'n/a');
  } else {
    var pct = Math.round(m.llm.ok_rate * 100);
    var lcls = pct >= 85 ? 'ok' : (pct >= 50 ? 'warn' : 'bad');
    setCard('m-llm', lcls, pct + '%', m.llm.primary || 'ok-rate');
    setBadge('m-llm', 'live', liveTxt);
  }
}

function headlineSev(o){
  var h = String((o && o.headline) || '');
  if (o && o.problems && o.problems.length) return 'warn';
  if (h.indexOf('✅') >= 0) return 'ok';
  if (h.indexOf('⚠') >= 0 || h.indexOf('❌') >= 0) return 'warn';
  if (h.indexOf('🚨') >= 0) return 'bad';
  return 'idle';
}
function jobStatusClass(st){
  st = String(st || '');
  if (st === 'ok') return 'healthy';
  if (st === 'overdue') return 'waiting';
  if (st === 'last_failed') return 'failed';
  if (st === 'never_ran') return 'retry';
  if (st === 'scheduled_off') return 'idle';
  return 'idle';
}
function renderStaffGroups(staff){
  staff = staff || [];
  if (!staff.length) return '<div class="empty-line">Staff data nahi mila</div>';
  var groups = { processing:[], healthy:[], idle:[] };
  staff.forEach(function(s){ (groups[s.state] || groups.idle).push(s); });
  var out = '';
  var caps = [['processing','Working'], ['healthy','Active'], ['idle','Offline / idle']];
  caps.forEach(function(g){
    var arr = groups[g[0]];
    if (!arr.length) return;
    out += '<div class="grp-cap">' + g[1] + ' (' + arr.length + ')</div>';
    arr.forEach(function(s, idx){
      out += '<div class="srow st-' + g[0] + '" data-ins="staff" data-name="' + esc(s.name) + '">'

        + '<div class="smeta">' + (s.today || 0) + '</div></div>';
    });
  });
  return out;
}

// ---- L1 row → inspector wiring ----
function wireL1Rows(){
  var rows = document.querySelectorAll('#canvas [data-ins]');
  rows.forEach(function(row){
    row.addEventListener('click', function(){
      var kind = row.getAttribute('data-ins');
      var o = STATE.overview; if (!o) return;
      if (kind === 'prob') {
        var p = (o.problems || [])[num(row.getAttribute('data-i'))];
        if (p) openInspector('Problem', '<div class="stitle" style="font-size:13px;color:#fca5a5;line-height:1.6;margin-bottom:10px">❗ ' + esc(p.kya) + '</div>'
          + '<div class="ssub fix" style="font-size:12px;line-height:1.7">✅ fix: ' + esc(p.fix) + '</div>');
      } else if (kind === 'job') {
        var j = (o.jobs || [])[num(row.getAttribute('data-i'))];
        if (j) openInspector(j.label || 'Job', '<div class="ssub" style="font-size:12px;line-height:1.7;color:#cbd5e1">' + esc(j.line || j.status) + '</div>'
          + (j.kya ? ('<div class="ssub" style="margin-top:10px;font-size:11px;line-height:1.7">' + esc(j.kya) + '</div>') : '')
          + '<div class="grp-cap" style="margin-top:14px">Status</div><div class="ssub" style="font-size:11px">' + esc(j.status) + '</div>');
      } else if (kind === 'staff') {
        var nm = row.getAttribute('data-name');
        var s = (o.staff || []).filter(function(x){ return x.name === nm; })[0];
        if (s) openInspector(s.emoji + ' ' + s.name, '<div class="ssub" style="font-size:12px;color:#cbd5e1;line-height:1.7">' + esc(s.role || '') + '</div>'
          + '<div class="grp-cap" style="margin-top:12px">Aaj kaam</div><div class="ssub" style="font-size:12px">' + (s.today || 0) + '</div>'
          + (s.last ? ('<div class="grp-cap" style="margin-top:12px">Aakhri action</div><div class="ssub" style="font-size:11px;line-height:1.7">' + esc(s.last) + '</div>') : ''));
      }
    });
  });
}

// ════════════════════════════════════════════════════════════════
// STUB PANELS (L2 / L4) + L3 (with runs)
// ════════════════════════════════════════════════════════════════
function renderStub(title, desc, href, btn){
  var c = el('canvas');
  c.innerHTML = '<div class="panel" style="max-width:680px;margin:0 auto"><div class="panel-h"><span class="ph-t"><span class="pic">◔</span>'
    + esc(title) + '</span><span class="lb proj"><span class="d"></span>preview</span></div>'
    + '<div class="panel-b"><div class="stub-wrap">'
    + '<div class="stub-desc">' + esc(desc) + '</div>'
    + '<div class="stub-note">🚧 Coming in P2/P3 — abhi yeh honest preview stub hai. Niche wala button live page kholta hai.</div>'
    + '<a class="stub-btn" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(btn) + '</a>'
    + '</div></div></div>';
}

function renderL3(){
  var c = el('canvas');
  c.innerHTML = '<div class="panel" style="max-width:680px;margin:0 auto"><div class="panel-h"><span class="ph-t"><span class="pic">⛓</span>L3 Workflow</span>'
    + '<span class="lb proj"><span class="d"></span>preview</span></div>'
    + '<div class="panel-b"><div class="stub-wrap">'
    + '<div class="stub-desc">Process / flow runs ka live DAG, breakpoints aur replay yahan aayega. Abhi recent runs list dikha rahe hain.</div>'
    + '<div class="stub-note">🚧 Full workflow canvas Coming in P2/P3. Builder ke liye Mission Control kholo.</div>'
    + '<a class="stub-btn" href="/app/automation" target="_blank" rel="noopener">Mission Control kholo ↗</a>'
    + '<div class="runs-list" id="l3-runs"><div class="empty-line">Runs load ho rahe…</div></div>'
    + '</div></div></div>';
  loadRunsInto('l3-runs');
}

function loadRunsInto(targetId){
  var box = el(targetId); if (!box) return;
  if (!STATE.token) { box.innerHTML = '<div class="empty-line">Runs ke liye admin login chahiye</div>'; return; }
  // reuse cached runs if present
  if (STATE.runs && STATE.runs.length) { box.innerHTML = runsHtml(STATE.runs); return; }
  var bases = getApiBases();
  var ch = Promise.resolve(null);
  bases.forEach(function(b){
    ch = ch.then(function(got){
      if (got) return got;
      return fetchJSON(b + '/api/growth/process/runs', {token:STATE.token, ttl:8000, timeout:9000})
        .then(function(j){ return j; }).catch(function(){ return null; });
    });
  });
  ch.then(function(j){
    var runs = (j && Array.isArray(j.runs)) ? j.runs : [];
    STATE.runs = runs;
    box.innerHTML = runs.length ? runsHtml(runs) : '<div class="empty-line">koi run nahi</div>';
  }).catch(function(){
    box.innerHTML = '<div class="empty-line">koi run nahi</div>';
  });
}
function runsHtml(runs){
  return '<div class="grp-cap">Recent runs</div>' + runs.slice(0, 20).map(function(r){
    var st = String(r.status || '');
    var cls = (st === 'running' || st === 'active') ? '#3b82f6'
      : (st === 'done' || st === 'completed' || st === 'success') ? '#22c55e'
      : (st === 'failed' || st === 'error') ? '#ef4444'
      : (st === 'waiting' || st === 'paused' || st === 'breakpoint') ? '#eab308' : '#64748b';
    var rid = String(r.id || r.run_id || '').slice(0, 10);
    return '<div class="run-row"><span class="rdot" style="background:' + cls + '"></span>'
      + '<span class="rid mono">' + esc(rid || '—') + '</span>'
      + '<span class="rproc">' + esc(r.process || r.flow || r.name || '—') + '</span>'
      + '<span class="rstat" style="color:' + cls + '">' + esc(st || '—') + '</span></div>';
  }).join('');
}

// ════════════════════════════════════════════════════════════════
// INSPECTOR
// ════════════════════════════════════════════════════════════════
function openInspector(title, html){
  el('ins-title').textContent = title;
  el('ins-body').innerHTML = html;
  el('inspector').classList.remove('collapsed');
}
function emptyInspector(){
  el('ins-title').textContent = 'Inspector';
  el('ins-body').innerHTML = '<div class="ins-empty"><span class="ie-ic">◈</span>Kuch select karo — node / run / agent par click karo, detail yahan dikhega.</div>';
}
function closeInspector(){ el('inspector').classList.add('collapsed'); }

// ════════════════════════════════════════════════════════════════
// BOTTOM PANEL — Live Log / Recent Runs / DLQ
// ════════════════════════════════════════════════════════════════
var BOT = 'log';
function renderBottom(){
  var body = el('bot-body');
  if (BOT === 'log') {
    body.innerHTML = STATE.logs.length ? STATE.logs.slice(0, 60).map(function(l){
      return '<div class="log-line"><span class="lt mono">' + esc(l.t) + '</span><span class="lm">' + l.m + '</span></div>';
    }).join('') : '<div class="empty-line">Abhi koi event nahi — ' + (STATE.token ? 'live feed se aate hi yahan dikhenge' : 'login ke baad live feed') + '</div>';
  } else if (BOT === 'runs') {
    body.innerHTML = '<div id="bot-runs"><div class="empty-line">Runs load ho rahe…</div></div>';
    loadRunsInto('bot-runs');
  } else if (BOT === 'dlq') {
    var o = STATE.overview;
    if (o && o.metrics) {
      var q = o.metrics.queue;
      body.innerHTML = '<div class="run-row"><span class="rdot" style="background:' + (num(q.depth) > 200 ? '#eab308' : '#22c55e') + '"></span>'
        + '<span class="rproc">Celery queue depth</span><span class="rstat">' + num(q.depth) + '</span></div>'
        + '<div class="run-row"><span class="rdot" style="background:' + (num(q.dlq) > 0 ? '#ef4444' : '#22c55e') + '"></span>'
        + '<span class="rproc">DLQ (dlq:failed_tasks)</span><span class="rstat" style="color:' + (num(q.dlq) > 0 ? '#ef4444' : '#22c55e') + '">' + num(q.dlq) + '</span></div>'
        + (num(q.dlq) > 0 ? '<div class="empty-line">⚠️ DLQ retry → Mission Control · Upgrader tab</div>' : '<div class="empty-line good">✅ Queue clean</div>');
    } else {
      body.innerHTML = '<div class="empty-line">' + (STATE.token ? 'Queue data nahi mila' : 'login chahiye') + '</div>';
    }
  }
}
function pushLog(member, action, detail){
  var d = new Date();
  var t = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
  var m = (member ? ('<b>' + esc(member) + '</b> ') : '') + esc(action || '') + (detail ? (' — ' + esc(detail)) : '');
  STATE.logs.unshift({ t: t, m: m });
  if (STATE.logs.length > 120) STATE.logs.length = 120;
  if (BOT === 'log' && !el('bottom').classList.contains('collapsed')) renderBottom();
}
function setBotLive(mode){ // 'on' | 'recon' | 'off'
  var b = el('bot-live'); var tx = el('bot-live-tx');
  b.className = 'bot-live' + (mode === 'on' ? ' on' : (mode === 'recon' ? ' recon' : ''));
  tx.textContent = mode === 'on' ? 'live' : (mode === 'recon' ? 'reconnecting' : 'offline');
}

// SSE attempt → polling fallback. EventSource can't send Authorization header,
// and /api/events/stream is admin-gated (no ?token), so SSE will almost always
// fail; polling is the real path. We stay honest about the dot.
function startLiveLog(){
  if (!STATE.token) { setBotLive('off'); return; }
  setBotLive('recon');
  var base = STATE.liveBase || getApiBases()[0];
  var sseOk = false;
  try {
    if (typeof EventSource !== 'undefined') {
      var es = new EventSource(base + '/api/events/stream');
      STATE.sse = es;
      es.onopen = function(){ sseOk = true; setBotLive('on'); };
      es.onmessage = function(ev){
        sseOk = true; setBotLive('on');
        try { var d = JSON.parse(ev.data); pushLog(d.member || d.name, d.action || d.event, d.detail); }
        catch(e){ pushLog('', String(ev.data || '').slice(0, 120)); }
      };
      es.onerror = function(){
        try { es.close(); } catch(e){}
        STATE.sse = null;
        if (!sseOk) startLogPolling(); // SSE never connected → poll
      };
      // safety: if no open within 6s, fall back
      setTimeout(function(){ if (!sseOk) { try { es.close(); } catch(e){} STATE.sse = null; startLogPolling(); } }, 6000);
      return;
    }
  } catch(e){}
  startLogPolling();
}
function startLogPolling(){
  if (STATE.logTimer) return;
  setBotLive('recon');
  pollLogOnce();
  STATE.logTimer = setInterval(function(){ if (!document.hidden) pollLogOnce(); }, 20000);
}
function pollLogOnce(){
  // derive a synthetic feed from overview snapshot (no real event API w/o header)
  if (!STATE.token) { setBotLive('off'); return; }
  var o = STATE.overview;
  if (o) {
    setBotLive('on');
    // log the freshest staff actions + any problems, dedup by signature
    var sig = '';
    (o.staff || []).slice(0, 4).forEach(function(s){ if (s.last) sig += s.name + s.last; });
    (o.problems || []).slice(0, 3).forEach(function(p){ sig += p.kya; });
    if (sig && sig !== STATE._lastLogSig) {
      STATE._lastLogSig = sig;
      (o.problems || []).slice(0, 3).forEach(function(p){ pushLog('', '⚠ ' + (p.kya || '')); });
      (o.staff || []).slice(0, 3).forEach(function(s){ if (s.last) pushLog(s.name, 'action', s.last); });
      if (!(o.problems || []).length && !(o.staff || []).some(function(s){ return s.last; })) {
        pushLog('', 'snapshot refreshed · ' + ((o.metrics && o.metrics.staff.active) || 0) + ' agent active');
      }
    }
  } else {
    setBotLive('recon');
  }
}

// ════════════════════════════════════════════════════════════════
// POLLING LIFECYCLE
// ════════════════════════════════════════════════════════════════
function startPolling(){
  loadOverview();
  if (STATE.pollTimer) clearInterval(STATE.pollTimer);
  STATE.pollTimer = setInterval(function(){
    if (!document.hidden) loadOverview();
  }, 15000);
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) loadOverview();
});

// ════════════════════════════════════════════════════════════════
// CLOCK (IST)
// ════════════════════════════════════════════════════════════════
function tickClock(){
  try {
    var t = new Date().toLocaleTimeString('en-GB', { timeZone:'Asia/Kolkata', hour12:false });
    el('clock').textContent = t + ' IST';
  } catch(e){
    el('clock').textContent = new Date().toTimeString().slice(0,8) + ' IST';
  }
}

// ════════════════════════════════════════════════════════════════
// UI WIRING
// ════════════════════════════════════════════════════════════════
function initRail(){
  var collapsed = false;
  try { collapsed = localStorage.getItem('cc_rail') === '1'; } catch(e){}
  if (collapsed) el('rail').classList.add('collapsed');
  if (window.innerWidth <= 768) el('rail').classList.add('collapsed');
  el('rail-collapse').addEventListener('click', function(){
    var r = el('rail'); r.classList.toggle('collapsed');
    try { localStorage.setItem('cc_rail', r.classList.contains('collapsed') ? '1' : '0'); } catch(e){}
    el('rail-collapse').textContent = r.classList.contains('collapsed') ? '⮞' : '⮜';
  });
  el('rail-collapse').textContent = el('rail').classList.contains('collapsed') ? '⮞' : '⮜';
  document.querySelectorAll('.rail-item[data-route]').forEach(function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-route')); });
  });
}
function initBottom(){
  document.querySelectorAll('.bot-tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.bot-tab').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      BOT = t.getAttribute('data-bot');
      if (el('bottom').classList.contains('collapsed')) el('bottom').classList.remove('collapsed');
      renderBottom();
    });
  });
  el('bot-toggle').addEventListener('click', function(){
    var b = el('bottom'); b.classList.toggle('collapsed');
    el('bot-toggle').textContent = b.classList.contains('collapsed') ? '▴' : '▾';
    if (!b.classList.contains('collapsed')) renderBottom();
  });
}
function initKeys(){
  document.addEventListener('keydown', function(e){
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === '1') go('');
    else if (e.key === '2') go('stack');
    else if (e.key === '3') go('workflow');
    else if (e.key === '4') go('agent');
    else if (e.key === 'Escape') closeInspector();
  });
}

// ════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════
function boot(){
  emptyInspector();
  initRail();
  initBottom();
  initKeys();
  el('ins-close').addEventListener('click', closeInspector);
  window.addEventListener('hashchange', onRoute);
  tickClock(); setInterval(tickClock, 1000);
  onRoute();          // initial render from hash
  startPolling();     // L1 + metrics
  startLiveLog();     // bottom live log
  renderBottom();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
