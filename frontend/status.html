<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<title>LeadGen AI — System Status</title>
<link rel="stylesheet" href="/design-system/styles.css" />
<style>
body{font-family:system-ui,Arial;background:#0b1220;color:#e7ecf5;margin:0;padding:32px 16px}
.wrap{max-width:640px;margin:auto}h1{font-size:22px}
.card{background:#121b2e;border:1px solid #233252;border-radius:12px;padding:18px 20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.ok{color:#34d399;font-weight:700}.bad{color:#f87171;font-weight:700}.muted{color:#8aa0c5;font-size:13px}
a{color:#60a5fa}
</style></head>
<body>
<div style="background:linear-gradient(135deg,#080c18,#0d1629);padding:10px 18px;display:flex;align-items:center;border-bottom:1px solid rgba(99,120,199,.15)"><a href="/" style="font-weight:700;font-size:14px;color:#e2e8f0;text-decoration:none">LeadGen AI</a><div style="flex:1"></div><span class="ao-topbar-status"><span class="dot"></span>All Systems Live</span></div>
<div class="wrap">
<h1>🟢 System Status</h1>
<div class="muted" id="ts"></div>
<div class="card"><div>Platform (app)</div><div id="s-app">…</div></div>
<div class="card"><div>Database</div><div id="s-db">…</div></div>
<div class="card"><div>Cache (Redis)</div><div id="s-redis">…</div></div>
<div class="muted">Har page-load pe live check hota hai. Issue dikhe to <a href="mailto:admin@leadsgenai.in">admin@leadsgenai.in</a>.</div>
<div class="muted" style="margin-top:18px"><a href="/">← leadsgenai.in</a></div>
</div>
<script>
function set(id, ok, label){document.getElementById(id).innerHTML = ok?'<span class="ok">● Operational</span>':'<span class="bad">● '+(label||'Down')+'</span>';}
document.getElementById('ts').textContent = new Date().toLocaleString('en-IN');
fetch('/health').then(r=>{set('s-app', r.ok);return r.json()}).catch(()=>set('s-app',false));
fetch('/health/ready').then(r=>r.json()).then(j=>{
  const c=(j&&(j.checks||j))||{};
  const db=(c.database||c.db||'').toString().includes('health')||c.database==='healthy';
  const rd=(c.redis||'').toString().includes('health')||c.redis==='healthy';
  set('s-db', db, 'Degraded'); set('s-redis', rd, 'Degraded');
}).catch(()=>{set('s-db',false);set('s-redis',false);});
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body></html>
