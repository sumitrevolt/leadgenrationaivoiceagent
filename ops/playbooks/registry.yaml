# PLAYBOOK REGISTRY — LeadGen AI (LAYER: strategy selection)
# File: ops/playbooks/registry.yaml
#
# Playbooks answer: "what STRATEGY should be followed, and under what
# conditions?" They complement runbooks ("when X happens, what exactly
