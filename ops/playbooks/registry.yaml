# the normalized P0 playbooks added in this upgrade.
#
# Structure per playbook: purpose / trigger / scope / prerequisites /
# strategy / decision tree / allowed+prohibited actions / escalation /
# KPIs / guardrails / linked runbooks / evidence / owner approval.
#
# LIVE playbook detail: ops/playbooks/<id>.md. This file = machine index
# (selection + gating).
# =====================================================================
