# =====================================================================
# RUNBOOK REGISTRY — LeadGen AI (LAYER: machine-executable specs)
# File: ops/runbooks/registry.yaml
#
# Normalizes ALL runbooks (existing docs/runbooks/*.md, RB-0xx in
# docs/OPERATIONAL_RUNBOOKS.md, knowledge/operations/*) into one
# machine-readable index with a risk classifier.
#
# RISK CLASS (fail-closed; conservative wins):
#   GREEN  = autonomous execution allowed (safe, reversible, no external side effect)
#   AMBER  = execution allowed with explicit owner approval
#   RED    = human-only / prohibited autonomous action (compliance, irreversible, secrets, prod-down)
#
# When a task triggers a runbook, the orchestrator: tags -> registry ->
# verify permissions -> execute or gate. Runbook .md files stay the
# detailed source; THIS file is the machine index + decision gate.
# =====================================================================
schema_version: "1.1"
generated_at: "2026-08-28T05:35:00Z"
classifier:
  green: "autonomous"
  amber: "owner_approval_required"
  red: "human_only"

