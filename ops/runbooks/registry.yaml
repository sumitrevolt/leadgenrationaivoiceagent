# ------------------------------------------------------------- EXECUTION
execution_policy:
  gate_order: "trigger -> registry lookup -> class check -> permission check -> execute-or-gate"
  green: "agents may execute autonomously; record evidence + task update"
  amber: "agents prepare + propose; OWNER approval required before execution"
  red: "agents diagnose + document ONLY; execution is human-only"
  fail_closed: "unknown/untagged runbook or missing permission = do NOT execute; escalate"
  evidence_required: "every execution saves: actor, task_id, runbook_id, action, timestamp, result, evidence_path"